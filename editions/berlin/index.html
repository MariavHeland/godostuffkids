ren's circus has six locations across Berlin, and children can try circus skills for free. Juggling, tightrope walking, acrobatics, trapeze, clownery. During school holidays: Mon–Fri 10am–4pm workshops that anyone can walk into. 650 children train regularly every week, many of them free of charge.",st:"Try the trapeze for free — Cabuwazi (Children and Youth Circus) was founded in 1994 and now runs six permanent locations across Berlin. The philosophy is simple: circus skills should be available to every child regardless of income, and learning to do something physically difficult in front of an audience teaches courage, coordination, and self-confidence at a speed that most activities don't match. During school holidays, the big tent opens for workshop weeks where families can watch or participate. Some children discover they want to train regularly — Cabuwazi runs free weekly programmes for children aged 2 to 26, with performing groups that put on full circus shows at the end of each training term.",im:"Your child has been on the trapeze for twelve minutes and is now dangling upside down, and the circus instructor is telling them they are doing it correctly, and they are.",t:"Multiple locations — check cabuwazi.de for the nearest site and current holiday programme. Kreuzberg: Görlitzer Str. 39 (U1 Görlitzer Bahnhof). Tempelhof: Tempelhofer Ufer 10 (U6 Platz der Luftbrücke). Holiday workshops: Mon–Fri 10am–4pm. Free or donation-based. Ages 2–26.",c:["move"],r:4.7,age_min:5,age_max:16,budget:"free",pushchair:false,toilet:true,rainy:true,duration_min:60,duration_max:180,nn:"Cabuwazi — Trapez kostenlos ausprobieren",ns:"Europas größter Kinderzirkus hat sechs Standorte in Berlin, und Kinder können Zirkusfähigkeiten kostenlos ausprobieren. Jonglieren, Seiltanzen, Akrobatik, Trapez, Clownerie. In den Schulferien: Mo–Fr 10–16 Uhr Workshops, zu denen jeder einfach kommen kann.",nst:"Trapez kostenlos ausprobieren. Cabuwazi wurde 1994 gegründet und betreibt jetzt sechs feste Standorte in Berlin. Die Philosophie: Zirkusfähigkeiten sollten für jedes Kind unabhängig vom Einkommen verfügbar sein. 650 Kinder trainieren wöchentlich, viele davon kostenlos. In den Schulferien öffnet das große Zelt für Workshop-Wochen.",nt:"Mehrere Standorte — cabuwazi.de für das nächste Zirkuszelt und aktuelles Ferienprogramm. Kreuzberg: Görlitzer Str. 39 (U1 Görlitzer Bahnhof). Tempelhof: Tempelhofer Ufer 10 (U6 Platz der Luftbrücke). Ferienworkshops: Mo–Fr 10–16 Uhr. Kostenlos oder Spende. Alter 2–26.",food:"Most Cabuwazi sites have a small snack area during holiday workshops. Bring food for a full day.",quiz:[{q:"During your visit, watch another child try a new circus skill for the first time. How many attempts do they make before they get it right? What changes between each attempt?",a:"Watch carefully — you can only see this by being there",options:[],age_min:5,q_native:"Schau während deines Besuchs einem anderen Kind zu, das zum ersten Mal eine neue Zirkusfähigkeit versucht. Wie viele Versuche braucht es, bis es klappt? Was ändert sich zwischen den Versuchen?",fun_fact:"Circus training develops coordination and body awareness faster than almost any other childhood activity — because it requires the brain to learn to fail safely, which is different from learning to succeed. Neurologically, the most useful learning happens in the gap between the attempt and the success. This is why circus skills are increasingly used in therapeutic settings for children with developmental challenges."}]},{id:152,n:"Britzer Garten",a:"Neukölln",v:["nature","local","animals"],d:20,s:"Ninety hectares of proper Berlin parkland — mini-railway, cherry trees, a stream you can wade, and almost no tourists.",st:"Britzer Garten was built for the 1985 Federal Garden Show (Bundesgartenschau) and then kept open as a permanent park. For twenty years it was one of those places Berliners sent visiting relatives but never quite visited themselves. Neukölln families quietly colonised it after the Tempelhof Field crowds got too much. The model-railway circuit runs April to October and costs almost nothing. The cherry avenue along the south edge blossoms mid-April and is genuinely spectacular — but it lasts only ten days, so timing matters.",im:"Your child has just spotted the miniature steam train rounding a curve through an apple orchard. They are debating whether the driver is a real person or a robot. You do not know either.",t:"U7 Britz-Süd then 10 min walk, or Bus 179 to Britzer Garten. Alt-Britz 73, 12359 Berlin. Open daily 9am to dusk. Entry: adults €3.50, children 6–17 €1.50, under 6 free. Mini-railway: additional €2 per ride, April–Oct only. Bring a picnic — the café is fine but expensive. The wading stream near the eastern entrance is open June–Aug.",age_min:2,age_max:13,budget:"low",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:240,nn:"Britzer Garten — 90 Hektar Park, fast ohne Touristen",ns:"Fast 90 Hektar echter Berliner Parklandschaft — Minibahn, Kirschblüten, ein Bach zum Waten, und kaum Touristen.",nst:"Der Britzer Garten wurde 1985 für die Bundesgartenschau angelegt und blieb danach als Dauerpark offen. Neuköllner Familien haben ihn still für sich entdeckt, nachdem das Tempelhofer Feld zu voll wurde. Die Minibahn läuft von April bis Oktober. Die Kirschallee im Süden blüht Mitte April — aber nur zehn Tage lang.",nt:"U7 Britz-Süd, dann 10 Minuten Fußweg, oder Bus 179. Alt-Britz 73, 12359 Berlin. Täglich 9 Uhr bis Einbruch der Dunkelheit. Eintritt: Erwachsene €3,50, Kinder 6–17 €1,50, unter 6 frei. Minibahn: zusätzlich €2 pro Fahrt, April–Oktober.",food:"Café Garten on site — decent Kuchen, expensive lunch. Better to bring a blanket and food. The wading stream area has benches ideal for a picnic.",stay:"Spring visit: the cherry avenue peaks mid-April for about ten days. The mini-railway is the main draw for under-7s. The wading stream opens in June and is the highlight June–August.",greatest_hit:false,quiz:[{q:"Find the mini-railway and time one complete loop with your phone. How long does it take? How many different landscapes does it pass through?",a:"Observe carefully — you can only find this by being there",options:[],age_min:4,q_native:"Finde die Minibahn und stoppe mit dem Handy eine komplette Runde. Wie lange dauert sie? Durch wie viele verschiedene Landschaften fährt sie?",fun_fact:"The Britzer Garten miniature railway is one of only a handful of model railways in Germany where children can actually ride in the carriages rather than just watch. The track was laid during the original 1985 garden show construction and has run every summer since — making it older than many of the parents visiting today."}]},{id:153,n:"Mauerpark — Flea Market & Bearpit Karaoke",a:"Prenzlauer Berg / Wedding",v:["local","weird","free","people_watching"],d:25,s:"Sunday only: 3,000 strangers watch one person sing into a microphone. No stage. No amplifier. Just an amphitheatre and the loudest audience in Berlin.",st:"Mauerpark sits on the former death strip of the Berlin Wall — the stretch between Bernauer Straße and Gleimstraße. The name means Wall Park. The flea market has run every Sunday since the mid-1990s, expanding from a handful of blankets to over 200 stalls. The Bearpit Karaoke started in 2009 when a busker named Joe Hatchiban brought a portable sound system and invited strangers to sing. It now draws crowds of 3,000+ on warm Sundays. Nobody organises it. There is no stage manager. Someone simply takes the microphone and sings, and the crowd decides whether to cheer or politely encourage them to stop.",im:"A six-year-old has just walked to the microphone and sung the entire first verse of Let It Go in German. The crowd of two thousand people is going absolutely berserk.",t:"U2 Eberswalder Straße, 10 min walk north. Or S41/S42 Schönhauser Allee. Gleimstraße / Bernauer Straße, 10437 Berlin. Every day, but Sundays only for flea market (8am–6pm) and Bearpit Karaoke (starts roughly 3pm on warm sunny days). Entry: free. Flea market stalls: cash only, bring change.",age_min:3,age_max:99,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:60,duration_max:180,nn:"Mauerpark — Flohmarkt und Karaoke im Amphitheater",ns:"Nur sonntags: 3.000 Fremde hören zu, wie eine Person ins Mikrofon singt. Keine Bühne. Kein Verstärker. Nur ein Amphitheater und das lauteste Publikum Berlins.",nst:"Mauerpark liegt auf dem ehemaligen Todesstreifen der Berliner Mauer. Der Flohmarkt findet seit Mitte der 1990er jeden Sonntag statt. Das Bearpit-Karaoke begann 2009, als ein Straßenmusiker namens Joe Hatchiban eine tragbare Anlage mitbrachte und Fremde zum Singen einlud. Heute kommen an warmen Sonntagen über 3.000 Menschen. Niemand organisiert es.",nt:"U2 Eberswalder Straße, 10 Minuten Fußweg nördlich. Oder S41/S42 Schönhauser Allee. Gleimstraße / Bernauer Straße, 10437 Berlin. Sonntags: Flohmarkt 8–18 Uhr, Karaoke ab ca. 15 Uhr bei warmem Wetter. Eintritt: frei.",food:"Food stalls at the Sunday market — good currywurst, decent falafel, acceptable coffee. Prices fair by Berlin standards. No seating, eat on the hill.",stay:"Arrive by 2pm Sunday to get a good spot on the amphitheatre hill before karaoke starts at 3pm. Bring a blanket. Kids who want to sing: join the microphone queue early, it gets long.",greatest_hit:true,quiz:[{q:"At the Bearpit: before someone starts singing, try to predict how the crowd will react — big cheer, polite clap, or quiet. How accurate are your predictions?",a:"You can only find out by being there",options:[],age_min:5,q_native:"Im Bearpit: Versuche, bevor jemand zu singen beginnt, die Reaktion des Publikums vorherzusagen — großer Jubel, höflicher Applaus, oder Stille. Wie oft liegst du richtig?",fun_fact:"Bearpit Karaoke has no PA system, no official sound engineer, and no permit. The acoustic bowl of the amphitheatre amplifies voices naturally, which is why it works even without amplification technology. It has become one of the most genuinely spontaneous public events in any European city — and it happens every warm Sunday without anyone planning it."}]},{id:154,n:"RAW-Gelände",a:"Friedrichshain",v:["weird","local","moving_climbing","free"],d:20,s:"A disused railway repair yard that Berlin refused to demolish — now a skatepark, climbing wall, flea market, and outdoor pool in a former train shed.",st:"RAW stands for Reichsbahnausbesserungswerk — Imperial Railway Repair Works. The site operated from 1867 until reunification, when the work stopped and the buildings were left standing. Squatters moved in during the 1990s. Rather than clear it, the city allowed cultural uses to colonise the space: first a skateboard area, then a climbing wall, then a pool, then music venues. The corrugated iron roofs and exposed brick walls were never prettified. The RAW is determinedly ungentrified — though that is slowly changing.",im:"Your child is standing at the top of the outdoor climbing wall looking back at you with an expression that means: I did not know I could do that.",t:"S3/S5/S7/S9 Warschauer Straße, 3 min walk. Revaler Straße 99, 10245 Berlin. Open daily, most activities from late morning. Skatepark: free, always open. Climbing wall (Kletterturm): small fee, check berlin-klettern.de for current rates. Sommerbad RAW (outdoor pool, summer only): €5–6, check sommerbad-raw.de. Sunday flea market: 10am–6pm.",age_min:5,age_max:17,budget:"free",pushchair:false,toilet:true,rainy:false,duration_min:60,duration_max:180,nn:"RAW-Gelände — Skatepark im alten Bahnhof",ns:"Ein stillgelegtes Bahnreparaturwerk, das Berlin nicht abriss — heute Skatepark, Kletterwand, Flohmarkt und Freibad in einer ehemaligen Bahnhofshalle.",nst:"RAW steht für Reichsbahnausbesserungswerk — betrieben von 1867 bis zur Wiedervereinigung. Dann standen die Gebäude leer. In den 1990ern zogen Besetzer ein. Die Stadt erlaubte kulturelle Nutzungen: zuerst Skateboard, dann Kletterwand, dann Pool, dann Musikbühnen. Die Wellblechdächer und freiliegenden Backsteinmauern wurden nie verschönert.",nt:"S3/S5/S7/S9 Warschauer Straße, 3 Minuten Fußweg. Revaler Straße 99, 10245 Berlin. Skatepark: kostenlos, immer offen. Kletterwand: kleiner Beitrag, aktuelle Preise auf berlin-klettern.de. Sommerbad RAW: €5–6, Termine auf sommerbad-raw.de. Sonntags Flohmarkt: 10–18 Uhr.",food:"Several small food spots on site — pizza, burgers, Vietnamese. All fine. Cheap by Berlin standards. No formal restaurant.",stay:"Under-7s: the skatepark is for watching rather than doing (too advanced). Head to the Sunday flea market and climbing wall instead. Over-10s: the skatepark is the main event.",greatest_hit:false,quiz:[{q:"At the skatepark: watch the skaters for five minutes. What is the one trick you see attempted most often? How many tries before someone lands it cleanly?",a:"Count carefully — you can only find this by being there",options:[],age_min:6,q_native:"Im Skatepark: Beobachte die Skater fünf Minuten lang. Welchen Trick siehst du am häufigsten? Wie viele Versuche braucht jemand, bis er sauber landet?",fun_fact:"The RAW-Gelände skatepark is one of Berlin's oldest continuously used outdoor skateparks. The concrete was poured by skaters themselves in the late 1990s — which is why the bowl shapes are unusual. Professional skatepark designers use mathematical curves; skaters design by feel. The resulting shapes are harder for beginners but better for advanced skating, because the curves respond to the physics of how boards actually move at speed."}]}];// ── Config ────────────────────────────────────────────────────────────────────
