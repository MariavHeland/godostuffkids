{id:40,n:"Friedrichshain Skate Park — Friedrichshain",a:"Friedrichshain",v:["moving_climbing","outdoor_play"],d:20,s:"Dedicated outdoor skate park with various difficulty levels of bowls and ramps — free, no membership, all welcome.",st:"You arrive and watch skateboarders and BMX riders launching themselves. The park has beginner-friendly flat sections and challenging deep bowls. The culture is genuinely welcoming to beginners. Kids figure out their own pace. The concrete is smooth.",im:"Watching someone drop into a deep concrete bowl at speed, the sound of wheels on smooth concrete.",t:"U-Bahn U1/U5 to Friedrichshain areas. Free. Open during daylight. Bring your own board or rent from nearby shops. Helmet required (common sense). Takes 1-3 hours depending on skill level. Best on weekday afternoons when less crowded.",c:["moving_climbing","outdoor_play"],r:"g",age_min:7,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:180,nn:"Friedrichshain Skate Park — Friedrichshain",ns:"Dedizierter Outdoor Skate-Park mit verschiedenen Schwierigkeitsstufen — kostenlos und kostenlos.",nst:"Du kommst an und siehst Skateboarder und BMX-Fahrer, die sich selbst werfen. Der Park hat Anfänger-freundliche Flachbereiche.",nt:"U-Bahn U1/U5 zu Friedrichshain-Bereichen. Kostenlos. Bring dein eigenes Board.",quiz:[{q:"Is the skate park for skateboarding only?",a:"No — BMX bikes and scooters are also welcome",options:["Yes, only skateboards","No — BMX bikes and scooters are also welcome","Only experienced riders","No — it's a dog park"],age_min:6,fun_fact:"The skate park culture is that everyone progresses together — showing off is looked down on."},{q:"What's the best way to start at a skate park if you're a beginner?",a:"Practice on the flat section first, watch others, then try small ramps",options:["Jump in the deep bowl","Practice on the flat section first, watch others, then try small ramps","There's no beginner section","Rent from a shop"],age_min:8,fun_fact:"Most skate parks have unwritten rules about progression — experienced riders actually help beginners."}]},{id:41,n:"Kunsthof Dresden-inspired Walls — Kreuzberg",a:"Kreuzberg",v:["stories_and_legends","weird","imagination"],d:15,s:"Painted courtyard walls depicting surreal art and street art — visually stunning, photographed endlessly, genuinely beautiful as a place to understand street culture.",st:"You walk into courtyards and see enormous murals. Some are abstract, some are characters, some are political. The scale and color are striking. Kids understand art differently when they see real examples at this scale. It's not museum art — it's on walls in living neighborhoods.",im:"Colorful surreal paintings four storeys high on actual residential buildings, changing as you walk through different courtyards.",t:"U-Bahn U1/U6/U8 to various Kreuzberg stops (Kottbusser Tor is central). Free to see. Multiple courtyards throughout RAW-Gelände and surrounding streets. Takes 1-2 hours to explore properly. Always accessible. Quieter on weekday mornings. Great for photos but focus on actually looking too.",c:["stories_and_legends","weird","imagination_spots"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Kunsthof Mauern — Kreuzberg",ns:"Bemalte Hofwände mit surrealer Kunst und Street Art — visuell beeindruckend.",nst:"Du gehst in Innenhöfe und siehst riesige Murals. Einige sind abstrakt, einige sind Charaktere, einige sind politisch.",nt:"U-Bahn U1/U6/U8 zu verschiedenen Kreuzberg-Haltestellen. Kostenlos zu sehen.",quiz:[{q:"What makes street art different from museum art?",a:"It's public, changes, and is made in real neighborhoods",options:["It's the same","It's public, changes, and is made in real neighborhoods","It's worse","It's on walls"],age_min:8,fun_fact:"Street art has unwritten rules — you don't paint over certain pieces, just like museums protect art."},{q:"Why do the Kunsthof walls get painted so many times?",a:"Different artists paint over old art, creating new versions",options:["It's cleaned regularly","Different artists paint over old art, creating new versions","It's protected by law","No one knows"],age_min:9,fun_fact:"Some pieces have multiple layers of art underneath — like an archaeological dig of street culture."}]},{id:42,n:"Eastside Gallery (Longest Remaining Wall Section) — Friedrichshain",a:"Friedrichshain",v:["stories_and_legends","history","free"],d:20,s:"1.3km of remaining Berlin Wall, covered entirely in murals created by international artists — free to walk alongside.",st:"You stand next to an actual Wall segment. It's concrete and intimidating. Every centimetre is covered in art. Kids understand the Wall was real. The art changes — some political, some beautiful, some angry. The physical barrier feels important in a way photos don't convey.",im:"The Wall is thick, grey concrete, suddenly covered in bright art, with you standing right next to something that divided a city.",t:"S-Bahn S3/S5/S7/S75 to Ostbahnhof, then walk or tram. Free. Takes 30-60 mins to walk the full section with stops. No facilities along the wall — plan ahead. Water in summer is important. Best before 10am or after 16:00 to avoid crowds.",c:["stories_and_legends","history","free entry"],r:"g",age_min:8,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:45,duration_max:90,nn:"East Side Gallery (Längster verbleibender Mauerabschnitt) — Friedrichshain",ns:"1,3 km verbleibende Berliner Mauer, völlig mit Murals bedeckt.",nst:"Du stehst neben einem echten Mauerabschnitt. Es ist Beton und einschüchternd. Jeder Zentimeter ist mit Kunst bedeckt.",nt:"S-Bahn S3/S5/S7/S75 zum Ostbahnhof. Kostenlos. 30-60 Min. Spaziergang.",quiz:[{q:"How long is the wall section at East Side Gallery?",a:"1.3 kilometres",options:["100 metres","1.3 kilometres","5 kilometres","It's just a small section"],age_min:7,fun_fact:"This is the longest remaining piece of the Wall — most was destroyed after 1989."},{q:"Who created the murals on the East Side Gallery wall?",a:"International artists created it as a memorial after the wall fell",options:["The government","International artists created it as a memorial after the wall fell","Graffiti artists during the Cold War","No one — it was never painted"],age_min:9,fun_fact:"Over 100 artists from 21 countries painted sections — each telling different stories of the Wall."}]},{id:43,n:"Rummelsburger Bucht Industrial Beach — Friedrichshain",a:"Friedrichshain",v:["weird","water_play","beautiful"],d:20,s:"Post-industrial waterfront with abandoned power plant and small beach — moody, less touristy, genuinely atmospheric.",st:"You arrive at a beach with an eerie industrial backdrop. The power plant looms behind. It's beautiful in a broken way. Fewer families than other lakes means quieter atmosphere. Kids feel the strangeness of nature and industry mixing.",im:"Swimming with a derelict brick building and crane silhouetted on the horizon.",t:"S-Bahn S5/S7/S75 to Ostkreuz, then walk 15-20 mins. Free. Toilets minimal — plan accordingly. Water quality is good. Less crowded than Schlachtensee. Best in shoulder seasons (spring/autumn) when temperature is comfortable but not peak summer.",c:["weird","water_play"],r:"g",age_min:7,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"Rummelsburger Bucht Industriestrand — Friedrichshain",ns:"Post-industrielle Wasserkante mit verlassenem Kraftwerk und Strand.",nst:"Du kommst an einem Strand mit unheimlichem Industrie-Hintergrund an. Das Kraftwerk erhebt sich dahinter.",nt:"S-Bahn S5/S7/S75 zum Ostkreuz, dann 15-20 Min. zu Fuß. Kostenlos.",quiz:[{q:"What industrial structure is visible from Rummelsburger Bucht?",a:"An abandoned power plant (Kraftwerk)",options:["A factory","An abandoned power plant (Kraftwerk)","A hospital","Nothing — it's natural"],age_min:7,fun_fact:"The power plant was decommissioned in the 1990s — now it's just a monument to industrial Berlin."},{q:"Why is Rummelsburger Bucht less crowded than other Berlin lakes?",a:"It's harder to reach and the industrial setting isn't 'family beach' vibes",options:["It's dirty","It's harder to reach and the industrial setting isn't 'family beach' vibes","It's dangerous","It's actually more crowded"],age_min:8,fun_fact:"To locals, it's a secret beach — tourists go to Müggelsee and Schlachtensee."}]},{id:44,n:"Tegeler Forst Nature Reserve — Tegeler",a:"Tegeler",v:["wild","quiet","beautiful"],d:20,s:"Lesser-known forest reserve with ancient trees, quiet trails, and minimal crowds — a real escape from the city.",st:"You walk into dense forest that feels untouched. There are huge old trees. Paths are soft earth and quiet. No playgrounds, no facilities, just trees and birds. It's genuinely wild-feeling even though you're still in Berlin. Kids slow down here.",im:"Ancient forest, dappled light, silence except for bird sounds and your footsteps on earth.",t:"U-Bahn U6 to Tegeler Straße, then walk or bus. Free. No facilities — bring everything. Paths are sometimes muddy. Not pushchair-friendly beyond main paths. Best in spring (new growth) or autumn (colors). A quiet mission rather than a full-day activity.",c:["wild","quiet","beautiful"],r:"g",age_min:6,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Tegeler Forst Naturschutzgebiet — Tegeler",ns:"Weniger bekanntes Waldreservat mit alten Bäumen und leisen Pfaden.",nst:"Du gehst in dichten Wald, der sich unberührt anfühlt. Es gibt riesige alte Bäume.",nt:"U-Bahn U6 zur Tegeler Straße. Kostenlos. Keine Einrichtungen.",quiz:[{q:"What makes Tegeler Forst different from Grunewald?",a:"It's smaller, quieter, and less developed with fewer facilities",options:["It's bigger","It's smaller, quieter, and less developed with fewer facilities","It's near water","Nothing — they're the same"],age_min:8,fun_fact:"Tegeler Forst is a nature reserve, not a park — meaning it's protected and not 'designed' for humans."},{q:"Why would you choose Tegeler Forst for a walk?",a:"For quiet, solitude, and feeling genuinely in nature",options:["For playgrounds","For quiet, solitude, and feeling genuinely in nature","For crowds","No reason"],age_min:7,fun_fact:"If you want to see wildlife (deer, foxes), Tegeler Forst is one of the best bets in Berlin."}]},{id:45,n:"Humboldt Box (Virtual History Center) — Mitte",a:"Mitte",v:["rainy_day","discover"],d:20,s:"Temporary structure with immersive exhibits about Berlin's history and the future Humboldt Forum — indoor, all weather.",st:"You enter and there are large-scale exhibits and projections telling Berlin's story. It's multimedia but not infantilized. Kids stand and watch history unfold on screens, understand context through interactive elements. The building itself is temporary (shipping containers) but the content is sophisticated.",im:"Walking into a room where Berlin's entire history is projected and animated on walls around you.",t:"S-Bahn or U-Bahn to Museum Island area. Admission €9 pp (kids often reduced). Takes 1-2 hours. Fully indoors. Toilets. Food options nearby. Weather-proof rainy day option.",c:["rainy_day","discover","history"],r:"g",age_min:7,age_max:14,budget:"cheap",pushchair:true,toilet:true,rainy:true,duration_min:60,duration_max:120,nn:"Humboldt Box (Virtuelles Geschichtszentrum) — Mitte",ns:"Temporäre Struktur mit immersiven Ausstellungen über Berlins Geschichte.",nst:"Du betrittst und es gibt großformatige Ausstellungen und Projektionen, die Berlins Geschichte erzählen.",nt:"S-Bahn oder U-Bahn zum Museumsinsel-Bereich. Eintritt €9 pro Person.",quiz:[{q:"What's the Humboldt Box made from?",a:"Stacked shipping containers",options:["Wood","Stacked shipping containers","Glass","Stone"],age_min:6,fun_fact:"The temporary building is actually a beautiful example of creative architecture — it will eventually be replaced by the Humboldt Forum."},{q:"What history does the Humboldt Box teach?",a:"Berlin's complete history through immersive exhibits",options:["Only WWII","Berlin's complete history through immersive exhibits","Future predictions only","No history — it's just technology"],age_min:8,fun_fact:"The exhibits are updated regularly — it's a living exhibition, not static."}]},{id:46,n:"Köpenick Island and Schloss Köpenick — Köpenick",a:"Köpenick",v:["stories_and_legends","beautiful"],d:25,s:"Island with a Baroque palace, museum, and riverside walks — less touristy than central palaces but genuinely charming.",st:"You arrive on an actual island in the Spree. The palace is visible. The interior is livable-scale (unlike Charlottenburg's grandeur). The island has paths along water. There's a sense of 'historical Berlin' without feeling designed for tourism.",im:"Walking across bridges onto an island, seeing a palace reflection in the Spree.",t:"S-Bahn S3 to Köpenick. Palace museum admission €5-7 pp (kids often free). Free to walk the island grounds. Toilets. Café nearby. Takes 1.5-2 hours to see meaningfully. Less crowded than Museum Island or Charlottenburg.",c:["stories_and_legends","beautiful"],r:"g",age_min:6,age_max:14,budget:"cheap",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:150,nn:"Köpenicker Insel und Schloss Köpenick — Köpenick",ns:"Insel mit Barock-Palast, Museum und Spree-Spaziergängen.",nst:"Du kommst auf einer echten Insel in der Spree an. Der Palast ist sichtbar. Es gibt Wege entlang des Wassers.",nt:"S-Bahn S3 zum Köpenick. Palast-Museum €5-7 pro Person. Kostenlos, die Inselgrundstücke zu gehen.",quiz:[{q:"What's unique about Schloss Köpenick compared to other Berlin palaces?",a:"It's on an island in the river and feels more residential than grand",options:["It's newer","It's on an island in the river and feels more residential than grand","It's bigger","There's nothing unique"],age_min:7,fun_fact:"The palace is Baroque but intimate — you feel like real royalty lived here, not just for show."},{q:"Why is Köpenick Island historically important?",a:"It was a strategic location on the Spree historically",options:["No historical importance","It was a strategic location on the Spree historically","It's new","It's not important"],age_min:8,fun_fact:"Köpenick is one of the oldest settlements in Berlin — it existed before Berlin itself did."}]},// ══════ ARCHITECTURE & HISTORY (FAMILY-FRIENDLY) ══════
{id:100,n:"Hinterhöfe of Sophienstraße — Mitte",a:"Mitte",v:["hidden","history","imagination"],d:30,s:"Courtyards that survived the war — step through doorways and find chains of hidden courtyards from the 1800s.",st:"Kids immediately understand this is a secret. You walk through an ordinary door into another world. Chains of courtyards, each different — workshops, apartments, gardens. Most survived the bombing. Old signage and metal work if you look up. The scale is human, not overwhelming.",im:"Through a doorway into 1920. Tailors, metalworkers, printers in the courtyards. Gas lamps. Bell wires. A child running between buildings notices every detail.",t:"Sophienstraße, Mitte. Many courtyards are semi-public and accessible through unlocked doorways. Be quiet and respectful — people live here. U-Bahn U2 to Rosa-Luxemburg-Platz. Free. Age 6+, though younger kids enjoy the discovery. No pushchair access through narrow doorways.",c:["imagination_spots","history"],r:"g",age_min:6,age_max:13,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:45,duration_max:90,nn:"Hinterhöfe der Sophienstraße",ns:"Versteckte Hinterhöfe vom Krieg überlebt — gehe durch Türen und entdecke Kettenhöfe aus dem 18. Jahrhundert.",nst:"Kinder verstehen sofort: Das ist ein Geheimnis. Du gehst durch eine normale Tür in eine andere Welt. Ketten von Höfen, jeder anders — Werkstätten, Wohnungen, Gärten. Die meisten überlebten die Bomben.",nt:"Sophienstraße, Mitte. Viele Höfe sind halb-öffentlich und durch Türen zugänglich. Leise sein — Menschen wohnen hier. U-Bahn U2 zur Rosa-Luxemburg-Platz. Kostenlos.",quiz:[{q:"How many connected courtyards can you walk through on Sophienstraße?",a:"At least 4-6 connected courtyards",options:["Just 1","At least 4-6 connected courtyards","Over 10","You can't walk through any"],age_min:7,q_native:"Wie viele verbundene Höfe kannst du in der Sophienstraße durchqueren?",fun_fact:"These courtyards were built so tightly together that you could work, live, shop, and get water without ever leaving the courtyard block — like a city inside a block."},{q:"What trades and crafts did people do in these courtyards?",a:"Tailors, metalworkers, printers, shoemakers",options:["Only tailors","Tailors, metalworkers, printers, shoemakers","Bakers only","No work — just homes"],age_min:8,q_native:"Welche Handwerke und Gewerbe gab es in diesen Höfen?",fun_fact:"The sign-painting on the old doorways sometimes still shows what shop was inside — look for the faded letters."}]},{id:101,n:"Bebelplatz — Mitte",a:"Mitte",v:["history","quiet"],d:15,s:"Where the Nazis burned 20,000 books in 1933 — look down through the glass at the empty bookshelves below.",st:"This is history kids can physically stand at. A glass panel in the ground — at night it's lit from below, showing white empty bookshelves. May 10, 1933: Nazi students burned 20,000 books of Freud, Einstein, Mann, Kafka. Kids understand: this is where burning books happened. The message is in the emptiness.",im:"Underground, white bookshelves glow in the dark. Above, students once threw books into a fire while crowds watched.",t:"Bebelplatz, Mitte (between Unter den Linden and Französische Straße). Free, always accessible. Best at night when the memorial is lit. Age 9+ for the historical weight. No entry restriction, but explain why this matters before you go.",c:["history","older_kids"],r:"g",age_min:9,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:15,duration_max:45,nn:"Bebelplatz",ns:"Wo 1933 20.000 Bücher verbrannt wurden — schau durch das Glas auf die leeren Bücherregale darunter.",nst:"Das ist Geschichte, die Kinder physisch betreten. Eine Glasplatte im Boden — nachts von unten beleuchtet und zeigt weiße leere Regale. Dein Kind versteht: Hier passierte das Bücherverbrennen.",nt:"Bebelplatz, Mitte. Kostenlos, immer zugänglich. Nachts am besten, wenn das Denkmal beleuchtet ist. Ab 9 Jahren für das Gewicht der Geschichte.",quiz:[{q:"What do you see through the glass in the ground at Bebelplatz?",a:"Empty white bookshelves lit from below",options:["A book burning happening","Empty white bookshelves lit from below","A train station","Nothing — it's just glass"],age_min:9,q_native:"Was siehst du durch das Glas im Boden am Bebelplatz?",fun_fact:"The memorial is called the 'Invisible Library' — you see the absence, not the presence. That's what makes it so powerful."},{q:"In what year did the book burning happen at this square?",a:"1933",options:["1919","1933","1945","1989"],age_min:10,q_native:"In welchem Jahr fand die Bücherverbrennung auf diesem Platz statt?",fun_fact:"The writer Heinrich Heine predicted it 100 years earlier: 'Where they burn books, they will also burn people.' And he was right."}]},{id:102,n:"Reichstag Dome — Mitte",a:"Mitte",v:["free","beautiful","high_spots"],d:30,s:"Glass dome of parliament — free but register online first. Spiral ramp up with views down into the chamber and across Berlin.",st:"Kids feel small and important at the same time. The dome is transparent — you're literally above parliament, looking down at where history happens. The audio guide explains what you're seeing. Burned 1933, bombed 1945, wrapped by Christo 1995, rebuilt by Foster.",im:"Glass around you in every direction. Above: sky. Below: the chamber where laws are made. Beyond: all of Berlin.",t:"Register free at bundestag.de days in advance (not the tourist entrance — the actual parliamentary dome, different building). Best early morning to avoid crowds. Takes 45 mins. Age 8+. Steps — not pushchair accessible to the top.",c:["high_spots","history","free","greatest_hits_kids"],r:"g",age_min:8,age_max:14,budget:"free",pushchair:false,toilet:true,rainy:true,duration_min:45,duration_max:90,nn:"Reichstag Kuppel",ns:"Glaskuppel des Parlaments — kostenlos (online voranmelden). Spiralramp hinauf mit Blick ins Parlament und über Berlin.",nst:"Kinder fühlen sich klein und wichtig zugleich. Die Kuppel ist transparent — du stehst buchstäblich über dem Parlament. Der Audioguide erklärt, was du siehst.",nt:"Bundestag.de im Voraus kostenlos anmelden. Nicht die Tourist-Rampe — die echte Parlamentskuppel, anderes Gebäude. Früh morgens am besten. 45 Min.",quiz:[{q:"What colour is the glass of the Reichstag dome?",a:"Transparent/clear glass — you can see the sky through it",options:["Blue tinted","Transparent/clear glass — you can see the sky through it","Mirrored","White frosted"],age_min:8,q_native:"Welche Farbe hat das Glas der Reichstag-Kuppel?",fun_fact:"The architect Norman Foster put the people (you, on the dome) above their politicians (below, in the chamber). This was intentional."},{q:"What rooms are visible below the glass while you look down into the Parliament?",a:"The main chamber where laws are debated",options:["The cafeteria only","The main chamber where laws are debated","Storage rooms","You can't see any rooms from above"],age_min:9,q_native:"Was kannst du durch das Glas hinunter ins Parlament sehen?",fun_fact:"If parliament is in session while you're up there, you can watch politicians actually debating — it's the same people making the laws right now."}]},{id:103,n:"Hackesche Höfe — Mitte",a:"Mitte",v:["beautiful","courtyards","shopping"],d:25,s:"Eight interconnected courtyards with Art Nouveau tile work — walk deep and quiet emerges.",st:"Eight courtyards from 1906. The first is tourist-packed. Walk through. Courtyards 5, 6, 7 quiet down entirely. Kids notice the tiled walls — blue and gold — and start looking for details: the initials of the tiler, the pattern changes, the courtyards getting subtly smaller. The architecture becomes a game.",im:"Jugendstil blue tiles with gold geometric patterns. Each courtyard slightly different light and scale.",t:"Rosenthaler Straße 40-41, Mitte. Free to walk through all 8 courtyards. U-Bahn U8 to Weinmeisterstraße. Go deep — the traffic quiets after courtyard 3. Best weekday mornings.",c:["imagination_spots","history","beautiful"],r:"g",age_min:6,age_max:13,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:30,duration_max:60,nn:"Hackesche Höfe",ns:"Acht verbundene Höfe mit Jugendstilornamentik — gehe tief und Stille ergibt sich.",nst:"Acht Höfe von 1906. Der erste ist touristisch überlaufen. Gehe durch. Höfe 5, 6, 7 werden völlig ruhig. Kinder bemerken die Fliesen — Blau und Gold.",nt:"Rosenthaler Straße 40-41, Mitte. Kostenlos. U-Bahn U8 zur Weinmeisterstraße. Gehe tief — der Verkehr wird nach Hof 3 ruhiger.",quiz:[{q:"How many connected courtyards are in Hackesche Höfe?",a:"Eight",options:["Three","Five","Eight","Over 15"],age_min:6,q_native:"Wie viele verbundene Höfe gibt es in den Hackeschen Höfen?",fun_fact:"The first courtyard has a theater and shops. The deeper courtyards are where local workers lived in tiny apartments around the courtyards."},{q:"What style of tile decoration covers the walls?",a:"Art Nouveau (Jugendstil) with blue and gold tiles",options:["Modern minimalist","Art Nouveau (Jugendstil) with blue and gold tiles","Baroque","Victorian tiles"],age_min:7,q_native:"Welcher Baustil schmückt die Wände?",fun_fact:"The tiles were handmade and fired in local kilns — look for subtle color variations, which show they're not factory-made copies."}]},{id:104,n:"Humboldt Forum Roof Terrace — Mitte",a:"Mitte",v:["free","high_spots","beautiful"],d:25,s:"Best free view in central Berlin — TV tower, Museum Island, Unter den Linden. No entry fee, no tourist queue.",st:"Free rooftop terrace. TV tower, Museum Island lights, Unter den Linden stretching away. Most tourists pay €30+ to go inside. The terrace is free and almost nobody knows. Kids get the view without the museum crowds.",im:"500 years of reinvention. Prussian royal palace, then East German parliament building, then empty lot, now palace again. From the roof you see it all.",t:"West side entrance, elevator to terrace. Free. No booking needed — just walk in. Best at golden hour. Toilets inside. U-Bahn U2/U5 or S-Bahn S3/S5/S7/S9 to Friedrichstraße.",c:["high_spots","free","greatest_hits_kids"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:30,duration_max:60,nn:"Humboldt Forum Dachterrasse",ns:"Bester kostenloser Blick im Zentrum Berlins — Fernsehturm, Museumsinsel, Unter den Linden.",nst:"Kostenlose Dachterrasse. Fernsehturm, Museumsinsel-Lichter, Unter den Linden. Die meisten Touristen zahlen €30+. Die Terrasse ist kostenlos.",nt:"Westeingang, Fahrstuhl zur Terrasse. Kostenlos. Keine Anmeldung nötig. Am schönsten zur goldenen Stunde.",quiz:[{q:"What three major Berlin landmarks can you see from the Humboldt Forum roof terrace?",a:"TV tower, Museum Island buildings, and Unter den Linden stretching away",options:["Only the river","TV tower, Museum Island buildings, and Unter den Linden stretching away","The Brandenburg Gate only","No landmarks — just sky"],age_min:7,q_native:"Welche drei Berliner Wahrzeichen kannst du von der Dachterrasse sehen?",fun_fact:"The Humboldt Forum building is built on the exact spot where the Prussian royal palace stood for 300 years. They literally rebuilt it after it was destroyed in WWII."},{q:"Why is the view from the terrace considered the best free view in central Berlin?",a:"Because you can see almost all the major landmarks without paying entry or facing crowds",options:["It's the tallest building in Berlin","Because you can see almost all the major landmarks without paying entry or facing crowds","Because the terrace has restaurant seating","It's not — there are better free views"],age_min:9,q_native:"Warum ist die Aussicht von der Terrasse die beste kostenlose Aussicht im Zentrum?",fun_fact:"Most tourists never find this terrace because it's not advertised like the paid Humboldt Forum museum entrance. It's a real local secret."}]},// ══════ PARKS & NATURE ══════
{id:105,n:"Viktoriapark — Kreuzberg",a:"Kreuzberg",v:["beautiful","nature","high_spots"],d:35,s:"A 24-metre waterfall and the highest point in inner Berlin — built in 1894 to prove you could have nature in the city.",st:"Kids climb to the waterfall first. Real water cascading over rocks. Then to the top: an iron cross monument (that's where Kreuzberg gets its name) and a view of the entire city spreading out. Built by workers hauling massive boulders to create an artificial mountain in flat Berlin.",im:"Workers in the 1890s dragging stones uphill to invent a landscape that doesn't exist. Now kids scramble up rocks to find water falling from sky-height.",t:"Kreuzbergstraße entrance (U-Bahn U6/U1 to Hallesches Tor). Free. Climb to the top via the waterfall (follow the water). Best before 11am on weekends. Rocks can be slippery after rain.",c:["high_spots","nature","beautiful","free"],r:"y",age_min:5,age_max:12,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Viktoriapark",ns:"24-Meter-Wasserfall und höchster Punkt im Innenstadtbereich — 1894 erbaut um zu beweisen, dass man Natur in der Stadt haben kann.",nst:"Kinder erklimmen zuerst den Wasserfall. Echtes Wasser über Felsen. Dann oben: eisernes Kreuz und Blick über die ganze Stadt.",nt:"Kreuzbergstraße-Eingang. U-Bahn U6/U1 zur Hallesches Tor. Kostenlos. Felsen können nach Regen rutschig sein.",quiz:[{q:"How high is the waterfall at Viktoriapark?",a:"24 metres",options:["10 metres","24 metres","50 metres","100 metres"],age_min:6,q_native:"Wie hoch ist der Wasserfall im Viktoriapark?",fun_fact:"The waterfall is completely artificial — it was built in 1894 as a way to bring nature to the city. The water comes from the city's water system, not from a natural spring."},{q:"What monument stands at the top of the hill, and what does it commemorate?",a:"An iron cross that gave Kreuzberg district its name",options:["A statue of a general","An iron cross that gave Kreuzberg district its name","A clock tower","A monument to victims of war"],age_min:7,q_native:"Welches Denkmal steht oben auf dem Hügel?",fun_fact:"The district is called Kreuzberg because of this iron cross — 'Kreuz' means cross in German, 'Berg' means mountain."}]},{id:106,n:"Körnerpark — Neukölln",a:"Neukölln",v:["beautiful","parks","history"],d:35,s:"A green crater in the middle of Neukölln — 1920s mansion gardens with an Art Deco pergola.",st:"It's a depression in the city. The park is sunken below street level. Walk down steps and suddenly you're in a garden from the 1920s. Art Deco pergola. Mansion ruins that used to overlook all this. Kids notice the scale immediately — it feels like an archaeological site in the middle of the neighbourhood.",im:"Below the street, a terraced garden from another era. Pergola and geometric paths that feel deliberate, designed.",t:"Körnerpark, Neukölln (U-Bahn U7 to Neukölln). Free. Best spring to early autumn when the gardens are maintained. Sit and watch the people.",c:["imagination_spots","beautiful","parks"],r:"g",age_min:6,age_max:12,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:45,duration_max:90,nn:"Körnerpark",ns:"Ein grüner Krater mitten in Neukölln — 1920er-Jahre-Gartenschloss mit Art-Deco-Pergola.",nst:"Es ist eine Mulde in der Stadt. Der Park liegt unter Straßenniveau. Gehe Treppen hinunter und plötzlich bist du in einem Garten aus den 1920ern.",nt:"Körnerpark, Neukölln. U-Bahn U7 zum Neukölln. Kostenlos.",quiz:[{q:"How is the Körnerpark different from most Berlin parks?",a:"It's sunken below street level, like a green crater",options:["It has a lake","It's sunken below street level, like a green crater","It's on top of a building","It's indoors"],age_min:6,q_native:"Wie unterscheidet sich der Körnerpark von anderen Berliner Parks?",fun_fact:"The park was created on the grounds of the Villa Körner, which was destroyed in WWII. The sunken garden is all that's left."},{q:"What architectural feature dominates the garden?",a:"An Art Deco pergola",options:["A fountain","An Art Deco pergola","A castle","A church"],age_min:7,q_native:"Welches architektonische Element dominiert den Garten?",fun_fact:"Art Deco was about geometric patterns and clean lines — you can see this in the pergola and path design."}]},{id:107,n:"Lietzensee Park — Charlottenburg",a:"Charlottenburg",v:["nature","water_play","free"],d:25,s:"A lake in Charlottenburg where families actually swim — shallow beach, shaded parks, old-fashioned picnic vibes.",st:"It's small and manageable. Families cluster on the grass. A proper shallow beach (not rock). The water is clean enough — it's fed by groundwater. Kids wade in without fear. Older kids can swim. The park is dense with trees, so there's shade everywhere.",im:"A lake surrounded by old Berlin residential streets. The shore is sandy and gentle. Families pass bread to the ducks.",t:"U-Bahn U2/U7 to Wilmersdorfer Straße, then walk. Free. Changing facilities in summer. Bring socks — muddy entry. Best June-August for warm water.",c:["water_play","parks","nature","picnic","free"],r:"g",age_min:3,age_max:12,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"Lietzensee Park",ns:"Ein See in Charlottenburg, wo Familien wirklich schwimmen — flacher Strand, schattige Parks.",nst:"Es ist klein und überschaubar. Familien sitzen auf dem Gras. Ein richtiger flacher Strand, nicht Steine. Das Wasser ist sauber genug.",nt:"U-Bahn U2/U7 zur Wilmersdorfer Straße, dann zu Fuß. Kostenlos.",quiz:[{q:"How deep can you wade into Lietzensee before it gets deep?",a:"Very shallow for quite far — good for toddlers and non-swimmers",options:["Immediately deep","Very shallow for quite far — good for toddlers and non-swimmers","It has a drop-off at the shore","You can't wade at all"],age_min:5,q_native:"Wie tief ist das Wasser im Lietzensee am Anfang?",fun_fact:"Lietzensee is fed by groundwater, not by rivers, so the water is very clean and clear."},{q:"What kind of beach does Lietzensee have?",a:"Sandy beach with gentle slope",options:["Rocky","Sandy beach with gentle slope","Concrete","No beach — just grass"],age_min:5,q_native:"Was für einen Strand hat der Lietzensee?",fun_fact:"The sandy bottom means kids can walk without worrying about sharp rocks or sudden drop-offs."}]},{id:108,n:"Tegeler Forst — Reinickendorf",a:"Reinickeldorf",v:["nature","free","hidden"],d:60,s:"An ancient forest at the edge of the city where locals go to forget they're in Berlin.",st:"You step off the U-Bahn into forest. Real forest — trees older than the city. Walking paths, streams, absolutely quiet. Kids immediately become explorers. The scale is huge. The shade is deep. This is where you come when you need to remember what trees feel like.",im:"Walking under a canopy of oak, birch, and pine. Sunlight comes in shafts. The city noise stops completely.",t:"U-Bahn U6 to the end (Tegel). Then walk into the Forst. Free. Takes 20 mins to feel like you're far from the city. Best spring to autumn. Bring water — no shops inside.",c:["nature","science_outdoors","hidden","free"],r:"g",age_min:5,age_max:13,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"Tegeler Forst",ns:"Ein uralter Wald am Stadtrand, wo Ortsansässige hingehen um zu vergessen, dass sie in Berlin sind.",nst:"Du steigst aus der U-Bahn in den Wald. Echter Wald — Bäume älter als die Stadt. Wanderwege, Bäche, absolut still.",nt:"U-Bahn U6 zum Ende (Tegel). Dann in den Forst gehen. Kostenlos. Bring Wasser — keine Läden.",quiz:[{q:"How quickly does the city noise disappear when you walk into Tegeler Forst?",a:"Within 10-20 minutes of walking",options:["Immediately","Within 10-20 minutes of walking","It never disappears","After hours of walking"],age_min:7,q_native:"Wie schnell verschwindet der Stadtkrach im Tegeler Forst?",fun_fact:"This forest is one of the oldest in Berlin — some of the trees are over 200 years old, older than modern Berlin."},{q:"What types of trees are in Tegeler Forst?",a:"Oak, birch, pine, and other temperate forest trees",options:["Only pine","Oak, birch, pine, and other temperate forest trees","Tropical trees","No specific trees — just a meadow"],age_min:7,q_native:"Welche Baumarten gibt es im Tegeler Forst?",fun_fact:"The mix of different trees creates different light and different habitats for animals — some areas are bright and open, others dense and dark."}]},{id:109,n:"Teufelsberg — Grunewald",a:"Grunewald",v:["weird","history","high_spots"],d:90,s:"A mountain made of World War II rubble — 114 metres high. At the top: a ruined spy station and views across the Grunewald forest.",st:"Kids understand this immediately: the mountain isn't natural. It's made of the city's own destroyed buildings. 400,000 tons of rubble from the war, piled and packed. Kids climb to the top. The remains of a Cold War spy station sit at the summit like a monument to paranoia. The view is extraordinary — forest to every horizon.",im:"A teenager climbing stairs made of war rubble toward the shell of a spy facility, now just a ruin. The scale of destruction required to build the mountain makes history physical.",t:"S-Bahn S3/S9 to Grunewald, then walk uphill through forest (1 hour). The trail is marked. Entry €10 per person in summer (seasonal). Toilets at base in summer.",c:["high_spots","weird","history","moving_climbing"],r:"g",age_min:8,age_max:14,budget:"cheap",pushchair:false,toilet:true,rainy:false,duration_min:150,duration_max:240,nn:"Teufelsberg",ns:"Ein Berg aus Trümmern des Zweiten Weltkriegs — 114 Meter hoch. Oben: eine zerstörte Spionagestation.",nst:"Kinder verstehen das sofort: Der Berg ist nicht natürlich. Er besteht aus den zerstörten Gebäuden der Stadt.",nt:"S-Bahn S3/S9 zum Grunewald, dann Wanderung uphill (1 Stunde). €10 pro Person.",quiz:[{q:"What is Teufelsberg made of?",a:"Rubble and debris from destroyed buildings during World War II",options:["Dirt and rock","Rubble and debris from destroyed buildings during World War II","Concrete blocks","Artificial plastic material"],age_min:8,q_native:"Woraus besteht der Teufelsberg?",fun_fact:"After WWII, Berlin had to deal with 400,000 tons of rubble from destroyed buildings. They made a decision: pile it all into a mountain. So Teufelsberg is literally made of the war."},{q:"What ruins stand at the top of Teufelsberg?",a:"A Cold War spy listening station",options:["An old fort","A Cold War spy listening station","A castle","A church"],age_min:9,q_native:"Welche Ruinen stehen auf der Spitze des Teufelsberg?",fun_fact:"East Germany and the Soviet Union used this station to listen to radio signals from West Berlin and NATO. It was one of the most important spy stations of the Cold War."}]},{id:110,n:"Monbijoupark along the Spree — Mitte",a:"Mitte",v:["romantic_water","parks","beautiful"],d:20,s:"Steps down to the Spree with Museum Island glowing across the water — locals know this spot.",st:"The park is on the Spree shore. Walk down to the water's edge. Museum Island rises across the water, lit up at night. In summer, there are free swing or tango nights. Kids notice the reflections and the boats passing. The view alone is worth it.",im:"Evening: Museum Island glows across the water. A local sits on steps with a beer. A couple dances.",t:"Park between Schiffbauer Damm and Fischerinsel. U-Bahn U2/U5 to Spittelmarkt. Best visited in summer evenings when the park is busy. Bring a blanket.",c:["romantic_water","parks","beautiful"],r:"y",age_min:5,age_max:13,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:45,duration_max:120,nn:"Monbijoupark an der Spree",ns:"Treppen zur Spree mit Museumsinsel, die über dem Wasser leuchtet.",nst:"Der Park ist am Spreeufer. Gehe hinunter bis zum Wasser. Die Museumsinsel erhebt sich über dem Wasser, nachts beleuchtet.",nt:"Park zwischen Schiffbauer Damm und Fischerinsel. U-Bahn U2/U5 zur Spittelmarkt. Sommer am besten.",quiz:[{q:"What island can you see from Monbijoupark across the water?",a:"Museum Island",options:["Peace Island (Pfaueninsel)","Museum Island","Spree Island","No island — just the opposite shore"],age_min:6,q_native:"Welche Insel kannst du vom Monbijoupark über das Wasser sehen?",fun_fact:"Museum Island has five world-class museums on it — you can see the building silhouettes from the park."},{q:"What body of water forms the boundary between Monbijoupark and Museum Island?",a:"The Spree River",options:["The Landwehrkanal","The Spree River","The Wall","A moat"],age_min:6,q_native:"Welcher Fluss trennt den Monbijoupark von der Museumsinsel?",fun_fact:"The Spree winds through Berlin for over 40 kilometres — it's the heart of the city's water system."}]},// ══════ MARKETS & STREET LIFE ══════
{id:111,n:"Markthalle Neun — Kreuzberg",a:"Kreuzberg",v:["local","free","beautiful"],d:45,s:"1891 iron market hall — beautiful architecture, free to wander.",st:"A gorgeous iron building with soaring columns and natural light. Thursday is Street Food Thursday (from 5pm) — street vendors, music, atmosphere is electric. Even without buying, kids see how a historic market building works. The architecture speaks: this was built for the people.",im:"Iron columns reaching up like trees. Natural light streaming through the glass roof. The smell of food and old wood.",t:"Eisenbahnstraße 42-43, Kreuzberg (U-Bahn U1 to Görlitzer Straße). Free to walk. Thursday Street Food from 5pm — vendors change weekly. Best if you go hungry. Kid-friendly street food available every Thursday.",c:["markets","beautiful","free"],r:"g",age_min:5,age_max:13,budget:"cheap",pushchair:true,toilet:false,rainy:true,duration_min:30,duration_max:90,nn:"Markthalle Neun",ns:"1891 Eisenmarkthalle — wunderbare Architektur, kostenlos zum Umhergehen.",nst:"Ein wunderbar eisernes Gebäude mit hohen Säulen und natürlichem Licht. Donnerstag ist Street Food Thursday — Straßenverkäufer, Musik.",nt:"Eisenbahnstraße 42-43, Kreuzberg. U-Bahn U1 zur Görlitzer Straße. Kostenlos.",quiz:[{q:"What year was Markthalle Neun built?",a:"1891",options:["1850","1891","1920","1960"],age_min:6,q_native:"In welchem Jahr wurde die Markthalle Neun erbaut?",fun_fact:"In 1891, iron buildings were cutting-edge technology. The market hall was a symbol of modern Berlin."},{q:"What architectural material dominates the interior of the market hall?",a:"Iron (cast iron columns and beams)",options:["Brick","Iron (cast iron columns and beams)","Wood","Concrete"],age_min:7,q_native:"Welches Material dominiert das Innere der Markthalle?",fun_fact:"The iron columns are so tall and elegant that the space feels open and full of light — even though it's covered, it doesn't feel like you're indoors."}]},{id:112,n:"Turkish Market Maybachufer — Kreuzberg",a:"Kreuzberg",v:["local","markets","cultural"],d:45,s:"Tuesdays and Fridays — olives, bread, fabrics, and spices along the Landwehrkanal.",st:"A Turkish family in 1960s Kreuzberg, homesick. They slowly built this — a piece of home by a Berlin canal. Now every Tuesday and Friday morning, the market appears. Olives from various regions, fresh bread, fabrics from Turkey, spices that fill the air. The canal sparkles beside the vendors. Kids notice the food, the language, the completely different energy from German markets.",im:"Börek fills the air. Turkish spoken. The Landwehrkanal glows. This is Berlin — a piece of Turkey inside it.",t:"Maybachufer, Kreuzberg. U-Bahn U8 to Kottbusser Tor. Tuesdays and Fridays mornings (6am-2pm roughly). Cheap food available. Brings its own energy and crowd — go early or late for space.",c:["markets","cultural","local"],r:"g",age_min:4,age_max:13,budget:"cheap",pushchair:true,toilet:false,rainy:false,duration_min:45,duration_max:120,nn:"Türkischer Markt Maybachufer",ns:"Dienstags und freitags — Oliven, Brot, Stoffe und Gewürze entlang des Landwehrkanals.",nst:"Eine türkische Familie in den 1960ern in Kreuzberg, heimwehkrank. Sie bauten das langsam auf — ein Stück Heimat am Berliner Kanal.",nt:"Maybachufer, Kreuzberg. U-Bahn U8 zur Kottbusser Tor. Di/Do Morgens (6-14 Uhr).",quiz:[{q:"On what days of the week does the Turkish market operate at Maybachufer?",a:"Tuesdays and Fridays",options:["Monday and Wednesday","Tuesdays and Fridays","Daily","Saturdays and Sundays"],age_min:5,q_native:"An welchen Tagen der Woche findet der türkische Markt statt?",fun_fact:"This market tradition began in the 1960s when Turkish workers came to Berlin — now it's one of the city's most important cultural markets."},{q:"What foods and items can you typically buy at this market?",a:"Olives, fresh bread, fabrics, spices from Turkey",options:["Only fresh vegetables","Olives, fresh bread, fabrics, spices from Turkey","Electronics","Clothing only"],age_min:5,q_native:"Welche Lebensmittel und Waren gibt es auf diesem Markt?",fun_fact:"The varieties of olives alone — Greek, Turkish, Syrian — show how many Mediterranean cultures now live in Berlin."}]},// ══════ WATER PLAY & SWIMMING ══════
{id:113,n:"Großer Wannsee Strandbad — Wannsee",a:"Wannsee",v:["water_play","swimming","free"],d:120,s:"West Berlin's major public beach on a huge glacial lake — sandy, organized, reliable.",st:"A real swimming beach with changing facilities, shaded areas, and organizations. The water is glacial-fed and clean. Kids wade in shallow zones or swim in deeper areas. The beach is wide and properly maintained. This is where West Berliners go when the weather turns hot.",im:"A lake so wide you can't see the far shore. Sand, swimmers, families. The water is cold but clear — it feels like real swimming, not a pool.",t:"S-Bahn S1 to Nikolassee, then walk. S-Bahn S7 to Rathaus Spandau for the S1 connection. Entry €6-8. Changing rooms and lockers. Best June-August. Bring socks — entry fee doesn't include changing areas at lower beaches.",c:["swimming","water_play","nature"],r:"g",age_min:3,age_max:14,budget:"cheap",pushchair:true,toilet:true,rainy:false,duration_min:120,duration_max:240,nn:"Großer Wannsee Strandbad",ns:"Der große öffentliche Strand am Wannsee — sandig, organisiert, zuverlässig.",nst:"Ein echtes Schwimmstrandufer mit Umkleideräumen und Infrastruktur. Das Wasser ist gletschergefüttert und sauber.",nt:"S-Bahn S1 zum Nikolassee, dann zu Fuß. €6-8 Eintritt. Umkleideräume und Spinde.",quiz:[{q:"What type of water feeds Großer Wannsee, making it so clear and clean?",a:"Glacial water from ancient glaciers",options:["River water","Glacial water from ancient glaciers","Groundwater only","It's man-made water"],age_min:8,q_native:"Welche Art von Wasser speist den Großen Wannsee?",fun_fact:"The lake was carved by glaciers during the last ice age — the water is so pure and cold that you can see 5+ metres down on clear days."},{q:"How wide is Großer Wannsee?",a:"Wide enough that you can't see the opposite shore",options:["Narrow — you can see across easily","Wide enough that you can't see the opposite shore","It's a narrow river","It's a pond"],age_min:7,q_native:"Wie breit ist der Große Wannsee?",fun_fact:"The lake is about 2.7 km long and 1.5 km wide — it feels like a sea, not a lake."}]},// ══════ RUINS & STRANGE SITES ══════
{id:114,n:"Humboldthain Flak Tower Ruins — Gesundbrunnen",a:"Gesundbrunnen",v:["weird","history","climbing"],d:35,s:"Two massive concrete towers built to shoot down Allied bombs — 40 metres high, now climbable ruins.",st:"These are enormous. Built in 1941 to house anti-aircraft guns to defend Berlin from bombing. Each tower is 40 metres high and made of solid concrete several metres thick. They're now ruins that you can climb (via a park staircase). Kids get the scale: this is what it looked like when the city was fighting to survive.",im:"Concrete towers as tall as 12-storey buildings. Bullet holes and bomb damage visible in the walls. At the top: views across north Berlin.",t:"U-Bahn U8 to Voltastraße. The towers are in Humboldthain Park. Stairs and pathways open to public. Free. Kids can climb to various levels. Best on clear days for the views.",c:["weird","history","moving_climbing","high_spots"],r:"g",age_min:8,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Humboldthain Flakturm Ruinen",ns:"Zwei massive Betonbunker — 40 Meter hoch, jetzt erklimmbare Ruinen.",nst:"Diese sind riesig. 1941 gebaut um alliierte Bomben abzuschießen. Jeder Turm ist 40 Meter hoch und aus mehrere Meter dickem Beton.",nt:"U-Bahn U8 zur Voltastraße. Die Türme sind im Humboldthain Park. Treppen öffentlich. Kostenlos.",quiz:[{q:"How tall are the Flak towers in Humboldthain?",a:"40 metres high",options:["20 metres","40 metres high","60 metres","100 metres"],age_min:8,q_native:"Wie hoch sind die Flaktürme im Humboldthain?",fun_fact:"These towers were originally built to shoot down Allied bombers. Berlin had 5 of these towers — 2 in Humboldthain, 2 in Friedrichshain, 1 in Tiergarten. They survived the bombing because nothing could destroy them."},{q:"What was the purpose of these towers originally?",a:"To house anti-aircraft guns and defend Berlin from Allied bombing",options:["To store weapons","To house anti-aircraft guns and defend Berlin from Allied bombing","To house radar equipment","To house soldiers"],age_min:9,q_native:"Wozu waren diese Türme ursprünglich da?",fun_fact:"One tower survived the war almost completely intact. In the 1950s, it took explosives to bring it down — they couldn't destroy it any other way."}]},{id:115,n:"East Side Gallery — Friedrichshain",a:"Friedrichshain",v:["street_art","history","beautiful"],d:45,s:"1.3 kilometres of the Berlin Wall preserved as the world's longest open-air street art gallery.",st:"A section of the actual Wall is still standing, now covered in murals and art from artists around the world. Kids walk along it and understand: this wall really existed. It really divided the city. Now it's art. The murals are constantly changing. On a sunny day, the colours are incredible.",im:"Concrete wall. Then bright paintings. Portraits. Political statements. Love messages. The wall has been transformed from a barrier into a canvas.",t:"U-Bahn U5 to Warschauer Straße, then walk east along the wall. Free. Bike-friendly path along the wall. Best spring to autumn. In summer, walk early to avoid crowds and heat.",c:["street_art","history","beautiful","greatest_hits_kids"],r:"g",age_min:6,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"East Side Gallery",ns:"1,3 Kilometer der Berliner Mauer als längste Open-Air-Kunstgalerie der Welt erhalten.",nst:"Ein echter Mauerabschnitt steht noch, jetzt bedeckt mit Wandgemälden von Künstlern aus der ganzen Welt.",nt:"U-Bahn U5 zur Warschauer Straße, dann östlich entlang der Mauer. Kostenlos.",quiz:[{q:"How long is the East Side Gallery?",a:"1.3 kilometres",options:["300 metres","1.3 kilometres","5 kilometres","10 kilometres"],age_min:6,q_native:"Wie lang ist die East Side Gallery?",fun_fact:"This is the longest remaining section of the Berlin Wall — it's a piece of actual history, not a reconstruction."},{q:"What is the Wall now covered with?",a:"Street art murals from artists around the world",options:["Concrete only","Street art murals from artists around the world","Graffiti tags","Historical plaques"],age_min:6,q_native:"Womit ist die Mauer jetzt bedeckt?",fun_fact:"The most famous mural is 'My God, Help Me to Survive This Deadly Love' — a painting of East German leader Erich Honecker kissing Leonid Brezhnev, the Soviet leader. It's meant to show how dependent East Germany was on Soviet support."}]},{id:116,n:"Charlottenburg Palace and Gardens — Charlottenburg",a:"Charlottenburg",v:["beautiful","history","parks"],d:30,s:"Baroque palace with enormous formal gardens — this is what Prussian royalty looked like.",st:"The palace is vast. The gardens are vaster. Kids run through the gardens and lose themselves. The palace itself is grand — staircases, rooms, paintings. But the garden is the thing: lakes, sculptures, geometric paths, the palace reflected in water.",im:"18th-century Prussian royalty living here. Manicured gardens to the horizon. A world of control and beauty.",t:"S-Bahn S5/S7 to Charlottenburg. Palace interior €12, gardens free. Best strategy: spend 2 hours in gardens, skip the palace interior. Bring a picnic — designated areas for eating.",c:["parks","beautiful","history","greatest_hits_kids"],r:"g",age_min:5,age_max:13,budget:"cheap",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Schloss Charlottenburg",ns:"Barock-Palast mit enormen formalen Gärten.",nst:"Der Palast ist riesig. Die Gärten sind noch größer. Kinder laufen durch die Gärten und verlaufen sich.",nt:"S-Bahn S5/S7 zum Charlottenburg. Palast innen €12, Gärten kostenlos.",quiz:[{q:"What architectural style is Charlottenburg Palace?",a:"Baroque",options:["Gothic","Baroque","Modern","Art Nouveau"],age_min:7,q_native:"In welchem Baustil ist der Charlottenburg-Palast?",fun_fact:"Charlottenburg was built to copy and rival French Versailles — the gardens are designed the same way."},{q:"What's the main feature of the Charlottenburg gardens?",a:"Large formal gardens with lakes, sculptures, and geometric paths",options:["A playground","Large formal gardens with lakes, sculptures, and geometric paths","A zoo","A vegetable garden"],age_min:6,q_native:"Was ist das Hauptmerkmal der Charlottenburg-Gärten?",fun_fact:"The formal gardens stretch for over 50 hectares — that's like 50 football fields."}]},// ══════ ADVENTURE & PLAY ══════
{id:117,n:"Oberbaumbrücke Spree Path — Friedrichshain",a:"Friedrichshain",v:["beautiful","romantic_water","walking"],d:20,s:"Red brick double towers spanning the Spree — walk along the river path and watch the city fold down to water.",st:"The bridge is iconic — red brick, two towers, very recognizable. But the real magic is the river path underneath and beside it. Walk along the Spree and the bridge towers above you. In summer, the river is full of people swimming, paddling, sunbathing. The contrast between the old brick bridge and the modern city activity makes the whole scene.",im:"Red brick towers reflected in dark water. Swimmers below. The geometry of the bridge frame and the organic chaos of the river.",t:"U-Bahn U1/U15 to Oberbaum. Walk along either bank of the Spree. Free. Best summer. Watch for paddlers and swimmers — the river is popular.",c:["beautiful","romantic_water","history"],r:"g",age_min:6,age_max:13,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:45,duration_max:120,nn:"Oberbaumbrücke Spree Weg",ns:"Rote Backsteintürme über der Spree — gehe entlang des Flusswegs.",nst:"Die Brücke ist ikonisch — rotes Backstein, zwei Türme. Das echte Wunder aber ist der Flussweg darunter.",nt:"U-Bahn U1/U15 zur Oberbaum. Gehe entlang des Ufers. Kostenlos.",quiz:[{q:"What colour is the Oberbaumbrücke made of?",a:"Red brick",options:["Grey concrete","Red brick","Steel","White stone"],age_min:5,q_native:"Aus welchem Material ist die Oberbaumbrücke?",fun_fact:"The bridge was completed in 1896 and crosses the Spree between Friedrichshain and Friedrichshain (the district is on both sides). It was originally a customs checkpoint between the two districts."},{q:"What is visible in the Spree under the bridge in summer?",a:"Swimmers and paddlers/canoeists",options:["Fish only","Swimmers and paddlers/canoeists","Boats only","Nothing — it's too polluted"],age_min:6,q_native:"Was ist im Sommer in der Spree unter der Brücke zu sehen?",fun_fact:"The Spree is actually clean enough now for swimming and paddling — in the 1980s, it was severely polluted, but cleanup efforts have made it safe for water sports."}]},{id:118,n:"Spreepark Island Walk — Friedrichshain",a:"Friedrichshain",v:["parks","water_play","history"],d:40,s:"Amusement park ruins on islands in the Spree — paddlewheel boats, roller coaster remains, nature reclaiming the space.",st:"Spreepark opened in the 1960s as East Berlin's first amusement park. It was vast. Then the state collapsed, funding stopped, and nature slowly reclaimed the rides. Now it's being restored. Kids walk through islands where you can still see the roller coaster structure, old boats, carousel remains. It's a ghost park in the middle of water.",im:"Rusted metal amusement park rides surrounded by water, trees growing through the structures.",t:"S-Bahn S3/S9 to Plänterwald. The park is being restored (2023 onwards), with some boat rides returning. Entry varies based on restoration progress. Call ahead for current status.",c:["parks","weird","history"],r:"y",age_min:7,age_max:13,budget:"cheap",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:150,nn:"Spreepark Inselwanderung",ns:"Karussellpark-Ruinen auf Inseln in der Spree — Dampfschiffe, Achterbahnreste.",nst:"Spreepark öffnete in den 1960ern als erster Freizeitpark Ost-Berlins. Dann kollabierte der Staat.",nt:"S-Bahn S3/S9 zum Plänterwald. Der Park wird restauriert (2023+). Eintritt variiert.",quiz:[{q:"What happened to Spreepark after East Germany collapsed in 1989?",a:"The park was abandoned and nature slowly reclaimed it",options:["It was restored immediately","The park was abandoned and nature slowly reclaimed it","It was completely destroyed","It became a museum"],age_min:8,q_native:"Was geschah mit Spreepark nach 1989?",fun_fact:"For about 30 years, Spreepark was an abandoned wonderland of rusted rides on islands in the river — a place where you could see how quickly nature takes back human spaces."},{q:"What type of rides can you still see ruins of in Spreepark?",a:"Roller coaster, carousel, paddlewheel boats",options:["Only bumper cars","Roller coaster, carousel, paddlewheel boats","A Ferris wheel only","No rides — it's completely cleared"],age_min:7,q_native:"Welche Art von Fahrgeschäften kannst du noch sehen?",fun_fact:"The park's roller coaster was innovative for the 1960s — it had loops, which were rare at the time."}]},{id:119,n:"Archenhold Observatory — Treptow",a:"Treptow",v:["learning","high_spots","science_outdoors"],d:40,s:"Berlin's oldest science museum with a telescope so long it has its own building.",st:"The telescope is 21 metres long and is the oldest telescope still in its original building in the world. Kids can see through it on clear nights (or during science demonstrations). The museum explains the cosmos in a way that kids actually understand. The building is from 1896.",im:"A telescope so large it needs its own house. Looking through it at the moon, seeing craters. The dome rotates to point the telescope.",t:"S-Bahn S3/S6 to Treptower Park. Museum entry €8.50. Check website for telescope viewing sessions (clear nights only). Planetarium shows several times daily.",c:["learning","science_outdoors","high_spots"],r:"y",age_min:7,age_max:14,budget:"cheap",pushchair:true,toilet:true,rainy:true,duration_min:60,duration_max:120,nn:"Archenhold Sternwarte",ns:"Berlins älteste Science Museum mit Teleskop so lang, dass es sein eigenes Gebäude braucht.",nst:"Das Teleskop ist 21 Meter lang. Kinder können hindurchschauen in klaren Nächten.",nt:"S-Bahn S3/S6 zum Treptower Park. €8,50 Eintritt. Webseite für Teleskop-Sitzungen checken.",quiz:[{q:"How long is the telescope at Archenhold Observatory?",a:"21 metres long",options:["5 metres","21 metres long","50 metres","100 metres"],age_min:8,q_native:"Wie lang ist das Teleskop der Archenhold Sternwarte?",fun_fact:"The telescope is so long that the entire observatory building rotates on a rail system to point it at different parts of the sky."},{q:"What year was the Archenhold Observatory building built?",a:"1896",options:["1850","1896","1920","1960"],age_min:8,q_native:"In welchem Jahr wurde das Observatorium gebaut?",fun_fact:"It's the oldest telescope still in its original building in the world — this building has housed the same telescope for over 125 years."}]},// ══════ DAY TRIPS ══════
{id:120,n:"Potsdam — Sanssouci Palace and Park — Potsdam",a:"Potsdam",v:["beautiful","history","gardens"],d:300,s:"Frederick the Great's summer palace and gardens — cascading fountains, 1000s of trees, rococo excess.",st:"A palace built to escape Berlin. Frederick wanted to prove he could have a palace as extravagant as Versailles. The gardens are the point: hundreds of stone staircases, fountains that are purely for beauty, paths that go on forever. Kids walk uphill through gardens and discover fountains. Trees everywhere. The palace is rococo inside — gold, mirrors, everything glittering.",im:"Stone staircases cascading downhill through formal gardens. Fountains on every terrace. The palace at the top, looking down on everything.",t:"S-Bahn S1/S7 from central Berlin to Potsdam (30 mins). Train to Sanssouci station. Palace entry €12 (advance booking recommended). Garden free. Spend most time in garden, brief palace tour. Full day activity. Bring picnic.",c:["greatest_hits_kids","history","beautiful"],r:"g",age_min:7,age_max:14,budget:"moderate",pushchair:true,toilet:true,rainy:false,duration_min:180,duration_max:300,nn:"Potsdam — Schloss Sanssouci",ns:"Sommerpalast Friedrichs des Großen — Wasserspiele, tausende Bäume.",nst:"Ein Palast zum Entkommen aus Berlin. Friedriche wollte einen ebenso prachtvollen Palast wie Versailles.",nt:"S-Bahn S1/S7 von Zentrum-Berlin nach Potsdam (30 Min). Palast €12 (Online-Buchung empfohlen). Garten kostenlos.",quiz:[{q:"Who built Sanssouci Palace and when?",a:"Frederick the Great in the 1740s",options:["A Kaiser in the 1890s","Frederick the Great in the 1740s","A duchess in the 1600s","A modern builder in 1990s"],age_min:9,q_native:"Wer baute Sanssouci und wann?",fun_fact:"'Sans Souci' means 'Without Care' — Frederick called it that because he built it as an escape from the pressures of being a king."},{q:"What is the main feature of the Sanssouci grounds?",a:"Cascading terraced gardens with hundreds of staircases and fountains",options:["A large lake","Cascading terraced gardens with hundreds of staircases and fountains","A maze","A forest"],age_min:8,q_native:"Was ist das Hauptmerkmal der Sanssouci-Anlage?",fun_fact:"The gardens are so extensive that it takes 2-3 hours to walk through them properly — and there are still sections you could explore further."}]},{id:121,n:"Spreewald Day Trip — Lübben",a:"Spreewald",v:["nature","water_play","adventure"],d:360,s:"A forest crisscrossed by waterways — canoe through it or walk the banks, staying with locals or day-tripping from Berlin.",st:"A landscape that doesn't feel like Brandenburg. The Spree splits into dozens of channels through a dark forest. You can kayak or paddle through these channels — the water is dark, the trees form a canopy. You paddle through a living forest. Or walk the banks and see everything from the shore.",im:"Paddling under overhanging branches. Water so dark you can't see the bottom. Trees everywhere. Silence except the paddle.",t:"Train or S-Bahn from Berlin to Lübben (1.5 hours). Canoe rental from €30/day. Many guest houses or Airbnb. Can day-trip if you leave early and come back by evening. Food: homemade bread and local gherkins are the speciality.",c:["nature","water_play","adventure"],r:"g",age_min:6,age_max:14,budget:"moderate",pushchair:false,toilet:true,rainy:false,duration_min:180,duration_max:480,nn:"Spreewald Tagesausflug",ns:"Ein Wald durchzogen von Wasserwegen — Kanu durch oder die Ufer entlang gehen.",nst:"Eine Landschaft die nicht wie Brandenburg aussieht. Der Spree teilt sich in Dutzende Kanäle.",nt:"Zug von Berlin nach Lübben (1,5 Std). Kanu-Vermietung von €30/Tag.",quiz:[{q:"What is the Spreewald primarily known for?",a:"A forest crisscrossed by waterways where you can paddle",options:["A large lake","A forest crisscrossed by waterways where you can paddle","Industrial sites","Agricultural fields"],age_min:8,q_native:"Wofür ist der Spreewald bekannt?",fun_fact:"The Spreewald is a UNESCO World Heritage site because of its unique landscape — it's one of only a few examples in Europe of this type of water-threaded forest."},{q:"What are the traditional specialties of the Spreewald region?",a:"Handmade bread and pickled gherkins",options:["Wine","Handmade bread and pickled gherkins","Cheese","Fish only"],age_min:8,q_native:"Welche sind die traditionellen Spezialitäten der Spreewald-Region?",fun_fact:"Spreewald gherkins have been made the same way for centuries — they're so famous that 'Spreewald' is almost synonymous with German pickled gherkins."}]},{id:122,n:"Berliner Docks Swimming — Friedrichshain",a:"Friedrichshain",v:["water_play","free"],d:20,s:"Urban swims in old industrial dock areas — cold water, no lifeguards, local swimmers only.",st:"Not an official pool. The docks have water. Locals jump in. Kids watch and decide if they're brave. The water is cold and dark. The setting is industrial and slightly surreal. Brick buildings surround the water. In summer, clusters of swimmers appear.",im:"Concrete docks. Dark water. A brick building wall right at the water's edge. Someone jumping in.",t:"Various locations in Friedrichshain docks (ask locals). U-Bahn U5 to Warschauer Straße. Free. Highly seasonal (June-August only). No toilets, no changing. Bring a towel.",c:["water_play","weird","local","free"],r:"y",age_min:10,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Berliner Docks Schwimmen",ns:"Schwimmen in alten industriellen Dockgebieten.",nst:"Nicht ein offizielles Bad. Die Docks haben Wasser. Einheimische springen rein.",nt:"Verschiedene Orte in Friedrichshain Docks. U-Bahn U5 zur Warschauer Straße. Kostenlos.",quiz:[{q:"What makes the dock swimming locations different from regular pools?",a:"They're industrial locations with no official facilities or lifeguards",options:["They're Olympic pools","They're industrial locations with no official facilities or lifeguards","They're heated","They have restaurants"],age_min:11,q_native:"Was macht die Dock-Schwimmstellen unterschiedlich?",fun_fact:"Urban swimming in Berlin has become a movement — locals and visitors explore all the unofficial swimming spots the city has to offer."},{q:"When is the best season to swim in the Friedrichshain docks?",a:"Summer (June-August) when the water is warmest",options:["Winter for cold water therapy","Spring only","Summer (June-August) when the water is warmest","All year round"],age_min:10,q_native:"Wann ist die beste Jahreszeit zum Schwimmen?",fun_fact:"The water temperature varies wildly — in summer it can be around 20°C, but in spring and autumn it's shockingly cold."}]},{id:123,n:"Köpenick Island Old Town — Köpenick",a:"Köpenick",v:["history","walking","beautiful"],d:20,s:"An island town inside Berlin — narrow streets, cobblestones, a castle, locals who ignore tourists.",st:"Köpenick is a real place, not themed. There's a castle. There are locals who have lived here forever. The streets are narrow and the river wraps around. Kids find cobblestones and understand: this was a town before it was swallowed by Berlin. Now it's like discovering a village inside a city.",im:"River water. Cobblestone streets. A castle that survived wars. Real people living real lives on an island.",t:"S-Bahn S3 to Köpenick. The old town is walkable from the station (10 mins). Free to walk. Pubs and cafes are actual local places, not tourist traps.",c:["history","beautiful","hidden"],r:"g",age_min:7,age_max:13,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Köpenick Insel-Altstadt",ns:"Eine Inselstadt in Berlin — enge Gassen, Kopfsteinpflaster, ein Schloss.",nst:"Köpenick ist ein echter Ort, nicht inszeniert. Es gibt ein Schloss. Es gibt Einheimische.",nt:"S-Bahn S3 zum Köpenick. Die Altstadt ist vom Bahnhof zu Fuß erreichbar (10 Min).",quiz:[{q:"What surrounds the Köpenick old town?",a:"River water — it's on an island",options:["Walls","River water — it's on an island","Parks","Modern buildings"],age_min:7,q_native:"Was umgibt die Köpenick-Altstadt?",fun_fact:"Köpenick was an independent town until it was incorporated into Berlin in 1920. In some ways, it still feels like a separate place."},{q:"What major landmark is in the Köpenick old town?",a:"A castle",options:["A cathedral","A castle","A university","A museum"],age_min:7,q_native:"Was ist das Hauptdenkmal in der Altstadt?",fun_fact:"The castle was rebuilt in the 1990s to look like how it was in the 1700s — the original was destroyed in WWII."}]},{id:124,n:"Tegeler See — Reinickendorf",a:"Reinickendorf",v:["water_play","free","nature"],d:90,s:"West Berlin's beautiful lake with sandy beaches and no industry — shallow access, bike paths.",st:"A lake where West Berliners had to imagine that East Berlin didn't exist on the other side. Now it's just a gorgeous lake with sandy beaches, bike paths, and no visible industry. Kids swim or wade without the overcrowding of the southern lakes.",im:"A lake surrounded by forest and residential streets. Sandy beaches. The smell of sunscreen and water.",t:"U-Bahn U6 to Tegel, then walk. S-Bahn also nearby. Free to swim. Bike-friendly. Changing facilities in summer. Bring own food — tourist cafes at the shore but marked up.",c:["water_play","swimming","nature","free"],r:"g",age_min:3,age_max:13,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:120,duration_max:240,nn:"Tegeler See",ns:"Westberlins wunderschöner See mit Sandstränden — keine Industrie.",nst:"Ein See wo West-Berliner imaginierten, dass Ost-Berlin auf der anderen Seite nicht existiert.",nt:"U-Bahn U6 zum Tegel, dann zu Fuß. S-Bahn auch in der Nähe. Kostenlos.",quiz:[{q:"What kind of beaches does Tegeler See have?",a:"Sandy beaches",options:["Rocky beaches","Sandy beaches","Concrete","No beaches"],age_min:5,q_native:"Was für Strände hat der Tegeler See?",fun_fact:"The sand at Tegeler See is from glacial deposits — the lake was carved by glaciers during the ice age, and the sand was deposited at the same time."},{q:"What makes Tegeler See different from other Berlin lakes in terms of surrounding landscape?",a:"It's surrounded by forest and residential areas with no visible industry",options:["It's in the city centre","It's surrounded by forest and residential areas with no visible industry","It's in a park","It's artificial"],age_min:8,q_native:"Was macht den Tegeler See anders?",fun_fact:"During the Cold War, Tegeler See was right at the border between West Berlin and East Germany — you could see the other side but couldn't go there."}]},// ══════ MORE PARKS & NATURE ══════
{id:125,n:"Panke River Walk — Wedding",a:"Wedding",v:["nature","walking","free"],d:60,s:"Follow a stream through the city that most Berliners don't know exists.",st:"The Panke is a creek that runs through Wedding. Most of it is hidden under the city or channelled. But sections of it are walkable — the water runs, willows lean over, the city noise drops away. Kids follow the water upstream and find quiet parks connected by this single thread of stream.",im:"Walking through a neighborhood but always following water. Willows. Bridges. The creek getting clearer the further you go.",t:"U-Bahn U6 to Seestraße to start. Walk north. Free. Best spring to autumn when the parks are green.",c:["nature","walking","hidden","free"],r:"g",age_min:6,age_max:12,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"Panke Flusswanderung",ns:"Folge einem Bach durch die Stadt, den die meisten Berliner nicht kennen.",nst:"Der Panke ist ein Bach der durch Wedding fließt. Teile davon sind begehbar.",nt:"U-Bahn U6 zur Seestraße zum Starten. Gehe nördlich. Kostenlos.",quiz:[{q:"What is the Panke?",a:"A creek/river that runs through Wedding",options:["A park","A creek/river that runs through Wedding","A street","A museum"],age_min:6,q_native:"Was ist der Panke?",fun_fact:"Much of the Panke is channeled underground under streets and buildings, but sections of it still run open and walkable."},{q:"What plants typically line the walkable sections of the Panke?",a:"Willows and other water-loving trees",options:["Only grass","Willows and other water-loving trees","Palms","No plants"],age_min:7,q_native:"Welche Pflanzen säumen den Panke?",fun_fact:"These water edges are important habitats for birds and insects — the creek supports a whole ecosystem in the middle of the city."}]},{id:126,n:"Natur-Park Südgelände — Schöneberg",a:"Schöneberg",v:["nature","hidden","weird"],d:60,s:"A nature reserve built on abandoned railway yards — nature and industrial ruins together.",st:"This is where the railway yards were. Then they were abandoned. Then nature took over. Now it's protected as a nature reserve. Kids walk through rails that are half-buried in earth, broken platforms, overgrown structures, and they see exactly how nature reclaims human spaces. The biodiversity is extraordinary.",im:"Rails disappearing into grass. Concrete structures with plants growing from the cracks. A forest growing where there were trains.",t:"U-Bahn U6 to Alt-Mariendorf, then walk. Free. Best spring to autumn. Wooden walkways keep you from damaging the habitat. Bring binoculars — birds.",c:["nature","hidden","weird","science_outdoors"],r:"g",age_min:6,age_max:13,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Natur-Park Südgelände",ns:"Ein Naturschutzgebiet auf aufgegebenen Eisenbahngelände.",nst:"Das waren die Bahnhöfe. Dann wurden sie aufgegeben. Dann übernahm die Natur.",nt:"U-Bahn U6 zur Alt-Mariendorf, dann zu Fuß. Kostenlos.",quiz:[{q:"What used to be on the land that is now Natur-Park Südgelände?",a:"Railway yards and train depot",options:["A factory","Railway yards and train depot","A park","Apartment buildings"],age_min:7,q_native:"Was war früher auf dem Gelände des Natur-Park Südgelände?",fun_fact:"The oldest trees on the site are only about 30 years old — they grew in just three decades after the railway stopped using the land."},{q:"What happens when you walk the wooden walkways?",a:"You stay above the ground to protect the growing plants and habitats",options:["It's easier to walk","You stay above the ground to protect the growing plants and habitats","It's required by law","There's no reason — it's just better"],age_min:7,q_native:"Warum gibt es Holzwege?",fun_fact:"The walkways were built deliberately to protect the biodiversity underneath — the habitat is so rare and valuable that access had to be controlled."}]},{id:127,n:"Rummelsburger Bucht — Friedrichshain",a:"Friedrichshain",v:["water_play","free","local"],d:30,s:"A bay of the Spree where locals swim and paddle — houseboats, shaded banks, no tourist feel.",st:"Not a beach. It's a curve in the river where the water calms. Houseboats are moored here. Locals swim directly from the bank. The water is clean enough. Kids get the feeling of local Berlin — places that exist for residents, not tourists.",im:"Houseboat windows reflected in water. A swimmer walking into the river from the grassy bank. Quiet.",t:"U-Bahn U1 to Ostbahnhof, then walk. Free. Check water quality before swimming in early season. Best June-August.",c:["water_play","free","local"],r:"y",age_min:7,age_max:13,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Rummelsburger Bucht",ns:"Eine Bucht der Spree wo Einheimische schwimmen.",nst:"Nicht ein Strand. Es ist eine Kurve im Fluss wo das Wasser sich beruhigt.",nt:"U-Bahn U1 zur Ostbahnhof, dann zu Fuß. Kostenlos.",quiz:[{q:"What is moored in Rummelsburger Bucht?",a:"Houseboats",options:["Ferry boats","Houseboats","Military vessels","Pleasure cruise boats"],age_min:6,q_native:"Was ist in der Rummelsburger Bucht vertäut?",fun_fact:"Living on a houseboat in Berlin is expensive but popular — these are permanent residences, not tourist boats."},{q:"How do locals typically enter the water at Rummelsburger Bucht?",a:"By wading in from the grassy bank",options:["A dock","By wading in from the grassy bank","A ladder","Only swimmers are allowed"],age_min:6,q_native:"Wie gehen Einheimische ins Wasser?",fun_fact:"The grassy bank and the calm water make this one of the few places in Berlin where you can just walk into the Spree without climbing down stairs or rocks."}]},{id:128,n:"Glienicker Brücke (Bridge of Spies) — Wannsee",a:"Wannsee",v:["history","beautiful"],d:25,s:"The bridge where Cold War spies were exchanged — a real Cold War crossing point.",st:"This bridge divided East Germany from West Germany. During the Cold War, spies were exchanged on this bridge. Soviet prisoners for American prisoners. Kids understand: this is where two worlds met. Now families cross it freely in both directions. The contrast is powerful.",im:"A bridge over a river with two different landscapes on either side. Then and now.",t:"S-Bahn S1 to Glienicke. Walk across the bridge. Free. Memorial plaques on both sides explain the history.",c:["history","beautiful","walking"],r:"g",age_min:9,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:30,duration_max:90,nn:"Glienicker Brücke",ns:"Die Brücke wo während des Kalten Krieges Spione ausgetauscht wurden.",nst:"Diese Brücke trennte Ost von West. Während des Kalten Krieges wurden Spione ausgetauscht.",nt:"S-Bahn S1 zum Glienicke. Über die Brücke gehen. Kostenlos.",quiz:[{q:"What was the Glienicker Brücke used for during the Cold War?",a:"Exchanging prisoners and spies between East and West",options:["Transporting goods","Exchanging prisoners and spies between East and West","Training soldiers","Nothing — it was closed"],age_min:10,q_native:"Wofür wurde die Glienicker Brücke während des Kalten Krieges benutzt?",fun_fact:"The most famous exchange was in 1962 when American pilot Gary Powers was traded for Soviet agent Rudolph Abel."},{q:"What political boundary did the Glienicker Brücke mark?",a:"The boundary between East Germany and West Germany",options:["Between two Berlin districts","The boundary between East Germany and West Germany","A city limit","It wasn't a boundary"],age_min:9,q_native:"Welche politische Grenze markierte die Glienicker Brücke?",fun_fact:"Now the bridge is just a normal pedestrian and bike crossing — anyone can walk back and forth freely, which wasn't possible for 40 years."}]},{id:129,n:"Schillerpark UNESCO Housing — Wedding",a:"Wedding",v:["weird","architecture","history"],d:25,s:"1920s modernist housing built by the city — a planned neighbourhood that shaped urban design worldwide.",st:"The Schillerpark was built by Berlin's city government in 1924 to show the world how to house working people. The buildings are simple, efficient, and beautiful. Red brick. Courtyards. Playgrounds. Kids understand: adults designed this carefully to be good for families. The architecture is still striking.",im:"Red brick buildings in an orderly grid. Green courtyards between them. A planned city within the city.",t:"U-Bahn U6 to Afrikanische Straße. The entire housing complex is free to walk through. UNESCO World Heritage site.",c:["architecture","history","weird"],r:"g",age_min:8,age_max:13,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:45,duration_max:90,nn:"Schillerpark UNESCO Wohnbau",ns:"1920er modernistische Wohnhäuser gebaut von der Stadt.",nst:"Der Schillerpark wurde 1924 gebaut um der Welt zu zeigen wie man Arbeiter unterbringt.",nt:"U-Bahn U6 zur Afrikanische Straße. Die ganze Siedlung ist kostenlos zu besichtigen.",quiz:[{q:"In what year was Schillerpark built?",a:"1924",options:["1890","1924","1950","1980"],age_min:8,q_native:"In welchem Jahr wurde Schillerpark erbaut?",fun_fact:"Schillerpark is a UNESCO World Heritage site because it's one of the most important examples of modernist residential architecture in the world."},{q:"What was the purpose of Schillerpark when it was built?",a:"To provide quality housing for working people",options:["To build a castle","To provide quality housing for working people","To create a military base","To house artists"],age_min:9,q_native:"Was war der Zweck von Schillerpark?",fun_fact:"The design was radical for its time — instead of crowded apartment blocks, there were green courtyards, playgrounds, and schools within the housing complex."}]},{id:130,n:"Kollwitzplatz & Käthe Kollwitz's Home — Prenzlauer Berg",a:"Prenzlauer Berg",v:["history","beautiful","quiet"],d:25,s:"A square named after an artist who lived nearby — trees, cafés, and a neighbourhood that hasn't changed much since the 1920s.",st:"Käthe Kollwitz was an artist who created prints about povert
