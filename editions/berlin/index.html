const{useState,useEffect,useMemo}=React;const P=[// WATER (6 entries)
{id:1,n:"Müggelsee — Köpenick",a:"Köpenick",v:["water_play","free"],d:20,s:"East Berlin's massive lake with shallow zones, sandy beach, and a playground that feels like your own discovery.",st:"You arrive to wide open water, families spreading blankets on sand. Kids immediately wade into the shallow bathing bay. The lido has a giant shallow-water zone that's genuinely made for splashing, not just looking at water.",im:"The beach shelves so gently you can walk out 20 metres and still be knee-deep.",t:"S-Bahn S3 to Müggelsee. Parking available. Toilets at the lido area. Free entry. Best before 11am on weekends. Bring socks — muddy bottom.",c:["water_play","swimming","picnic"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:240,nn:"Müggelsee — Köpenick",ns:"Berlins riesiger See mit Flachwasserzone und Strand — vom Osten aus entdeckt.",nst:"Du kommst an einem breiten Seeufer an, Familien verteilen sich auf dem Sand. Kinder waten sofort in die Flachwasserzone. Das Badeland hat eine riesige Flachzone zum Plantschen, nicht nur zum Anschauen.",nt:"S-Bahn S3 zum Müggelsee. Parkplätze vorhanden. Toiletten beim Badeland. Kostenlos. Vor 11 Uhr am Wochenende am besten.",quiz:[{q:"How far can you walk into Müggelsee before the water reaches your waist?",a:"About 20 metres",options:["5 metres","About 20 metres","50 metres","You can never stand up in Müggelsee"],age_min:6,fun_fact:"It's the biggest lake Berlin can reach by public transport, bigger than the famous Wannsee in the West."},{q:"What animals live in the shallow water zone?",a:"Fish, ducks, and sometimes herons",options:["Only ducks","Fish, ducks, and sometimes herons","Swans only","No animals — it's too shallow"],age_min:8,fun_fact:"The lake's bottom is soft mud that squishes between your toes — that's normal and not gross."}]},{id:2,n:"Schlachtensee — Zehlendorf",a:"Zehlendorf",v:["water_play","free"],d:20,s:"West Berlin's lake, accessible by S-Bahn direct, with shallow beach and a proper lido structure.",st:"You step off the train and immediately smell water and sunscreen. The beach is organized — there's a roped-off shallow section for children. Swimmers and families coexist without chaos. The water is genuinely clean.",im:"The sandy bottom shelves gradually, making it safe for children who get nervous about depth.",t:"S-Bahn S1 direct to Schlachtensee. Beach area has toilets and changing rooms. Free. Crowded after 16:00 on hot days. Bring a hat — almost no shade on the beach itself.",c:["water_play","swimming","picnic"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Schlachtensee — Zehlendorf",ns:"Westberlins See mit organisiertem Badestrand und direkter S-Bahn-Anbindung.",nst:"Du steigst aus der Bahn und riechst sofort Wasser und Sonnencreme. Der Strand ist organisiert — es gibt einen abgesperrten Flachwasserbereich für Kinder. Schwimmer und Familien nebeneinander. Das Wasser ist wirklich sauber.",nt:"S-Bahn S1 direkt zum Schlachtensee. Toiletten und Umkleidekabinen am Strand. Kostenlos. Nach 16 Uhr an heißen Tagen voll.",quiz:[{q:"What colour is the water at Schlachtensee on a sunny day?",a:"Bright turquoise or pale blue-green",options:["Murky brown","Bright turquoise or pale blue-green","Grey","Dark blue"],age_min:6,fun_fact:"The colour changes depending on the sun and wind — on windy days it looks grey, on calm sunny days it's almost turquoise."},{q:"What is the shallow children's section marked by?",a:"A rope",options:["A wall","A rope","A floating dock","It's not marked"],age_min:6,fun_fact:"This rope keeps the waves from the swimmers away from the kids' zone."}]},{id:3,n:"Krumme Lanke — Dahlem",a:"Dahlem",v:["water_play","free"],d:20,s:"Curved lake with a forested shoreline and two shallow bathing bays on the north side — feels less touristy than other Berlin lakes.",st:"The beach is narrower, more enclosed by trees. Kids find the curve of the lake interesting — they talk about how it 'bends'. The water is colder but clear. Fewer food stalls means it's quieter.",im:"The water is dark and reflective, with birch trees right at the water's edge creating shade patches.",t:"U-Bahn U3 to Krumme Lanke. Two shallow bathing bays marked on the north shore. Free. Bring own snacks — no beach restaurant. Less crowded than Schlachtensee.",c:["water_play","swimming","picnic"],r:"g",age_min:4,age_max:12,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:60,duration_max:150,nn:"Krumme Lanke — Dahlem",ns:"Gekrümmter See mit Flachbuchten im Norden — weniger touristisch als andere Seen.",nst:"Der Strand ist schmaler, mehr von Bäumen umgeben. Kinder finden die Krümmung des Sees interessant. Das Wasser ist kälter aber klar. Weniger Budenhektik.",nt:"U-Bahn U3 zur Krummen Lanke. Zwei Flachbuchten im Norden. Kostenlos. Eigene Snacks mitbringen.",quiz:[{q:"Why is the water in Krumme Lanke darker than Müggelsee?",a:"Deeper water and more trees blocking direct sun",options:["Pollution","Deeper water and more trees blocking direct sun","Different type of algae","It's actually the same color"],age_min:8,fun_fact:"The darkness isn't bad — it means the water is actually cleaner and less disturbed."},{q:"What do the curved shoreline shadows look like on the water?",a:"Tree reflections creating dark and light patches",options:["Ripples in circles","Tree reflections creating dark and light patches","Boat wakes","Nothing special"],age_min:7,fun_fact:"The reflections change throughout the day as the sun moves — it's a different pattern every hour."}]},{id:4,n:"Plänterwald Water Playground — Treptow",a:"Treptow",v:["water_play","free","outdoor_play"],d:20,s:"Berlin's largest water playground, renovated in 2022 with water jets, umbrellas, and fountains on a designed water surface.",st:"Kids see the installation and immediately run to get wet. The design is playful — bright blue and green paving, multiple water features. No pool to worry about — just controlled splash zones. Very crowded in July/August by midday.",im:"Water spurts up from ground level in unpredictable patterns — kids jump and dodge.",t:"S-Bahn S3/S6 to Plänterwald. In Plänterwald park, free. Best before 11am or after 15:00 in summer. Water runs May-September roughly. Bring spare socks and a change of clothes.",c:["water_play","outdoor_play"],r:"g",age_min:2,age_max:10,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:60,duration_max:120,nn:"Wasserspielplatz Plänterwald — Treptow",ns:"Berlins größter Wasserspielplatz mit Fontänen und Wasserstrahlen auf designter Oberfläche.",nst:"Kinder sehen die Installation und rennen sofort los. Das Design ist spielerisch — helles Blau und Grün, viele Wasserstellen. Kein See zum Sorgen — nur kontrollierte Spritzzonen.",nt:"S-Bahn S3/S6 zum Plänterwald. Im Park, kostenlos. Vor 11 Uhr oder nach 15 Uhr am besten. Wasser Mai-September.",quiz:[{q:"How many different water features shoot from the ground?",a:"At least 6-8 separate jets and fountains",options:["Just 2","At least 6-8 separate jets and fountains","Over 20","Only 1 central fountain"],age_min:6,fun_fact:"The jets operate on different timers — some go off simultaneously, others alone, so you can never predict the pattern."},{q:"What color is the water playground surface painted?",a:"Bright blue and green",options:["Grey concrete","White","Bright blue and green","Red and yellow"],age_min:5,fun_fact:"The colors reflect water, so it looks like the whole playground is under water sometimes."}]},{id:5,n:"Stuttgarter Platz Splash Fountain — Charlottenburg",a:"Charlottenburg",v:["water_play","free"],d:10,s:"Ten water nozzles in a circle on brick paving — minimal and ideal for toddlers or a quick splash.",st:"Toddlers immediately start running between the jets. The circular layout means kids can't get lost. Parents sit on surrounding stone edges. It's low-key and feels like a real neighborhood spot, not a tourist attraction.",im:"Water shoots up around your ankles as you run through — totally predictable but thrilling at age 4.",t:"U-Bahn U2 or S-Bahn to Charlottenburg. Stuttgarter Platz is a 5-minute walk. Free. No toilets immediately adjacent — nearest in café nearby. Bring a towel.",c:["water_play","outdoor_play"],r:"g",age_min:2,age_max:7,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:20,duration_max:60,nn:"Stuttgarter Platz Wasserfontäne — Charlottenburg",ns:"Zehn Wasserdüsen im Kreis — minimal, perfekt für kleine Kinder.",nst:"Kleinkinder laufen sofort zwischen den Strahlen umher. Das Kreislayout verhindert, dass Kinder sich verlaufen. Eltern sitzen auf Stein am Rand. Wirkt wie ein echter Nachbarschaftsort.",nt:"U-Bahn U2 oder S-Bahn zum Charlottenburg. Stuttgarter Platz 5 Minuten zu Fuß. Kostenlos. Keine Toiletten direkt daneben.",quiz:[{q:"How many water nozzles are arranged in a circle at Stuttgarter Platz?",a:"Ten",options:["Five","Eight","Ten","Twelve"],age_min:5,fun_fact:"The nozzles are arranged so kids can predict where the water comes from — not random like other fountains."},{q:"How high do the water jets shoot above the ground?",a:"About knee height or slightly above",options:["Ankle height only","About knee height or slightly above","Head height","Taller than an adult"],age_min:5,fun_fact:"The height is deliberately designed for toddlers — high enough to be thrilling but safe if they fall through."}]},{id:6,n:"Weinbergspark Water Features — Mitte",a:"Mitte",v:["water_play","free","outdoor_play"],d:15,s:"Terraced park with fountains and water channels where kids can redirect water flow with gates and dams.",st:"Kids immediately understand they can control the water. They build small dams, redirect streams, create pools. It's interactive water play, not just running through fountains. The park itself is beautiful — terraced landscape with city views.",im:"Cool stone channels carved into hillside, water flowing downhill that you can dam or redirect with your hands.",t:"S-Bahn S1/S2/S25 to Nordbahnhof, then walk or U-Bahn U8 to Weinmeisterstraße. Free. Terraced — some pushing a stroller difficult. Water feature works year-round but flows strongest May-September.",c:["water_play","outdoor_play","imagination_spots"],r:"g",age_min:4,age_max:11,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Weinbergspark Wasserspiele — Mitte",ns:"Terrassierter Park mit Fontänen und Wasserkanälen zum Umlenken.",nst:"Kinder verstehen sofort, dass sie das Wasser kontrollieren können. Sie bauen kleine Dämme, lenken Ströme um, schaffen Pools. Interaktives Wasserspiel, nicht nur durchrennen.",nt:"S-Bahn S1/S2/S25 zum Nordbahnhof oder U-Bahn U8 zur Weinmeisterstraße. Kostenlos. Stufen — Kinderwagen schwierig.",quiz:[{q:"What can you use to change the direction of water in the channels?",a:"Natural barriers, stones, and built gates",options:["Nothing — the water always flows the same way","Natural barriers, stones, and built gates","Only your hands","Special tools you rent"],age_min:6,fun_fact:"Kids have been engineering water systems here for 30 years — some dams have permanent channels now."},{q:"Why does the water in Weinbergspark flow better in summer?",a:"More rainfall and water pressure from city systems",options:["The park is hotter","More rainfall and water pressure from city systems","Different water source","Magic"],age_min:8,fun_fact:"The water comes from the city's stormwater system — when it rains, the streams are stronger."}]},// WILD (6 entries)
{id:7,n:"Tierpark Berlin — Friedrichsfelde",a:"Friedrichsfelde",v:["animals","free","older_kids"],d:25,s:"Europe's largest animal park at 160 hectares around Schloss Friedrichsfelde — almost 8000 animals, free with Berlin Welcome Card, way less crowded than Zoo.",st:"You enter through the palace grounds. The scale is enormous but doesn't feel overwhelming. An electric train runs every 30 minutes and is free to ride. Kids spot animals scattered across parkland, not in a linear path. The petting zoo has goats you can actually interact with, not just observe.",im:"Walking through open parkland with a giraffe visible in the distance, then a herd of elk closer by — it feels like you're in nature, not a zoo.",t:"U-Bahn U5 to Tierpark, then walk 10 mins, or tram M17 direct. Free with Berlin Welcome Card (3 kids free on card). Direct admission is €15 pp otherwise. Train ride free. Toilets throughout. Pushchair-friendly paths. Not worth a cross-town trip alone — pair with Schloss Friedrichsfelde tour.",c:["animals","imagination_spots"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:120,duration_max:300,nn:"Tierpark Berlin — Friedrichsfelde",ns:"Europas größter Tierpark mit 8000 Tieren auf 160 Hektar — kostenlos mit Berlin Welcome Card.",nst:"Du betrittst das Gelände durch die Schlossgrundstücke. Die Größe ist enorm, aber nicht überwältigend. Eine Elektrobahn fährt alle 30 Minuten und ist kostenlos. Kinder entdecken Tiere verstreut im Park, nicht in einer Reihe.",nt:"U-Bahn U5 zum Tierpark oder Tram M17. Kostenlos mit Berlin Welcome Card. Elektrobahn kostenlos. Kinderwagen-freundlich.",quiz:[{q:"How many animals live in Tierpark Berlin?",a:"Almost 8000",options:["3000","Almost 8000","15000","1000"],age_min:6,fun_fact:"That's more animals than live in the Berlin Zoo, but it feels less crowded because the park is so big."},{q:"What is the free train ride called that runs through the park?",a:"Electric train (Bahn)",options:["Safari train","Electric train (Bahn)","Monorail","Gondola"],age_min:5,fun_fact:"The train stops at different stations throughout the park — each stop is near different animals."}]},{id:8,n:"Domäne Dahlem — Dahlem",a:"Dahlem",v:["animals","free","treasure_hunt"],d:25,s:"Working organic farm around a 16th-century manor house — kids feed ponies, collect eggs, watch farriers work on real animals.",st:"You walk onto actual working farmland. There are horses, sheep, goats, cattle, pigs, chickens moving around. Kids immediately want to feed animals. There's a farm shop, a restaurant with a terrace, and scheduled activities like horseshoe throwing or bread baking. The manor museum is technically paid but kids under 18 are free.",im:"Real horse manure smell, hay in the air, the sound of actual farm work happening around you.",t:"U-Bahn U3 to Dahlem-Dorf, then walk 3 mins. Grounds free. Manor museum free for under-18s. Pony rides available (small fee). Toilets. Pushchair-friendly. Farm shop has decent snacks. Spring and harvest festivals are worth timing around.",c:["animals","picnic","making"],r:"g",age_min:3,age_max:13,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Domäne Dahlem — Dahlem",ns:"Aktiver Biohof um ein Herrenhaus aus dem 16. Jahrhundert.",nst:"Du betrittst echtes Farmland. Es gibt Pferde, Schafe, Ziegen, Rinder, Schweine, Hühner. Kinder wollen sofort Tiere füttern. Es gibt einen Hofladen, ein Restaurant und geplante Aktivitäten.",nt:"U-Bahn U3 zum Dahlem-Dorf, 3 Min. zu Fuß. Hof kostenlos. Herrenhaus-Museum kostenlos für unter 18.",quiz:[{q:"What animals can you feed at Domäne Dahlem?",a:"Goats, sheep, and sometimes ponies",options:["Only chickens","Goats, sheep, and sometimes ponies","Pigs and cattle","No animals — it's a farm, not a petting zoo"],age_min:5,fun_fact:"The animals here are part of working farm operations — they're not just for petting."},{q:"How old is the manor house at Domäne Dahlem?",a:"Over 400 years old (16th century)",options:["100 years old","Over 400 years old (16th century)","Medieval — over 1000 years","It was built in 1950"],age_min:8,fun_fact:"The manor is still used for the farm office — it's not a museum you tour, just a beautiful building you see."}]},{id:9,n:"Kinderbauernhof Pinke-Panke — Wedding",a:"Wedding",v:["animals","free","outdoor_play"],d:15,s:"Small free city farm where kids can actually work alongside staff — mucking out, feeding, basic farm skills.",st:"This is genuinely a working farm, not a petting zoo. There's space that feels wild and improvised. Chickens, goats, rabbits, sometimes horses. Kids get assigned small tasks like 'feed the rabbits' or 'water the garden'. It matters because the farm actually depends on it.",im:"Muddy boots, hay stuck in your clothes, the smell of animals and work happening around you.",t:"U-Bahn U6 to Afrikanische Straße. Free. Small donation welcomed. Toilets available. Not pushchair-friendly once you're in the farm area — paths are rough. Usually open Wed-Sun. Call ahead to check schedule. Very local spot — not touristy.",c:["animals","making"],r:"g",age_min:5,age_max:12,budget:"free",pushchair:false,toilet:true,rainy:false,duration_min:60,duration_max:120,nn:"Kinderbauernhof Pinke-Panke — Wedding",ns:"Kleine kostenlose Stadtfarm, wo Kinder real mitarbeiten.",nst:"Das ist genuiner Farmarbeit, keine Streichelzoo. Hühner, Ziegen, Kaninchen, manchmal Pferde. Kinder bekommen kleine Aufgaben wie 'Kaninchen füttern' — es zählt wirklich.",nt:"U-Bahn U6 zur Afrikanischen Straße. Kostenlos. Kleine Spende erwünscht. Ungünstiges Gelände für Kinderwagen.",quiz:[{q:"What real farm task might you help with at Pinke-Panke?",a:"Feeding animals, watering plants, mucking out",options:["Just looking at animals","Feeding animals, watering plants, mucking out","Riding horses","Selling produce"],age_min:6,fun_fact:"This isn't a petting zoo — the farm actually depends on kids helping to function."},{q:"What smell tells you you're actually on working farmland?",a:"Animal manure and hay",options:["Only flowers","Animal manure and hay","Fresh paint","Food cooking"],age_min:6,fun_fact:"The farm smell is honest — it's not hiding what farms actually smell like, and kids often think it's funny."}]},{id:10,n:"Rummelsburger Bucht Swimming Area — Friedrichshain",a:"Friedrichshain",v:["water_play","free"],d:20,s:"Industrial waterfront turned swimming spot near defunct power station — moody, slightly alternative vibe.",st:"You arrive and see old industrial buildings reflected in water. It feels different from other Berlin lakes — less 'beach resort' more 'urban swimmers know about this place'. Kids notice the contrast between the huge abandoned buildings and the water.",im:"Red brick industrial structures loom behind calm water — slightly eerie in a way kids find interesting.",t:"S-Bahn S5/S7/S75 to Ostkreuz, then walk 15 mins, or bus. Free. Toilets minimal — plan ahead. Water quality: the Bucht is part of the Spree river system and does not hold the same official bathing water certification as Berlin's designated lakes (Müggelsee, Schlachtensee etc). Locals swim here regularly, but verify water quality reports at berlin.de/lageso before visiting with children. Less crowded than Schlachtensee. Best in shoulder seasons when it's warm but not peak summer.",c:["water_play","swimming","weird"],r:"g",age_min:7,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"Rummelsburger Bucht — Friedrichshain",ns:"Industriewasserkante als Badeplatz neben ausrangiertem Kraftwerk.",nst:"Du kommst an und siehst alte Industriegebäude im Wasser gespiegelt. Es wirkt anders als andere Seen — weniger 'Badestrand', mehr 'Platz, den Berliner kennen'.",nt:"S-Bahn S5/S7/S75 zum Ostkreuz, dann 15 Min. zu Fuß. Kostenlos. Toiletten minimal.",quiz:[{q:"What industrial structure sits behind Rummelsburger Bucht?",a:"A defunct power station",options:["A factory","A defunct power station","An old hospital","A train depot"],age_min:8,fun_fact:"The power station hasn't worked for decades — now it's just a beautiful monument while people swim below."},{q:"Why is this spot less crowded than other Berlin lakes?",a:"It's harder to reach and has fewer facilities",options:["It's dirty","It's harder to reach and has fewer facilities","It's dangerous","It's actually more crowded"],age_min:9,fun_fact:"Locals call it a 'local secret' even though anyone can go there."}]},{id:11,n:"Görli Wald and Wildgehege — Kreuzberg",a:"Kreuzberg",v:["animals","free","wild"],d:15,s:"Urban forest with a small wildlife enclosure where you can see boar, deer, and lynx without a big zoo commitment.",st:"You walk through actual forest paths, then find a small enclosure. The animals are visible and close. It feels more like stepping into wilderness than entering a designed attraction. Quiet and almost secret-feeling.",im:"Dappled forest light, the smell of leaves and earth, then suddenly you're looking at a wild boar 10 metres away through a fence.",t:"U-Bahn U1/U3 to Görlitzer Straße. Small donation for wildlife enclosure. Free to walk the forest. Toilets at nearby café. Rough paths — not ideal for pushchairs. Any season is fine — forest is beautiful year-round.",c:["animals","wild"],r:"g",age_min:5,age_max:13,budget:"cheap",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:120,nn:"Görli Wald — Kreuzberg",ns:"Stadtwald mit kleinem Wildgehege für Wildschweine und Hirsche.",nst:"Du gehst durch echte Waldpfade, dann findest du ein kleines Gehege. Tiere sind sichtbar und nah. Es wirkt wie Wildnis betreten, nicht wie gestaltete Attraktion.",nt:"U-Bahn U1/U3 zur Görlitzer Straße. Kleine Spende für Gehege. Kostenlos, den Wald zu gehen. Pfade nicht ideal für Kinderwagen.",quiz:[{q:"What animals can you see in the Görli Wildgehege?",a:"Boar, deer, and sometimes lynx",options:["Wolves","Boar, deer, and sometimes lynx","Bears","Only birds"],age_min:6,fun_fact:"The wildgehege is so small that you're very close to the animals — closer than most zoos."},{q:"How did Görli forest stay wild in the middle of Berlin?",a:"It was protected as a nature reserve",options:["No one knows","It was protected as a nature reserve","It's not actually wild — it's planted","It's in the suburbs, not the city"],age_min:9,fun_fact:"The forest is ancient — it's been there longer than Berlin as a city."}]},// STORIES & IMAGINATION (4 entries)
{id:12,n:"Nordbahnhof Ghost Station Exhibition — Mitte",a:"Mitte",v:["stories_and_legends","free","history"],d:20,s:"Free permanent exhibition on the mezzanine level of this Cold War 'ghost station' — the only S-Bahn stop inside East Berlin that trains passed but didn't stop.",st:"You descend into the mezzanine and find exhibition panels explaining what it was like to ride through a forbidden station. There are real photos, explained border fortifications, and accounts of escape attempts. Kids understand the weird horror of division through physical space. It's genuinely gripping.",im:"Standing in a train station platform that trains pass through but never stop — you feel the strangeness of it immediately.",t:"S-Bahn S1/S2/S25 to Nordbahnhof (the exhibition is accessible from outside the station at street level too). Free. Takes 30-45 mins to read properly. Open during station hours. English and German signage. Fits well with nearby Wall memorial sites.",c:["stories_and_legends","history"],r:"g",age_min:8,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:true,duration_min:30,duration_max:60,nn:"Nordbahnhof Geisterbahnhof Ausstellung — Mitte",ns:"Kostenlose Dauerausstellung über eine S-Bahn-Station, die Züge durchfuhren, aber nicht hielten.",nst:"Du gehst in die Mezzanin-Ebene und findest Ausstellungstafeln über die Zeit der Teilung. Es gibt echte Fotos, erklärte Grenzbefestigungen, Fluchtgeschichten. Kinder verstehen die Merkwürdigkeit der Teilung durch Raum.",nt:"S-Bahn S1/S2/S25 zum Nordbahnhof. Kostenlos. 30-45 Min. zum Lesen. Englisch und Deutsch.",quiz:[{q:"Why was Nordbahnhof called a 'ghost station'?",a:"Trains passed through but never stopped",options:["It was haunted","Trains passed through but never stopped","No one ever used it","It was underground and dark"],age_min:8,fun_fact:"Passengers on West Berlin trains could see the station but the train would just keep going without stopping."},{q:"Who used escape tunnels beneath Berlin's stations during the Cold War?",a:"People trying to escape from East to West",options:["Soldiers","People trying to escape from East to West","Spies meeting secretly","No one — tunnels didn't exist"],age_min:9,fun_fact:"Several people actually escaped through tunnels dug under the wall and under stations."}]},{id:14,n:"Spree Forest (Spreewald) Day Trip — Lübben (day trip, 90 mins)",a:"Lübben",v:["water_play","stories_and_legends","treasure_hunt"],d:25,s:"Wetland forest with narrow waterways — canoe or gondola tours through forested channels that feel like another world entirely.",st:"You arrive and immediately get in a small boat. The waterways are narrow with trees on both sides. It feels like a hidden forest world. Guides pole the boats slowly, pointing out wildlife and old villages. Kids zone out in the way they do with water and trees.",im:"Trees overhead, water beneath, silence except for the pole pushing through water and bird sounds.",t:"Regional train (Regionalbahn) from Berlin Hauptbahnhof to Lübben — 90 minutes. Then local transport or walking to boat rental. Tours available hourly. €10-20 per person for boats. Worth it as a full-day mission — pack lunch. Less touristy than Potsdam.",c:["water_play","stories_and_legends","imagination_spots"],r:"g",age_min:4,age_max:14,budget:"moderate",pushchair:false,toilet:false,rainy:false,duration_min:240,duration_max:360,nn:"Spreewald — Lübben (Tagesausflug)",ns:"Sumpfwald mit schmalen Wasserstraßen — Kahn- oder Gondel-Touren durch bewaldete Kanäle.",nst:"Du kommst an und steigst sofort in ein Boot. Die Wasserstraßen sind eng mit Bäumen auf beiden Seiten. Es wirkt wie eine Waltwelt. Guides stoßen das Boot langsam, zeigen Wildnis.",nt:"Regionalbahn vom Berlin Hauptbahnhof nach Lübben — 90 Min. Dann lokale Verkehrsmittel zu Bootsvermieter. Touren stündlich. €10-20 pro Person.",quiz:[{q:"What makes Spreewald special compared to regular lakes?",a:"It's a forest with water running through it, not just open water",options:["It has more fish","It's a forest with water running through it, not just open water","It's saltwater","It's frozen year-round"],age_min:7,fun_fact:"The Spreewald is a UNESCO biosphere reserve — it's protected because it's so unique."},{q:"How do traditional Spreewald boats move through the water?",a:"Poles pushed by the boatman (not oars or motors)",options:["Oars","Poles pushed by the boatman (not oars or motors)","Motors","They float with the current"],age_min:6,fun_fact:"The waterways are too shallow and narrow for motorboats, so poles are the traditional way."}]},{id:15,n:"Neukölln Graffiti Tours — Neukölln",a:"Neukölln",v:["weird","stories_and_legends","imagination"],d:20,s:"Street art walking tour through Neukölln's lanes — graffiti that ranges from tags to murals, tells you about crew history and technique.",st:"Your guide is usually a local graffiti artist or someone who knows the scene. You walk through back alleys and see pieces that are clearly part of a narrative. Kids learn that graffiti can be artistic and has rules and respect hierarchies they don't know about. It's a genuinely different view of the city.",im:"Four-storey-high murals in narrow streets, colors that are obviously illegal, and the sense of a thriving underground scene.",t:"U-Bahn U7/U8 to Neukölln areas. Tours by Street Art Berlin or similar guides. €10-15 per person. Weekends better for finding legal walls. Best for ages 9+. Takes 1.5-2 hours. Very real perspective on the city.",c:["stories_and_legends","weird","imagination_spots"],r:"g",age_min:9,age_max:14,budget:"cheap",pushchair:false,toilet:false,rainy:false,duration_min:90,duration_max:120,nn:"Neukölln Graffiti-Touren — Neukölln",ns:"Street Art Wanderung durch die Gassen mit Graffiti-Geschichte und Technik.",nst:"Dein Guide ist meist ein lokaler Graffiti-Künstler. Ihr geht durch Hintergassen und seht Pieces, die Teil einer Geschichte sind. Kinder lernen, dass Graffiti künstlerisch sein kann.",nt:"U-Bahn U7/U8 zu Neukölln. Touren von Street Art Berlin oder ähnlich. €10-15 pro Person. Wochenende besser.",quiz:[{q:"What's the difference between a 'tag' and a 'piece' in graffiti culture?",a:"Tag is quick marker, piece is larger complex artwork",options:["Nothing","Tag is quick marker, piece is larger complex artwork","Tag is illegal, piece is legal","Tags are better than pieces"],age_min:10,fun_fact:"Crews spend weeks on single pieces in hidden alleys, then hours building a 'wildstyle' that's so complex other writers can barely read it."},{q:"Why do some walls have new graffiti and others are blank?",a:"Artists respect certain walls and leave others for specific crews",options:["No artists know about blank walls","Artists respect certain walls and leave others for specific crews","Blank walls are protected","Random chance"],age_min:9,fun_fact:"There's a whole unwritten code about whose wall is whose — respected writers know this and follow it."}]},// MAKE (3 entries)
{id:16,n:"Keramik Kingdom Workshop — Kreuzberg",a:"Kreuzberg",v:["making","imagination"],d:25,s:"Open ceramics studio where kids can hand-build clay without a wheel — shapes, textures, immediate results.",st:"You walk in and there's clay available. No lesson needed. Kids start building immediately — adding to clay, pinching, rolling. Parents can work too or just watch. The studio is organized but feels creative, not structured. Finished pieces get glazed and fired.",im:"Hands covered in clay, smooth clay becoming weird shapes, the smell of wet earth.",t:"U-Bahn U1/U6 to Kottbusser Tor or walk from Ostkreuz. €20-30 for a session including materials. Walk-ins sometimes possible but booking ahead better. Takes 60-90 mins. Kids get a finished piece mailed or picked up later. Great for rainy days.",c:["making","rainy_day"],r:"g",age_min:5,age_max:13,budget:"moderate",pushchair:false,toilet:true,rainy:true,duration_min:60,duration_max:120,nn:"Ceramic Kingdom Workshop — Kreuzberg",ns:"Offenes Keramik-Studio, Kinder bauen Ton ohne Töpferscheibe.",nst:"Du gehst rein und es gibt Ton. Kinder fangen sofort an zu bauen — zu Ton hinzufügen, kneifen, rollen. Das Studio wirkt kreativ, nicht strukturiert.",nt:"U-Bahn U1/U6 zum Kottbusser Tor. €20-30 pro Session. Anmeldung empfohlen. 60-90 Min.",quiz:[{q:"How is hand-building clay different from using a pottery wheel?",a:"You shape with your hands instead of spinning clay",options:["Hand-building is easier","You shape with your hands instead of spinning clay","Hand-building is only for decoration","No real difference"],age_min:7,fun_fact:"Hand-building is actually ancient — the pottery wheel wasn't invented until much later."},{q:"What happens to your clay after the workshop?",a:"It gets glazed and fired in a kiln",options:["You take it home wet","It gets glazed and fired in a kiln","It's recycled","It stays in the studio"],age_min:6,fun_fact:"Firing in the kiln takes a week or two, but it makes the clay hard and permanent."}]},{id:17,n:"Upcycling Workshop at NochMall — Kreuzberg",a:"Kreuzberg",v:["making","free"],d:20,s:"BSR's repair and upcycling workshop — take broken stuff or old clothes and learn to fix or transform them.",st:"You bring something broken or just old. Staff help you fix it or turn it into something new. There's no product pressure — it's genuinely about making, not consuming. Kids learn that things can be repaired and reimagined. Very Berlin ethos of 'make do'.",im:"Sewing machines, tools, people's old stuff being transformed into new things, the smell of old textiles and machine oil.",t:"U-Bahn U1/U8 to Mehringdamm. Free or small donation. Workshops on weekends or arrange groups. Takes 1.5-2 hours. Best for ages 8+. Bring something you actually want to fix. Very local spot.",c:["making"],r:"g",age_min:8,age_max:14,budget:"free",pushchair:false,toilet:true,rainy:true,duration_min:90,duration_max:120,nn:"Upcycling Workshop NochMall — Kreuzberg",ns:"BSR-Werkstatt für Reparatur und Upcycling — alte Sachen reparieren oder umgestalten.",nst:"Du bringst etwas Kaputtes oder Altes mit. Staff helfen dir, es zu reparieren oder zu verwandeln. Es gibt keinen Produktdruck — es geht um Machen, nicht Verbrauchen.",nt:"U-Bahn U1/U8 zum Mehringdamm. Kostenlos oder kleine Spende. Workshops am Wochenende. 1,5-2 Stunden.",quiz:[{q:"What does 'upcycling' mean?",a:"Transforming old or broken things into something new and useful",options:["Recycling plastic","Transforming old or broken things into something new and useful","Throwing things away","Buying new things"],age_min:8,fun_fact:"Upcycling is different from recycling — you're not breaking it down, you're making it into something better."},{q:"What's the BSR?",a:"Berlin's waste and cleaning company",options:["A fashion brand","Berlin's waste and cleaning company","A tech startup","A museum"],age_min:9,fun_fact:"The BSR runs NochMall to teach people that trash can become treasure."}]},{id:18,n:"Pottery Class at Peace Out Paradise — Friedrichshain",a:"Friedrichshain",v:["making"],d:25,s:"Community ceramics studio offering hand-building and wheel-throwing classes for families.",st:"You sit at a table with clay. A teacher shows technique but encourages experimentation. The studio has a calm, non-competitive feel. Other kids and parents are working too, so it feels social. Finished pieces are fired and glazed.",im:"Hands on wet clay spinning or shaping, the earthy smell, watching someone else's clay become a shape you didn't expect.",t:"U-Bahn U5 to Ostkreuz, walk or U1 to Warschauer Straße. Classes €25-40 per session, family classes available. Book ahead. Studio has toilet. Splashing water — bring clothes that stain okay. Worth repeating — most kids want to come back.",c:["making"],r:"g",age_min:6,age_max:13,budget:"moderate",pushchair:false,toilet:true,rainy:true,duration_min:90,duration_max:120,nn:"Pottery Class Peace Out Paradise — Friedrichshain",ns:"Community-Keramik-Studio mit Hand-Formung und Töpferscheibe.",nst:"Du sitzt am Tisch mit Ton. Lehrer zeigen Technik, ermutigen aber zum Experimentieren. Das Studio wirkt ruhig, nicht kompetitiv.",nt:"U-Bahn U5 zum Ostkreuz. Kurse €25-40 pro Session. Anmeldung. Toilette im Studio.",quiz:[{q:"What's the difference between hand-building and wheel-throwing in pottery?",a:"Hand-building uses hands, wheel-throwing spins clay",options:["Hand-building is harder","Hand-building uses hands, wheel-throwing spins clay","They're the same","Wheel-throwing is for children only"],age_min:7,fun_fact:"Wheel-throwing feels like magic the first time — the clay seems to spin itself into shape."},{q:"How long do you wait before you can take your finished piece home?",a:"A few weeks after glazing and firing",options:["A few days","A few weeks after glazing and firing","Right away","It stays in the studio"],age_min:6,fun_fact:"The kiln runs on a schedule — pieces have to cure and then be fired together with others."}]},// MOVE (5 entries)
{id:19,n:"Kletterwald Wuhlheide Climbing Forest — Lichtenberg",a:"Lichtenberg",v:["moving_climbing","outdoor_play"],d:30,s:"Berlin's first climbing forest on FEZ grounds — 160 climbing elements across 11 courses, children's courses from age 3.",st:"You arrive and the staff fit harnesses. Kids climb through stations they can choose based on height and nerve. The courses are genuinely varied — from swings between trees to high ropes walks. It's not a zoo or controlled playground. It's a proper challenge that feels real.",im:"Heights. Tree-to-tree crossings, hands on bark, adrenaline when you realize you're 5 metres up.",t:"U-Bahn U5 to Köpenick, then bus or walk 10 mins to FEZ grounds. €15-20 per person depending on course. Harnesses and safety equipment provided. Toilets on FEZ grounds. Best before 11am on weekends. Takes 1.5-3 hours depending on course choice. Not worth going for under 1 hour.",c:["moving_climbing"],r:"g",age_min:3,age_max:14,budget:"cheap",pushchair:false,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Kletterwald Wuhlheide — Lichtenberg",ns:"Berlins erstem Kletterwald mit 160 Elementen und Kinderkursen ab 3 Jahren.",nst:"Du kommst an und Staff helfen mit Gurten. Kinder klettern durch Stationen, die sie wählen. Es gibt echte Kurse — von Schaukeln zwischen Bäumen zu hohen Seilen.",nt:"U-Bahn U5 nach Köpenick, dann Bus oder 10 Min. zu Fuß zum FEZ. €15-20 pro Person. Sicherheitsausrüstung vorhanden.",quiz:[{q:"What's the minimum age to climb in Kletterwald's children's courses?",a:"About 3 years old",options:["5 years","About 3 years old","7 years","No children allowed"],age_min:5,fun_fact:"Even very young kids can do easier courses with safety harnesses."},{q:"How many different courses are available in Kletterwald?",a:"11 courses at different heights and difficulty levels",options:["3","11 courses at different heights and difficulty levels","20","1 course for everyone"],age_min:7,fun_fact:"Some courses are for very young kids, some for teenagers and adults — everyone climbs the same day together."}]},{id:20,n:"Mellowpark BMX Park — Tempelhof",a:"Tempelhof",v:["moving_climbing","older_kids"],d:30,s:"60,000 square metres of BMX and skate park — if your kid is into wheels (bike, skate, scooter), this is the place.",st:"It's enormous. Multiple skill levels of ramps and features. Kids go at their own pace — beginners ride flat sections, advanced riders hit 10-metre jumps. The culture is chill but skilled. Everyone's watching everyone else's progression.",im:"The sound of wheels on concrete, bikes launching into the air, kids concentrating hard on landings.",t:"S-Bahn S2 or U-Bahn to Tempelhof area. Entry fee around €5 or membership available. Bring your own bike/skate/scooter — equipment rentals available. Helmet required. Toilets. Water fountain. Good café nearby. Best on weekday afternoons when it's less crowded.",c:["moving_climbing","older_kids"],r:"g",age_min:7,age_max:14,budget:"cheap",pushchair:false,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Mellowpark — Tempelhof",ns:"60.000 Quadratmeter BMX- und Skatepark mit Rampen für alle Levels.",nst:"Es ist riesig. Mehrere Levels von Rampen und Features. Kinder fahren in ihrer Geschwindigkeit — Anfänger auf flachen Sektionen, Fortgeschrittene auf 10-Meter-Sprüngen.",nt:"S-Bahn S2 oder U-Bahn zum Tempelhof-Bereich. Eintritt ca. €5 oder Mitgliedschaft. Eigenes Fahrrad/Skateboard mitbringen.",quiz:[{q:"How big is Mellowpark?",a:"60,000 square metres",options:["10,000 square metres","60,000 square metres","100,000 square metres","5,000 square metres"],age_min:7,fun_fact:"That's bigger than 8 football fields — it's one of Europe's biggest skate parks."},{q:"What do you need to bring to Mellowpark?",a:"Your own bike, skateboard, or scooter",options:["Nothing — it's all provided","Your own bike, skateboard, or scooter","Just sneakers","A helmet"],age_min:6,fun_fact:"The park provides helmets for everyone — you can't ride without one, even if you're experienced."}]},{id:21,n:"Rausgeglitten Urban Ropeway Park — Wedding",a:"Wedding",v:["moving_climbing","outdoor_play"],d:25,s:"Rope park with ziplines, swings, and elevated passages through trees — smaller than Kletterwald but more urban and less touristy.",st:"You climb into harnesses and move through courses that feel genuinely dangerous (but are safe). The zipline element makes kids feel fast and alive. The park is genuinely integrated into the city — you can hear the U-Bahn rumbling below.",im:"Flying through air on a zipline above street level, realizing the city is around you while you're in this bubble of forest and rope.",t:"U-Bahn U6 to Afrikanische Straße, then short walk. €20-25 per person. Group discounts. Harnesses and safety provided. Takes 1-2 hours per course. Best for confident climbers — the courses are challenging. Not recommended for very young kids.",c:["moving_climbing"],r:"g",age_min:8,age_max:14,budget:"moderate",pushchair:false,toilet:true,rainy:false,duration_min:60,duration_max:120,nn:"Rausgeglitten Hochseilgarten — Wedding",ns:"Seilpark mit Ziplines und erhöhten Passagen durch Bäume.",nst:"Du steigst in Gurte und bewegst dich durch Kurse, die sich echt gefährlich anfühlen (aber sicher sind). Das Zipline-Element macht Kinder schnell und lebendig.",nt:"U-Bahn U6 zur Afrikanischen Straße. €20-25 pro Person. Gurte und Sicherheit vorhanden.",quiz:[{q:"What's the main difference between a rope park and a climbing forest?",a:"Rope parks have ziplines and raised passages, climbing forests have more tree-to-tree elements",options:["Nothing — they're the same","Rope parks have ziplines and raised passages, climbing forests have more tree-to-tree elements","Rope parks are outdoors, climbing forests are indoors","Climbing forests are more fun"],age_min:8,fun_fact:"Both are adrenaline sports disguised as play."},{q:"Why is a zipline thrilling?",a:"You're flying through the air at speed while you're in control",options:["It's not thrilling","You're flying through the air at speed while you're in control","It's loud","You're hanging upside down"],age_min:7,fun_fact:"Ziplines are one of the safest sports because the harness and cable do all the work."}]},{id:22,n:"Tempelhof Field Cycling Circuit — Tempelhof",a:"Tempelhof",v:["outdoor_play","free"],d:20,s:"The world's largest inner-city park with a 6km cycling and skating loop around the old runways — flat, endless space, safe from traffic.",st:"You step into an enormous open field. The cycling loop is marked. Kids ride without worrying about cars. They can go fast. The novelty is the scale — it's so big that you feel like you're not in the city. People ride, skate, picnic, fly kites on the same space.",im:"Riding on what used to be an airport runway, nothing but sky and other riders around you, the Tempelhof terminal building visible in the distance.",t:"S-Bahn S2 to Tempelhof or multiple U-Bahn options. Free. Bike rental available nearby. Bring your own is better if you have one. Water fountain and café available. Best on dry days — muddy after rain. Can combine with Mellowpark for a full day.",c:["outdoor_play"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:180,nn:"Tempelhofer Feld Fahrradstrecke — Tempelhof",ns:"Weltweit größter innerstädtischer Park mit 6km Radspur um alte Runways.",nst:"Du betrittst ein riesiges offenes Feld. Die Radspur ist markiert. Kinder fahren ohne Auto-Sorgen. Das Gelände ist so groß, dass du dich nicht in der Stadt fühlst.",nt:"S-Bahn S2 zum Tempelhof. Kostenlos. Fahrradverleih vorhanden.",quiz:[{q:"What was Tempelhof Field before it became a park?",a:"An airport",options:["A farm","An airport","A military base","A lake"],age_min:6,fun_fact:"The last plane landed here in 1975 — now 300,000 people come to ride bikes and fly kites on the old runway."},{q:"How long is the cycling loop around Tempelhof?",a:"6 kilometres",options:["2 kilometres","6 kilometres","10 kilometres","15 kilometres"],age_min:7,fun_fact:"You can ride the whole loop without touching brakes if you're comfortable on a bike."}]},{id:23,n:"Volkspark Friedrichshain with Fairy Tale Fountain — Friedrichshain",a:"Friedrichshain",v:["outdoor_play","water_play"],d:20,s:"Large East Berlin park with the Märchenbrunnen (Fairy Tale Fountain) — a stunning fountain with elephant statues spouting water, plus open space and multiple playgrounds.",st:"You come to the fountain and see enormous elephant sculptures with water pouring out. Kids immediately run underneath the water, getting soaked. The fountain is surrounded by mosaic fairy tale scenes that are genuinely beautiful. The park itself is huge — open meadows, climbing structures, everything.",im:"A child standing under an elephant's trunk as water pours down, surrounded by colorful mosaic tiles depicting storybook scenes.",t:"U-Bahn U5/U1 to Friedrichshain. Free. Water fountain runs roughly May-September. Toilets in park. Multiple playgrounds scattered throughout. Food stands. Pushchair-friendly paths. Very crowded on hot days after 15:00.",c:["outdoor_play","water_play"],r:"g",age_min:2,age_max:12,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Volkspark Friedrichshain mit Märchenbrunnen — Friedrichshain",ns:"Großer Ostberliner Park mit ikonischem Märchenbrunnen mit Elefanten-Wasserspielen.",nst:"Du kommst zum Brunnen und siehst riesige Elefantenskulpturen mit Wasser. Kinder rennen sofort darunter und werden nass. Der Brunnen ist von schönen Mosaik-Märchenszenen umgeben.",nt:"U-Bahn U5/U1 zum Friedrichshain. Kostenlos. Wasser Mai-September. Toiletten im Park.",quiz:[{q:"What kind of animals is the Märchenbrunnen fountain made from?",a:"Elephants and other creatures from fairy tales",options:["Just horses","Elephants and other creatures from fairy tales","Dragons only","No animals — it's abstract"],age_min:5,fun_fact:"The fountain was built in 1913 in East Berlin and survived both World Wars."},{q:"What are the decorations around the fountain made from?",a:"Mosaic tiles depicting fairy tale scenes",options:["Painted wood","Mosaic tiles depicting fairy tale scenes","Bronze sculptures","Carved stone"],age_min:6,fun_fact:"Some of the mosaics have been damaged and repaired over the years, making them a patchwork of old and new art."}]},// DISCOVER (4 entries)
{id:24,n:"RAW-Gelände (Abandoned Rail Yard Complex) — Friedrichshain",a:"Friedrichshain",v:["weird","hidden"],d:30,s:"Massive derelict railway repair depot turned into a creative space — climbing on old locomotives, exploring industrial buildings, art installations.",st:"You walk through a gate into another era. There are actual train engines and cars you can climb on. The buildings are semi-abandoned but constantly being used for concerts, art, events. It feels like you've stepped outside the normal city into a place that makes its own rules.",im:"A six-metre-high locomotive in front of you, graffiti covering everything, the sound of hammering from someone's art project echoing across the yard.",t:"U-Bahn U1 to Warschauer Straße or S-Bahn S3/S5/S7/S75. Free to explore outdoor areas. Some areas are event venues (tickets required). Best weekend afternoons when it's buzzing. Not a 'sightseeing' spot — it's a living creative space. Bring curiosity.",c:["weird","hidden","imagination_spots"],r:"g",age_min:6,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"RAW-Gelände — Friedrichshain",ns:"Massives derelikt Eisenbahnwerk, jetzt kreativer Raum mit kletterbar Lokomotiven.",nst:"Du gehst durch ein Tor in eine andere Ära. Es gibt echte Zugmaschinen, auf denen du klettern kannst. Die Gebäude sind teilweise leer, werden aber ständig für Konzerte genutzt.",nt:"U-Bahn U1 zu Warschauer Straße oder S-Bahn. Kostenlos im Außenbereich. Einige Bereiche sind Veranstaltungsorte (Tickets erforderlich).",quiz:[{q:"What was the RAW-Gelände originally used for?",a:"Railway engine repair and maintenance",options:["Storage","Railway engine repair and maintenance","Military barracks","Housing"],age_min:7,fun_fact:"It's one of the largest train repair facilities in Europe from the 1800s."},{q:"Can you climb on the locomotives at RAW?",a:"Yes, many are accessible to climb on",options:["No — it's strictly forbidden","Yes, many are accessible to climb on","Only with permission","Only adults can"],age_min:6,fun_fact:"The locomotives have been there for decades and are now part of the landscape kids play on."}]},{id:25,n:"Peacock Island (Pfaueninsel) — Zehlendorf",a:"Zehlendorf",v:["animals","weird","beautiful"],d:25,s:"Small island in the Havel with free-roaming peacocks, historic folly castle, and walkable only by foot ferry.",st:"You take a hand-cranked ferry and immediately feel like you've left Berlin. The island is small but has peacocks everywhere. There's a miniature castle that's absurdly ornate. Kids understand 'folly' — a building that was made just because someone could and wanted to, not for any practical reason.",im:"A peacock strutting across a path with its tail fanned, the castle visible through trees, water all around you.",t:"S-Bahn S1/S7 to Nikolassee, then walk 5 mins to ferry dock. Ferry €4 return. Island entry free. Takes 30-45 mins one way ferry + walking. Very peaceful. Water in summer is cold. Best in spring when castle has flowers.",c:["animals","weird","beautiful"],r:"g",age_min:4,age_max:12,budget:"cheap",pushchair:false,toilet:false,rainy:false,duration_min:120,duration_max:180,nn:"Pfaueninsel — Zehlendorf",ns:"Kleine Insel in der Havel mit freilaufenden Pfauen und Schlösschen.",nst:"Du nimmst eine Fähre und verlässt sofort Berlin. Die Insel ist klein aber mit Pfauen überall. Es gibt ein verrücktes Schlösschen.",nt:"S-Bahn S1/S7 zu Nikolassee, dann 5 Min. zur Fährstation. Fähre €4 Hin-Rück.",quiz:[{q:"How do you get to Peacock Island?",a:"By hand-cranked ferry",options:["Swimming","By hand-cranked ferry","By boat with a motor","There's a bridge"],age_min:5,fun_fact:"The ferry is so small and hand-powered that you can feel the island working to stay isolated."},{q:"What's a 'folly' in architecture?",a:"A building made just for decoration or whimsy, not practical use",options:["A building that fell apart","A building made just for decoration or whimsy, not practical use","A small castle","A building that's ugly"],age_min:8,fun_fact:"Wealthy people used to build follies just to show off — this castle is absurdly small and ornate for no reason other than that."}]},{id:26,n:"Wassertor Ruins (Remnants of Berlin Wall) — Friedrichshain",a:"Friedrichshain",v:["weird","history","free"],d:15,s:"Overgrown ruins of a Berlin Wall watchtower and gate — nature reclaiming concrete, a memorial that's not manicured.",st:"You find crumbling concrete towers covered in ivy and graffiti. It's not a museum exhibit — it's abandoned, slightly eerie, genuinely from the Cold War era. Kids understand 'after the war ended, people left things and nature took over'. It's powerful in a way curated memorials aren't.",im:"Cracked concrete walls overtaken by vegetation, the scale of the tower visible but now fragile, knowing people were watching from here.",t:"S-Bahn to Ostkreuz, then walk or U-Bahn U1/U5 to various points near Friedrichshain. Free. These are outdoor ruins — always accessible. Combine with nearby East Side Gallery (free outdoor murals) for context.",c:["weird","history"],r:"g",age_min:8,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,nn:"Wassertor Ruinen — Friedrichshain",ns:"Verfallene Ruinen eines Berliner Mauer Wachturms, überwachsen von Natur.",nst:"Du findest bröckelnde Betonmauern, überzogen von Efeu und Graffiti. Es ist nicht kuratiert — es ist verlassen, leicht unheimlich, echt aus dem Kalten Krieg.",nt:"S-Bahn zum Ostkreuz oder U-Bahn. Kostenlos. Immer zugänglich.",quiz:[{q:"What was being 'watched' from these watchtower ruins?",a:"The border between East and West Berlin during the Cold War",options:["Nothing — they were abandoned","The border between East and West Berlin during the Cold War","Prisoners","A public square"],age_min:9,fun_fact:"Guards stood in these towers watching the wall 24/7 to prevent escapes."},{q:"How long ago did this tower stop being used?",a:"About 35 years ago (1989)",options:["5 years ago","About 35 years ago (1989)","100 years ago","It's still in use"],age_min:8,fun_fact:"In 35 years, plants have taken over concrete that was carefully maintained — nature wins."}]},{id:27,n:"Museum Island (Museumsinsel) — Mitte",a:"Mitte",v:["discover","free"],d:30,s:"Five major museums on one island, many free for under-18s — Pergamon, Neues, Bode, Altes, Alte Nationalgalerie.",st:"You walk across a bridge onto an island with 5 enormous museum buildings. Kids under 18 get free entry to national museums. Choose one, not all five. The Neues Museum has Egyptian mummies and is particularly visceral for kids. The Pergamon Museum is reopening — check dates.",im:"Walking up steps into a building full of antiquities, the scale of what museums contain becoming real.",t:"S-Bahn S1/S2/S25/S5/S7 or U-Bahn U2/U5/U6/U8 to Mitte. Free for under-18s to all national museums. Audio guides available (paid). Toilets throughout. Food options on island. Takes 1.5-3 hours per museum. Best before 11am or after 14:00.",c:["discover","stories_and_legends"],r:"g",age_min:6,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:true,duration_min:90,duration_max:180,nn:"Museumsinsel — Mitte",ns:"Fünf große Museen auf einer Insel, viele kostenlos für unter-18-Jährige.",nst:"Du gehst über eine Brücke auf eine Insel mit 5 großen Museumgebäuden. Kinder unter 18 kostenlos zu Nationalmuseen.",nt:"S-Bahn oder U-Bahn zum Mitte. Kostenlos für unter 18. Toiletten überall.",quiz:[{q:"Why is the Neues Museum particularly interesting for kids?",a:"It has Egyptian mummies and ancient artifacts",options:["It's brand new","It has Egyptian mummies and ancient artifacts","It has modern art","It's underground"],age_min:7,fun_fact:"The mummies have stories written on their containers — you can read about real ancient people."},{q:"Who gets free entry to Berlin's national museums?",a:"Anyone under 18 years old",options:["No one","Anyone under 18 years old","Only students","Only locals"],age_min:6,fun_fact:"This is genuinely free and is one of Berlin's best deals for families."}]},// GROW (3 entries)
{id:28,n:"Botanical Garden (Botanischer Garten) — Dahlem",a:"Dahlem",v:["beautiful","quiet"],d:25,s:"Berlin's enormous botanical garden — over 20,000 plant species, greenhouse complexes, seasonal blooms, genuinely peaceful.",st:"You enter and the crowds disappear immediately. There are sprawling meadows, organized plantings, greenhouses. Kids understand scale here — what started as someone's kitchen garden is now one of the second-largest in the world. Seasonal things matter — cherry blossoms in spring, winter structure in grey months.",im:"Walking through a tropical greenhouse suddenly, humidity on your face, exotic plants everywhere, the smell of earth and leaf.",t:"U-Bahn U3 to Dahlem-Dorf, then walk or bus. €8 admission (kids often free or cheap). Toilets. Good paths for pushchairs. Café on grounds. Takes 2-4 hours depending on how slowly you move. Spring is best for blooms. Winter is beautiful for structure.",c:["beautiful","quiet","imagination_spots"],r:"g",age_min:4,age_max:14,budget:"cheap",pushchair:true,toilet:true,rainy:false,duration_min:120,duration_max:240,nn:"Botanischer Garten — Dahlem",ns:"Riesiger botanischer Garten mit über 20.000 Pflanzenarten.",nst:"Du betrittst und die Menschenmenge verschwindet sofort. Es gibt Wiesen, organisierte Beete, Gewächshäuser. Kinder verstehen Größe hier.",nt:"U-Bahn U3 zum Dahlem-Dorf. €8 Eintritt (Kinder oft kostenlos). Toiletten. Kinderwagen-freundliche Wege.",quiz:[{q:"How many plant species does the Berlin Botanical Garden have?",a:"Over 20,000",options:["5,000","Over 20,000","100,000","1,000"],age_min:6,fun_fact:"If you spent one minute looking at each plant, it would take months to see them all."},{q:"What's inside the greenhouses at the botanical garden?",a:"Tropical and exotic plants from all over the world",options:["Regular Berlin plants","Tropical and exotic plants from all over the world","Vegetables","Flowers only"],age_min:7,fun_fact:"Some plants in the greenhouses come from rainforests you'll never visit — this is the closest you'll get."}]},{id:29,n:"Grunewald Forest and Teufelssee Lake — Charlottenburg",a:"Charlottenburg",v:["beautiful","wild"],d:30,s:"Large forest with small lakes and trails — genuinely feels wild even though it's in the city, good for seasonal walks.",st:"You enter the forest and the city disappears. There are multiple small lakes where you can spot turtles and ducks. Trails are clearly marked. In autumn, the light through the trees is golden. In spring, the forest floor is covered in wild garlic and blooms. It's not dramatic but it's real nature.",im:"Dappled forest light, the smell of damp earth and leaves, a sudden glimpse of a small lake between trees.",t:"S-Bahn S5/S7/S9 or U-Bahn U7 to various entry points. Free. Trails suit all abilities. No facilities inside forest — bring water. Best in spring (wild flowers and blooming) and autumn (golden light). Takes 1-3 hours depending on distance walked.",c:["beautiful","wild"],r:"g",age_min:4,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:90,duration_max:180,nn:"Grunewald Wald und Teufelssee — Charlottenburg",ns:"Großer Wald mit kleinen Seen — wirkt echte Wildnis im Stadtgebiet.",nst:"Du betrittst den Wald und die Stadt verschwindet. Es gibt mehrere kleine Seen. Pfade sind klar markiert.",nt:"S-Bahn oder U-Bahn zu verschiedenen Eingängen. Kostenlos. Keine Einrichtungen — bringt Wasser.",quiz:[{q:"What can you see in the small lakes of Grunewald forest?",a:"Turtles, ducks, and other water wildlife",options:["Fish only","Turtles, ducks, and other water wildlife","Nothing — they're man-made","Swans only"],age_min:6,fun_fact:"The turtles in Teufelssee came from abandoned pet boxes — people released them here decades ago."},{q:"What's the best season to walk in Grunewald forest?",a:"Spring for wildflowers, autumn for golden light",options:["Summer only","Spring for wildflowers, autumn for golden light","Winter","All seasons are the same"],age_min:7,fun_fact:"In spring the forest floor is literally white and purple with flowers — it's like walking through a garden."}]},{id:30,n:"Spandauer Forst Forest — Spandau",a:"Spandau",v:["beautiful","wild","quiet"],d:20,s:"Less-known Berlin forest with old beech trees, forest paths, and the feeling of escaping the city completely.",st:"You walk and it's quiet. The forest is dense. Beech trees are huge and create natural shade. There are clearings where sunlight breaks through. It's not a park — it's actual forest where Berliners walk dogs and ride bikes on narrow paths. Kids notice the difference between designed parks and actual nature.",im:"The forest is dark even in daylight, the path is soft earth, sounds of birds, the scale of hundred-year-old trees.",t:"S-Bahn S25 to Spandau, then regional bus or bike. Free. Trails are sometimes narrow and muddy. No facilities. Bring water. Not pushchair-friendly once off main paths. Best in dry weather. Quieter than Grunewald.",c:["beautiful","wild"],r:"g",age_min:6,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:60,duration_max:150,nn:"Spandauer Forst — Spandau",ns:"Weniger bekannter Berliner Wald mit alten Buchen und echtem Wildnis-Gefühl.",nst:"Du gehst und es ist ruhig. Der Wald ist dicht. Es wirkt wie echter Wald, nicht Park.",nt:"S-Bahn S25 zum Spandau, dann Regional-Bus. Kostenlos. Pfade manchmal schmal und matschig.",quiz:[{q:"What type of trees make up most of Spandauer Forst?",a:"Beech trees",options:["Oak","Beech trees","Birch","Pine"],age_min:7,fun_fact:"Beech forests are ancient — these trees were here when Napoleon was ruling Berlin."},{q:"How is Spandauer Forst different from Grunewald?",a:"It's less known and feels more wild, less designed",options:["It's bigger","It's less known and feels more wild, less designed","It's closer to the city","It's artificial"],age_min:8,fun_fact:"Most Berliners walk Grunewald. Spandauer Forst is where Berliners who want to be alone go."}]},// RESCUE/RAINY (4 entries)
{id:31,n:"Aquarium Berlin — Tiergarten",a:"Tiergarten",v:["rainy_day","animals"],d:30,s:"Massive aquarium with coral reefs, sharks, tropical fish, plus terrariums with reptiles and insects — essentially a complete indoor animal world.",st:"You walk in and it's dim and full of tanks. Fish are immediately visible. Kids move from tank to tank without pressure. The shark tank is genuinely impressive. There's a terrarium section with snakes and frogs. It's quiet, contained, and feels like stepping underwater.",im:"A shark gliding past your face separated only by glass, the eerie glow of tank lighting, thousands of small fish moving in synchronized patterns.",t:"S-Bahn or U-Bahn to Hauptbahnhof area. Admission €15-17 pp. Free under-3s. Food is available but overpriced — bring snacks. Toilets. Takes 1.5-2.5 hours to see properly. Can combine with Zoo Berlin (next door) for a full day. Least crowded on rainy weekdays.",c:["rainy_day","animals"],r:"g",age_min:3,age_max:14,budget:"moderate",pushchair:true,toilet:true,rainy:true,duration_min:90,duration_max:150,nn:"Aquarium Berlin — Tiergarten",ns:"Großes Aquarium mit Korallenriffen, Haien und tropischen Fischen.",nst:"Du gehst rein und es ist dunkel und voll mit Becken. Fische sind sofort sichtbar. Kinder wechseln von Becken zu Becken ohne Druck.",nt:"S-Bahn oder U-Bahn zum Hauptbahnhof-Bereich. Eintritt €15-17 pro Person. Unter 3 kostenlos.",quiz:[{q:"What's the main attraction in the shark tank?",a:"Actually seeing sharks up close swimming past",options:["Photos of sharks","Actually seeing sharks up close swimming past","Just water","Models of sharks"],age_min:6,fun_fact:"The sharks in the tank eat once a week and feeding day is posted — you can come see it."},{q:"Besides fish, what other animals are in Berlin Aquarium?",a:"Reptiles and insects in separate terrariums",options:["Just fish","Reptiles and insects in separate terrariums","Mammals","Birds"],age_min:6,fun_fact:"The reptile section has poisonous snakes behind glass — genuinely scary and awesome."}]},{id:32,n:"German Technik Museum (Deutsches Technikmuseum) — Kreuzberg",a:"Kreuzberg",v:["rainy_day","discover"],d:30,s:"Huge hands-on technology and transport museum — trains, planes, boats, printing presses, toy workshop. Free entry for under-18s.",st:"You enter and there are actual full-size trains and aircraft. Kids can interact — pull levers, press buttons, understand how things work. The toy workshop shows how toys were made. It's genuinely educational but feels like play. No 'do not touch' signs most places. Crowds vary by floor.",im:"Standing next to a full-size aircraft or train you could walk through, pressing buttons that made things happen.",t:"U-Bahn U1/U3 to Hallesches Tor or S-Bahn. Free for under-18s. Toilets throughout. Food options. Takes 2-4 hours to see meaningfully. Best on rainy days or mornings when less crowded. Not worth just a quick visit — it's big.",c:["rainy_day","discover"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:true,duration_min:120,duration_max:240,nn:"Deutsches Technikmuseum — Kreuzberg",ns:"Riesiges interaktives Technologie- und Verkehrsmuseum — Züge, Flugzeuge, Boote kostenlos für unter-18-Jährige.",nst:"Du betrittst und es gibt echte Züge und Flugzeuge. Kinder können interagieren — Hebel ziehen, Knöpfe drücken.",nt:"U-Bahn U1/U3 zum Hallesches Tor. Kostenlos unter 18.",quiz:[{q:"Can you actually go inside the trains and planes at the Technik Museum?",a:"Yes, many are fully accessible to walk through",options:["No — they're roped off","Yes, many are fully accessible to walk through","Only models, not real ones","Only looking at them"],age_min:6,fun_fact:"Some of the aircraft are legendary — they actually flew in WWII and survived."},{q:"What's special about the toy workshop section?",a:"It shows how toys were actually manufactured by hand",options:["You can buy toys","It shows how toys were actually manufactured by hand","It has modern toys","It's just a gift shop"],age_min:7,fun_fact:"Some toys shown here are 100 years old and still work — made to last, not disposable."}]},{id:33,n:"Legoland Discovery Centre Berlin — Friedrichshain",a:"Friedrichshain",v:["rainy_day","making"],d:25,s:"Indoor Lego-themed play space with a ninja obstacle course, building tables, and a Lego 4D cinema — completely covered.",st:"You walk into a space that's wall-to-wall Lego. There's a climbing ninja course kids run through. There are building tables where they assemble vehicles that race on tracks. The 4D cinema shows a short film with motion and effects. It's designed for non-stop activity.",im:"Building a Lego car and watching it race on a track you created, surrounded by millions of Lego bricks.",t:"U-Bahn U5 to Ostkreuz or walk from Friedrichshain. Admission €20-25 pp. Parking nearby. Toilets. Food stands (overpriced). Takes 1.5-2 hours. Better on actual rainy days when it's less crowded. Not worth in good weather — save for grey days.",c:["rainy_day","making"],r:"g",age_min:4,age_max:12,budget:"moderate",pushchair:false,toilet:true,rainy:true,duration_min:90,duration_max:120,nn:"Legoland Discovery Centre — Friedrichshain",ns:"Indoor Lego-Raum mit Ninja-Kurs und Bauplätzen.",nst:"Du gehst rein und es ist überall Lego. Es gibt einen Kletter-Ninja-Kurs. Es gibt Bauplätze zum Fahrzeugbau.",nt:"U-Bahn U5 zum Ostkreuz. Eintritt €20-25 pro Person.",quiz:[{q:"What's the ninja course at Legoland?",a:"An obstacle course kids climb and jump through",options:["A Lego display","An obstacle course kids climb and jump through","A video game","A movie"],age_min:5,fun_fact:"The ninja course changes layout occasionally — it's actually kind of challenging."},{q:"What happens to the cars you build at the building tables?",a:"They race on tracks you build for them",options:["You take them home","They race on tracks you build for them","They're deconstructed","Nothing"],age_min:6,fun_fact:"Kids design entire race tracks before building the cars — it's engineering play disguised as fun."}]},{id:34,n:"MACHmit! Museum and Indoor Playground — Lichtenberg",a:"Lichtenberg",v:["rainy_day","making","imagination"],d:30,s:"Children's museum combined with an indoor playground — interactive exhibits, climbing, slides, workshops all in one space.",st:"You enter and there are multiple zones. Some are problem-solving (how do you get this ball into that tube), some are physical (climbing walls, slides), some are creative (craft stations). It's genuinely designed for kids to figure things out, not for parents to guide them. Organized chaos.",im:"A child crawling through an obstacle course in a suspended net, another building something from scraps, the sound of play happening all around.",t:"U-Bahn U5 to Lichtenberg. Admission €9.50 pp. Takes 2-3 hours to wear kids out. Toilets. Small café. Rainy day perfect, but also good on grey weather days when outdoor options feel limited. Not crowded on weekday mornings.",c:["rainy_day","making","imagination_spots"],r:"g",age_min:4,age_max:11,budget:"cheap",pushchair:false,toilet:true,rainy:true,duration_min:120,duration_max:180,nn:"MACHmit! Museum — Lichtenberg",ns:"Kindermuseum mit Spielplatz — interaktive Ausstellungen, Klettern, Rutschen.",nst:"Du betrittst und es gibt mehrere Zonen. Einige sind Problemlösungen, einige körperlich, einige kreativ.",nt:"U-Bahn U5 zu Lichtenberg. Eintritt €9.50 pro Person.",quiz:[{q:"What's different about MACHmit! compared to most museums?",a:"Kids are supposed to figure things out and experiment, not just look",options:["It's for adults only","Kids are supposed to figure things out and experiment, not just look","There are no exhibits","Everything is behind glass"],age_min:6,fun_fact:"The exhibits are designed so that children discover things — no instructions unless necessary."},{q:"What happens if your kid gets tired at MACHmit!?",a:"There's a café, but also many different zones to switch between",options:["You have to leave","There's a café, but also many different zones to switch between","They sleep on the floor","You wait in a room"],age_min:5,fun_fact:"The variety of activities means kids naturally rotate between active and calm zones."}]},// NAVIGATE (5 entries)
{id:35,n:"Spree River Canoe Tour — Mitte to Friedrichshain",a:"Multiple",v:["treasure_hunt","water_play"],d:30,s:"Guided or self-guided paddling through Berlin's central waterways — Oberbaum Bridge, Molecule Men, Badeschiff swimming barge all from water level.",st:"You get in a canoe or kayak and suddenly the city looks completely different. You pass under bridges, see street art from unusual angles, paddle past the famous sculptures. The pace is slow. Kids don't get exhausted because they're floating. It's genuinely a different Berlin.",im:"Paddling under a massive bridge, looking up at the arch, then seeing city buildings reflected in calm water.",t:"Multiple tour operators (Backstagetourism, others). €15-30 pp for tours. Canoe rentals available for self-guided paddling. Tours run April-October usually. Best on calm water days. Takes 2-3 hours typically. Children from age 6-8 depending on operator.",c:["water_play","treasure_hunt"],r:"g",age_min:6,age_max:14,budget:"moderate",pushchair:false,toilet:false,rainy:false,duration_min:120,duration_max:180,nn:"Spree Kanu-Tour — Mitte zum Friedrichshain",ns:"Geführte oder selbstgeführte Kanufahrt durch Berlins Wasserwege.",nst:"Du steigst in ein Kanu und die Stadt sieht völlig anders aus. Du paddelist unter Brücken, siehst Straßenkunst aus anderen Winkeln.",nt:"Mehrere Tourveranstalter. €15-30 pro Person für Touren. Kanuverleih für selbstgeführtes Paddeln.",quiz:[{q:"What's the Badeschiff?",a:"A floating swimming pool in the Spree",options:["A bridge","A floating swimming pool in the Spree","A building","A water taxi"],age_min:7,fun_fact:"The Badeschiff is actually a repurposed barge — you can swim in the Spree through a boat."},{q:"Why does Berlin look different from the water?",a:"You see bridges, buildings, and sculptures from angles you never see from land",options:["It doesn't","You see bridges, buildings, and sculptures from angles you never see from land","The water is colorful","Buildings are taller from the water"],age_min:8,fun_fact:"The Molecule Men sculpture is meant to be seen from the water — it's positioned that way deliberately."}]},{id:36,n:"Mauerpark and Karaoke (Sunday Flea Market Adventure) — Prenzlauer Berg",a:"Prenzlauer Berg",v:["treasure_hunt","snack_mission"],d:25,s:"Sunday flea market with 400+ vendors plus street food, playgrounds, and the famous Bearpit Karaoke performance in an amphitheater.",st:"You arrive and there's immediate sensory overload in the best way. Vendors everywhere, people singing karaoke in a pit with an audience, kids running on lawns. It's chaotic but joyful. You can hunt for specific things (vintage toys, vinyl) or just wander. The food stalls have real street food from everywhere.",im:"Standing in an amphitheater watching a stranger absolutely nail a Beyoncé cover to a crowd of hundreds.",t:"S-Bahn S2/U-Bahn U2 to Eberswalder Straße. Open Sundays 10:00-18:00. Free to browse. Purchases are your cost (it's a flea market). Karaoke happens early afternoon, free to watch. Toilets available. Very crowded by 14:00 — better in morning. Food stands throughout — nothing is cheap but genuine.",c:["treasure_hunt","snack_mission","imagination_spots"],r:"g",age_min:5,age_max:14,budget:"cheap",pushchair:false,toilet:true,rainy:false,duration_min:120,duration_max:240,nn:"Mauerpark Flohmarkt und Karaoke — Prenzlauer Berg",ns:"Sonntagsflohmarkt mit 400+ Anbietern, Straßenessen und berühmtem Karaoke.",nst:"Du kommst an und es gibt sofort sensorische Überflutung im besten Sinne. Überall Anbieter, Menschen singen Karaoke.",nt:"S-Bahn S2/U-Bahn U2 zur Eberswalder Straße. Sonntags 10-18 Uhr. Kostenlos zum Anschauen.",quiz:[{q:"What's 'Bearpit Karaoke'?",a:"Public karaoke in an amphitheater where anyone can sing to a crowd",options:["A restaurant","Public karaoke in an amphitheater where anyone can sing to a crowd","A type of dance","A bear exhibit"],age_min:6,fun_fact:"Anyone can sign up and sing — some people are genuinely talented, some are hilariously bad, all are brave."},{q:"Why do kids like Mauerpark?",a:"Playgrounds, street food, watching people sing, hunting for treasures",options:["Because their parents force them","Playgrounds, street food, watching people sing, hunting for treasures","It's free","There are no reasons"],age_min:7,fun_fact:"Kids will spend hours hunting through vendor tables for specific toys or records — it's like a treasure hunt."}]},{id:37,n:"U-Bahn Line U6 Adventure — Mitte to Wedding",a:"Multiple",v:["navigate","treasure_hunt"],d:20,s:"The U6 is the longest continuous line and passes through changing neighborhoods — ride for exploration, not just transport.",st:"You board and travel through the city watching neighborhoods change. Mitte (museums), Friedrichstraße (grand architecture), Kreuzberg (edgy), Kreuzberg/Tempelhof transitions to trees and quieter areas. Kids notice architecture differences at different stops. It's a moving geography lesson. Get off at interesting stops.",im:"The train emerging from underground near Tempelhof to suddenly see trees and open space.",t:"Buy a day pass (€9) and travel the whole U6 or jump on and off. Takes 45 mins end-to-end. Best as an explorer mission — assign kids to notice something at each stop. Combine with getting off at Kottbusser Tor (street art), Tempelhof (outside access), Hallesches Tor (museums).",c:["treasure_hunt","navigate"],r:"g",age_min:7,age_max:14,budget:"cheap",pushchair:true,toilet:false,rainy:true,duration_min:45,duration_max:120,nn:"U-Bahn Linie U6 Abenteuer — Mitte zu Wedding",ns:"Die längste durchgehende U-Bahn-Linie — fahrt zum Erkunden, nicht nur Transport.",nst:"Du steigst ein und reist durch die Stadt, siehst Nachbarschaften, die sich verändern. Kinder bemerken Architektur-Unterschiede.",nt:"Tageskarte kaufen (€9) und die ganze U6 fahren oder an interessanten Haltestellen aussteigen.",quiz:[{q:"What do the neighborhoods along the U6 look like as they change?",a:"Historic buildings downtown, then edgy streets, then trees and parks",options:["All look the same","Historic buildings downtown, then edgy streets, then trees and parks","Only parks the whole way","Only old industrial areas"],age_min:7,fun_fact:"The changes are visible from the train itself — graffiti art in Kreuzberg, then suddenly trees near Tempelhof."},{q:"What can you see from the U6 train as it goes above ground near Tempelhof?",a:"Trees, open space, and the park landscape",options:["Nothing","Trees, open space, and the park landscape","Just buildings","Water"],age_min:8,fun_fact:"This section of the U6 goes over the old airport grounds — you can see the enormousness of the space from the train."}]},{id:38,n:"Bicycle Tour Through East Berlin (Ostkreuz Route) — Friedrichshain to Mitte",a:"Multiple",v:["treasure_hunt","navigate"],d:30,s:"Self-guided or guided bike ride from the gritty eastern areas (Friedrichshain street art) through Kreuzberg, to the museums of Mitte.",st:"You bike through streets where the city's edges are visible — graffiti, old architecture, new cafés, museums appearing as the route goes west. It's a physical journey through neighborhood change. Kids understand the city by moving through it. The route is mostly flat with good cycle paths.",im:"Riding past a massive wall of graffiti, then 10 minutes later arriving at the Altes Museum with its columns.",t:"Rent bikes from numerous shops (€10-20 pp per day). The route is roughly Friedrichshain → RAW-Gelände → Friedrichshain (street art) → Kreuzberg → Mitte (museums). Takes 2-3 hours depending on stops. Make it a mission — have kids notice changes. Food stops at street stalls.",c:["treasure_hunt","navigate"],r:"g",age_min:8,age_max:14,budget:"cheap",pushchair:false,toilet:false,rainy:false,duration_min:120,duration_max:180,nn:"Fahrrad-Tour durch Ost-Berlin — Friedrichshain zu Mitte",ns:"Selbstgeführte oder geführte Fahrradtour von grittigem Osten zum Museum Westen.",nst:"Du fährst durch Straßen, wo die Stadtkanten sichtbar sind — Graffiti, alte Architektur, neue Cafés.",nt:"Fahrräder mieten von mehreren Shops (€10-20 pro Person pro Tag).",quiz:[{q:"What's visible in the streets as you bike from East to West Berlin?",a:"Neighborhood change — from graffiti areas to museums",options:["Always the same","Neighborhood change — from graffiti areas to museums","Just parks","Just water"],age_min:9,fun_fact:"You can literally see the difference between East and West Berlin by looking at the buildings as you bike."},{q:"Why do Berliners bike instead of using cars?",a:"It's faster, cheaper, and the city is designed for bikes",options:["Biking is slower","It's faster, cheaper, and the city is designed for bikes","There are no cars","It's a trend"],age_min:8,fun_fact:"Berlin has more bike lanes than most cities — over 1000 km of them."}]},{id:39,n:"S-Bahn Ring Tour (Ringbahn) — Full Circle Journey",a:"Multiple",v:["navigate","treasure_hunt"],d:20,s:"Ride the ring of S-Bahn lines that circle Berlin — complete the ring as a mission, watch the city from train windows.",st:"You board the S-Bahn at any point on the ring. Kids understand they're traveling in a circle. The landscape changes — from central neighborhoods to outer areas to forest and then back. It's meditative. The whole ring takes about 60 minutes. Make it a mission: 'Can we complete the full ring without getting lost?'",im:"The S-Bahn emerging from a tunnel into forest, then diving back into city neighborhoods.",t:"Buy a day pass or use existing transport card. The ring is formed by S5/S7/S9 connections. Takes 45-60 mins for full circuit. Pick any station to start. Combine with getting off at interesting stops (Tempelhof, Friedrichshain, Museum Island, Charlottenburg).",c:["navigate","treasure_hunt"],r:"g",age_min:7,age_max:14,budget:"cheap",pushchair:true,toilet:false,rainy:true,duration_min:60,duration_max:120,nn:"S-Bahn Ring-Tour (Ringbahn) — Volle Kreisfahrt",ns:"Fahre den Ring von S-Bahn-Linien, die Berlin umkreisen.",nst:"Du steigst ein und verstehst, dass du einen Kreis fährst. Die Landschaft ändert sich.",nt:"Tageskarte kaufen. Der Ring wird von S5/S7/S9 gebildet. 45-60 Min. für volle Strecke.",quiz:[{q:"Why is the S-Bahn route called the 'Ring'?",a:"It forms a complete circle around Berlin",options:["It has rings on the map","It forms a complete circle around Berlin","It's shaped like a boxing ring","No reason — random name"],age_min:7,fun_fact:"The ring connects all the outer neighborhoods — it's the transport backbone of greater Berlin."},{q:"What's interesting about riding the Ring as a full journey?",a:"You return to where you started and see how neighborhoods circle the city",options:["Nothing special","You return to where you started and see how neighborhoods circle the city","It's cheaper","It takes longer than driving"],age_min:8,fun_fact:"The ring was designed in the 1880s — over 140 years ago, it's still the best way to understand Berlin's shape."}]},// ADDITIONAL ENTRIES (6 more for variety and theme coverage)
