{id:116,n:"Musée de la Vie Romantique House Museum — Montmartre",a:"Montmartre",v:["history", "beautiful", "quiet"],d:103,s:"Author\'s house museum with courtyard tea room—19th-century bohemian intimate space preserved",st:"A writer\'s home. Gardens. Tea room. It\'s intimate. Quiet. Beautiful. You\'re in someone\'s private world.",im:"It\'s 1820s. A writer lives here. Creates here. Now you visit their world.",t:"A writer\'s home. Gardens. Tea room. It\'s intimate. Quiet. Beautiful. You\'re in someone\'s private world.\",im:\"It\'s 1820s. A writer lives here. Creates here. Now you visit their world.\",t:\"€5 entry. Tuesday-Sunday 10am-6pm. Montmartre. Tea room charming. Small museum. Photography allowed. Plan 1.5 hours.",c:["history_big", "beautiful", "quiet"],r:"g",nn:"Musée de la Vie Romantique House Museum — Montmartre",ns:"Une fenêtre ouverte sur l\'âme ouvrière de Paris.",nst:"C\'est un endroit où l\'authenticité persiste. Où les locaux viennent vraiment. Où l\'histoire souffle encore. Où les traditions se mélangent avec la modernité. C\'est Paris qui vit, respire, et continue.",nt:"Prenez le temps de flâner. Observez les détails. Parlez aux habitants s\'ils sont ouverts. Respectez les espaces. Visitez sans téléphone en main. Le matin est souvent meilleur que l\'après-midi. Les fins de semaine changent l\'atmosphère. Venez avec une bouteille d\'eau et une bonne paire de chaussures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:117,n:"Père-Lachaise Cemetery Walking Tour",a:"East",v:["history","quiet","free"],d:20,s:"The famous dead buried in ornate tombs — a free historical walk among monuments",st:"Père-Lachaise contains Oscar Wilde, Jim Morrison, Balzac, and thousands of graves. It\'s a sculpture garden; locals come to research family history and reflect. Get a map.",im:"Time-travel: Opened 1804; became fashionable when the famous were buried here.",t:"Free. Métro Lines 2/6 to Père Lachaise.",c:["history_big","quiet"],r:"g",nn:"Cimetière Père-Lachaise",ns:"Tumbas ornamentadas de los famosos — caminar gratis",nst:"Camina entre las tumbas de celebridades en Père-Lachaise.",nt:"Gratis. Métro a Père Lachaise.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:118,n:"Eiffel Tower from Trocadéro at Night — Trocadéro",a:"Trocadéro",v:["beautiful"],d:45,s:"View the tower from across the river at night—no crowds, no queue, just the structure lit up against darkness",st:"Night falls. The tower becomes light. Stand at Trocadéro. Other people stand nearby but it\'s peaceful. The tower is enormous. It\'s real.",im:"It\'s 1889. Eiffel designed it for the Exposition. Now it glows. You stand in the dark looking at light.",t:"Free from Trocadéro. Visit 9pm–11pm for best lighting. Bring a jacket—it\'s exposed and windy. No entry ticket needed. Metro Line 6 to Bir-Hakeim, walk up.",c:["greatest_hits","beautiful"],r:"g",nn:"La Tour Eiffel de Trocadéro la Nuit — Trocadéro",ns:"Vue de la tour la nuit — pas de foule, juste la structure illuminée",nst:"La nuit tombe. La tour devient lumière. Vous vous tenez à Trocadéro. C\'est paisible. La tour est énorme. C\'est vrai.",nt:"Gratuit depuis Trocadéro. 21h–23h meilleur éclairage. Apportez une veste. Métro ligne 6 à Bir-Hakeim.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:119,n:"Louvre: The Clock Room Morning — 1st Arrondissement",a:"1st",v:["history","beautiful"],d:90,s:"Sunrise in the Denon Wing reveals Vermeer and Rembrandt without crowds—arrive at opening",st:"Enter at 9am. The light is perfect. Few people. You stand alone before masterpieces. The clock on the wall is silent. Time stops.",im:"It\'s 1600s. Artists paint. Now their work hangs in perfect morning light. You breathe in the same air they breathed out.",t:"€17 entry. Wednesday–Monday 9am–6pm (closed Tuesdays). Arrive 8:50am at the entrance. Métro Palais-Royal. Bring water. Plan 2 hours minimum.",c:["greatest_hits","history","beautiful"],r:"g",nn:"Louvre: La Salle des Horloges — 1er",ns:"Lumière matinale sur Vermeer et Rembrandt—pas de foules",nst:"Entrez à 9h. La lumière est parfaite. Peu de gens. Vous vous tenez seul devant les chefs-d\'œuvre. C\'est magique.",nt:"€17 entrée. Mercredi–lundi 9h–18h. Arrivez 8h50. Métro Palais-Royal.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:120,n:"Notre-Dame: The Reconstruction Viewing Area — Île de la Cité",a:"Île de la Cité",v:["history"],d:30,s:"Walk the official reconstruction viewpoint platform—see the before-and-after transformation in real time",st:"The fire was 2019. Now workers rebuild. Stand at the official barrier. You see the frame being restored. The timbers arriving. History in motion.",im:"It\'s 1163. Notre-Dame is built stone by stone. Now it\'s being rebuilt the same way. You watch time move.",t:"Free. Viewpoint at Square Jean-XXIII. Open daily 7am–10pm. Métro Cité or Île de la Cité. No entry inside yet, but the view tells the story.",c:["greatest_hits","history"],r:"g",nn:"Notre-Dame: Plateforme de Reconstruction — Île de la Cité",ns:"Voir la transformation de restauration en temps réel",nst:"Le feu était en 2019. Maintenant les ouvriers reconstruisent. Vous voyez le cadre en restauration. L\'histoire en mouvement.",nt:"Gratuit. Square Jean-XXIII. Ouvert 7h–22h. Métro Cité.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:121,n:"Sacré-Cœur at Dawn — Montmartre",a:"Montmartre",v:["beautiful","quiet"],d:60,s:"Arrive at the basilica before sunrise—watch the light break over Paris from the steps alone",st:"Dawn breaks. No one is there. The city is still asleep below you. The light moves across the rooftops. The basilica is white and waiting.",im:"It\'s 1875. The basilica is built for pilgrims. Now you\'re here at dawn. You\'re alone with the city waking.",t:"Free entry to basilica at dawn. Arrive 6am. Take Métro Line 2 to Anvers, climb the steps. Bring coffee in a thermos. The dome opens 8:30am (€3 to ascend).",c:["greatest_hits","beautiful","quiet"],r:"g",nn:"Sacré-Cœur à l\'Aube — Montmartre",ns:"Arrive avant le lever du soleil — regardez la lumière se briser sur Paris",nst:"L\'aube se lève. Personne n\'est là. La ville dort encore. La lumière se déplace sur les toits. C\'est blanc et attend.",nt:"Gratuit à l\'aube. Arrivez 6h. Métro ligne 2 Anvers. Apportez du café. Le dôme ouvre 8h30 (€3).",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:122,n:"Musée d\'Orsay: The Clock Window at 4pm — Left Bank",a:"Left Bank",v:["beautiful","history"],d:90,s:"Stand in the clock window looking out at Paris—light moves across the room at exactly 4pm",st:"The clock is part of the old train station. At 4pm the sun hits it. You stand inside the clock face looking at the city below. Time and view merge.",im:"It\'s 1900. The clock ticks. Trains arrive. Now you\'re inside the clock looking out. The city is below. Time is passing.",t:"€14 entry. Tuesday–Sunday 9:30am–6pm, Thursday until 9:45pm. Arrive 3:45pm for the light. Métro Solférino. The clock is upstairs, Musée d\'Orsay main gallery.",c:["greatest_hits","beautiful","history"],r:"g",nn:"Musée d\'Orsay: La Fenêtre de l\'Horloge — Rive Gauche",ns:"Tenez-vous dans la fenêtre de l\'horloge regardant Paris à 16h",nst:"L\'horloge est partie de l\'ancienne gare. À 16h, le soleil la frappe. Vous vous tenez dans le cadran de l\'horloge.",nt:"€14 entrée. Mardi–dimanche 9h30–18h. Arrivez 15h45. Métro Solférino.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:123,n:"Sainte-Chapelle: Morning Light Through Glass — Île de la Cité",a:"Île de la Cité",v:["beautiful","history"],d:45,s:"Enter at 9:30am when light streams through the stained glass—the chapel becomes colored air",st:"The chapel is mostly glass. At morning light, the sun hits the windows. Color floods the stone. You\'re standing in light, not looking at light.",im:"It\'s 1248. King Louis IX builds this to hold relics. Now light makes it holy.",t:"€11 entry. 9:30am–5pm daily (extended hours in summer). Métro Cité. No crowds before 10am. Bring sunglasses—the light is intense.",c:["greatest_hits","beautiful","history"],r:"g",nn:"Sainte-Chapelle: Lumière Matinale — Île de la Cité",ns:"Entrez à 9h30 quand la lumière traverse le verre teinté",nst:"La chapelle est surtout du verre. La lumière du matin frappe les vitraux. La couleur inonde la pierre.",nt:"€11 entrée. 9h30–17h. Métro Cité. Pas de foule avant 10h.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:124,n:"Luxembourg Gardens: Afternoon on a Metal Chair — 6th Arrondissement",a:"6th",v:["beautiful","free entry","quiet"],d:90,s:"Rent a metal chair and sit where Parisians sit—the gardens are for lounging, not rushing",st:"Parisians rent chairs for €1.50. They sit and read. They watch others. They\'re not there to \"do\" anything. They\'re there to sit. Join them.",im:"It\'s 1612. Marie de Medici orders the gardens. Now you sit in a green rectangle of time. Paris breathes around you.",t:"Free entry. Chair rental €1.50. Open 8am until sunset. Métro Odéon or Notre-Dame-des-Champs. Bring a book or notebook. Afternoon is best.",c:["greatest_hits","beautiful","free entry"],r:"g",nn:"Jardin du Luxembourg: Une Chaise l\'Après-midi — 6e",ns:"Loue une chaise métallique et assieds-toi où les Parisiens s\'assoient",nst:"Les Parisiens louent des chaises pour €1,50. Ils s\'assoient et lisent. Ils regardent les autres. C\'est tout.",nt:"Gratuit. Chaise €1,50. Ouvert 8h jusqu\'au coucher. Métro Odéon.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:125,n:"Panthéon: The Pendulum at Sunset — 5th Arrondissement",a:"5th",v:["history","beautiful"],d:60,s:"Climb to the dome and watch Foucault\'s pendulum swing as light fades—swinging proof of physics",st:"The pendulum swings. It\'s massive. It\'s swung since 1851. You stand above Paris watching it swing. The light changes. You feel small and connected.",im:"It\'s 1851. Foucault proves the Earth spins by watching a pendulum. Now you watch it swing in fading light. Proof made visible.",t:"€9 entry. 10am–6:30pm daily. Métro Maubert-Mutualité. Dome access included. Sunset is 5:30pm–8:30pm depending on season. Plan 90 minutes.",c:["greatest_hits","history","beautiful"],r:"g",nn:"Panthéon: Le Pendule au Coucher — 5e",ns:"Grimpe au dôme et regarde le pendule de Foucault osciller",nst:"Le pendule oscille. C\'est massif. Il oscille depuis 1851. Vous vous tenez au-dessus de Paris le regardant osciller.",nt:"€9 entrée. 10h–18h30. Métro Maubert-Mutualité. Accès au dôme inclus.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:126,n:"Père Lachaise Cemetery: Morrison\'s Grave Pilgrimage — 20th Arrondissement",a:"20th",v:["history","quiet"],d:120,s:"Find Jim Morrison\'s grave among the famous dead—or just wander and read the lives carved in stone",st:"Père Lachaise has 1 million graves. Morrison is one. But Balzac is here. Oscar Wilde. Chopin. Thousands more. It\'s a city of the dead ordered by stone and flowers.",im:"It\'s 1804. The cemetery opens as a fashionable burial ground. Now pilgrims come. Flowers are left. Candles are lit.",t:"Free entry. 8am–5:30pm (closes earlier in winter). Métro Père Lachaise. Bring a map—it\'s enormous. Plan 2–3 hours minimum.",c:["greatest_hits","history","quiet"],r:"g",nn:"Cimetière Père Lachaise: Tombeau de Morrison — 20e",ns:"Trouve la tombe de Jim Morrison parmi les morts célèbres",nst:"Père Lachaise a 1 million de tombes. Morrison en est une. Mais Balzac est ici. Oscar Wilde. Chopin. C\'est une ville des morts.",nt:"Gratuit. 8h–17h30. Métro Père Lachaise. Apportez une carte. Plan 2–3 heures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:127,n:"Les Invalides: Napoleon\'s Tomb at Silence — 7th Arrondissement",a:"7th",v:["history","beautiful"],d:90,s:"Napoleon\'s sarcophagus sits under a golden dome—the most powerful man reduced to a single stone box",st:"The tomb is alone in the dome. Light falls on it. Napoleon is here. The silence is complete. It\'s oddly small. Strangely quiet.",im:"It\'s 1840. Napoleon\'s remains return from St Helena. The dome is built to contain him. Now you stand over the box. History is marble.",t:"€12 entry. 10am–5:30pm (closed Mondays). Métro Invalides. Army Museum included. Plan 2 hours. Afternoon light is better.",c:["greatest_hits","history","beautiful"],r:"g",nn:"Les Invalides: Tombe de Napoléon — 7e",ns:"Le sarcophage de Napoléon repose sous un dôme doré",nst:"La tombe est seule dans le dôme. La lumière tombe sur elle. Napoléon est ici. Le silence est complet.",nt:"€12 entrée. 10h–17h30. Métro Invalides. Musée inclus. Plan 2 heures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:128,n:"Palais Royal Gardens: Hidden Courtyard Silence — 1st Arrondissement",a:"1st",v:["beautiful","quiet","free entry"],d:60,s:"Pass through the palace gates into an 18th-century arcade—Paris forgets this place exists",st:"The gardens are surrounded by arcades. Restaurants sit in shadow. Tourists don\'t come here. Parisians walk through at peace. It\'s protected. It\'s enclosed. It\'s beautiful.",im:"It\'s 1780. The palace is completed. Now you walk under the same arches. The light is soft. The sound is muffled.",t:"Free entry. Open 7am–10:30pm. Métro Palais-Royal. Spring and summer are best. Early morning is quieter. Benches under the arcades invite sitting.",c:["greatest_hits","beautiful","quiet","free entry"],r:"g",nn:"Palais Royal: Les Jardins Cachés — 1er",ns:"Passe par les portes du palais dans une arcade du 18e siècle",nst:"Les jardins sont entourés d\'arcades. Restaurants s\'assoient à l\'ombre. Les touristes ne viennent pas ici. C\'est protégé.",nt:"Gratuit. Ouvert 7h–22h30. Métro Palais-Royal. Printemps et été meilleur.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:129,n:"Shakespeare and Company Bookstore: Reading Nook at Closing — Left Bank",a:"Left Bank",v:["history","quiet"],d:60,s:"Stay until closing—watch staff shelve books in this legendary Left Bank bookshop founded 1919",st:"The shop closes at 10pm. At 9:45pm you\'re still there. Other customers filter out. Staff arrange books. The silence grows. You\'re in literary history.",im:"It\'s 1919. Shakespeare and Company opens. Hemingway, Fitzgerald come here. Now you sit where they sat. The books smell old. The air is thick with time.",t:"Free entry. 10am–10pm daily. Métro Saint-Michel. Books €8–40. Bring a notebook. Stay until 9:45pm to feel the closing ritual.",c:["greatest_hits","history","quiet"],r:"g",nn:"Shakespeare and Company: Nook de Lecture — Rive Gauche",ns:"Reste jusqu\'à la fermeture — regarder le personnel ranger les livres",nst:"La boutique ferme à 22h. À 21h45 vous y êtes encore. Le silence s\'accroît. Vous êtes dans l\'histoire littéraire.",nt:"Gratuit. 10h–22h. Métro Saint-Michel. Livres €8–40.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:130,n:"Pont Alexandre III at Golden Hour — 8th Arrondissement",a:"8th",v:["beautiful"],d:30,s:"Cross the most ornate bridge in Paris at sunset—light hits the gilded lamps and the river below turns gold",st:"The bridge is decorated with gilt and cherubs. At golden hour the light hits the metal. The river below glows. You\'re walking on ornament. It\'s 19th-century excess preserved.",im:"It\'s 1900. The bridge is built for the Exposition. Now light makes it glow. You cross from one bank to the other. Beauty is the only point.",t:"Free. Anytime is walkable, but 5:30pm–7:30pm is golden hour. Métro Invalides or Champs-Élysées-Clemenceau. 10 minutes to cross.",c:["greatest_hits","beautiful"],r:"g",nn:"Pont Alexandre III à l\'Heure Dorée — 8e",ns:"Traversez le pont le plus orné de Paris au coucher",nst:"Le pont est décoré de dorure et de chérubins. À l\'heure dorée la lumière frappe le métal. Le fleuve brille.",nt:"Gratuit. 17h30–19h30 meilleur. Métro Invalides. 10 minutes pour traverser.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:131,n:"Tuileries Gardens: The Wheel Bench at Dusk — 1st Arrondissement",a:"1st",v:["beautiful","quiet","free entry"],d:60,s:"Sit on a metal chair facing the ferris wheel at dusk—Paris spreads out from a former palace garden",st:"The Tuileries Palace is gone, burned in 1871. The gardens remain. At dusk the ferris wheel glows. You sit among chairs. Parisians ignore you. Life happens.",im:"It\'s 1664. Louis XIV\'s mother designs the gardens. Now they\'re public. You sit where nobility once walked. The wheel turns. Light falls.",t:"Free. Open 7am–sunset. Métro Tuileries or Concorde. Chair rental €1.50. Dusk is 5pm–7pm depending on season. Bring a friend for a bench chat.",c:["greatest_hits","beautiful","free entry"],r:"g",nn:"Jardin des Tuileries: Banc à la Roue — 1er",ns:"Assieds-toi sur une chaise face à la grande roue",nst:"Le Palais Tuileries est détruit, brûlé en 1871. Les jardins restent. À la tombée du jour la roue brille.",nt:"Gratuit. 7h–coucher. Métro Tuileries. Chaise €1,50.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:132,n:"La Butte Bergeyre Hidden Hilltop — 19th Arrondissement",a:"Belleville",v:["high_spots"],d:60,s:"Secret micro-neighborhood hilltop. Even Parisians don\'t know this exists.",st:"A cobblestone hilltop with wild gardens, small houses with vineyard references, and a complete panorama of Paris spreading below. The neighborhood is so under-the-radar that even Paris guides forget about it. You walk uphill through residential streets that feel like another country. Suddenly the city opens below you.",im:"Wildflowers growing between cobblestones, old stone houses with shuttered windows, panorama of Paris unfolding below, light golden on gardens.",t:"Metro: Line 11 to Jourdain. Walk up Rue de l\'Equerre toward Rue du Mouzaia. The hilltop neighborhood unfolds. Allow 45 min to explore. Best at golden hour. No crowds. No vendors. Just view and memory.",c:["high_spots"],r:"g",nn:"La Butte Bergeyre",ns:"La Butte Bergeyre — colline cachée de Paris.",nst:"Jardin sauvage sur les pavés. Maisons anciennes. Vue de toute Paris. Les Parisiens ne le savent pas.",nt:"Métro Jourdain. Monte à pied. Coucher de soleil dorure. Solitude.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:133,n:"Galeries Lafayette Rooftop Free Views — 9th Arrondissement",a:"Opera",v:["high_spots"],d:40,s:"Free rooftop above the grand boulevard. Opéra Garnier, Eiffel Tower, Montmartre.",st:"Walk into Galeries Lafayette, find the elevator, go to the rooftop. No ticket required. No purchase necessary. The rooftop terrace is free and open to everyone. The Opéra Garnier is right there, golden dome and all. The Eiffel Tower rises in the distance. Montmartre is behind you. The light turns golden at late afternoon. Tourists crowd the paid viewpoints. You\'re here for free.",im:"Opéra Garnier catching sunset light, the Eiffel Tower in profile, Paris spreading like a map of memory below.",t:"Free. Galeries Lafayette at Opéra. Take any elevator to top floor (9th floor), ask for rooftop. Open until sunset. Late afternoon light best. Bring coffee, stay 45 min. Photography excellent. No one checking for purchases.",c:["high_spots"],r:"g",nn:"Galeries Lafayette Terrasse",ns:"Galeries Lafayette — vue libre sur Paris.",nst:"Toit libre. Opéra d\'or. Tour Eiffel qui scintille. Montmartre derrière. Personne ne te regarde.",nt:"Libre. Ascenseur 9ème. Après-midi doré. 45 minutes de silence et d\'or.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */}
