const{useState,useEffect,useMemo}=React;const P=[
{id:1,n:"Arènes de Lutèce",a:"5th arrondissement",v:["history","free","outdoor_play"],s:"A real Roman amphitheatre sitting quietly in a Paris backstreet, used for pétanque by old men who have no interest in explaining it to you. 17,000 people once watched gladiators here. Now kids run across the sand.",st:"You find it through a narrow doorway on Rue Monge, and suddenly you're standing in a proper Roman arena. The oval of sand is intact. The tiered stone seating curves around you. It was rediscovered in 1869 when they were building a bus depot. Paris nearly lost it. Local residents fought to save it. Now it's just here, unlocked, free, with old men playing pétanque in the centre where the gladiators stood. Your kids can walk across the arena floor. They can sit in the original stone seats. Nobody tells you to leave or be quiet.",im:"Your child standing dead-centre on the arena sand, arms out, while elderly Parisians ignore them completely and focus on their pétanque.",t:"Metro line 10 Cardinal Lemoine or Jussieu. Entrance on Rue Monge or Rue de Navarre. Open daily — earlier in summer. Free entry. No toilets inside. Café des Arènes just outside.",c:["history","outdoor_play","free"],r:"g",age_min:4,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:30,duration_max:90,nn:"Arènes de Lutèce",ns:"Un vrai amphithéâtre romain caché dans une ruelle parisienne — des joueurs de pétanque ignorent royalement l'Histoire qui les entoure.",nst:"Tu entres par une porte étroite rue Monge et tu te retrouves dans une arène romaine intacte. Le sable, les gradins en pierre courbe, tout est là. Découvert en 1869 lors de la construction d'un dépôt de bus. Des habitants se sont battus pour le sauver. Aujourd'hui c'est ouvert, gratuit, et des vieux jouent à la pétanque là où les gladiateurs combattaient.",nt:"Métro ligne 10, Cardinal Lemoine ou Jussieu. Entrée rue Monge ou rue de Navarre. Ouvert tous les jours. Gratuit. Pas de toilettes à l'intérieur.",quiz:[{q:"How many people could the original Roman arena hold?",a:"17,000",options:["1,000","5,000","17,000","50,000"],age_min:7,fun_fact:"It was built in the 1st century AD — about 2,000 years ago — when Paris was called Lutetia."},{q:"What nearly destroyed this arena in 1869?",a:"Plans to build a bus depot here",options:["A fire","The French Revolution","Plans to build a bus depot here","A flood"],age_min:9,fun_fact:"Local residents petitioned so loudly that the city rerouted the bus line and preserved the arena instead."}],food:"Café des Arènes just outside the main gate. Boulangerie on Rue Monge for sandwiches.",greatest_hit:true},
{id:2,n:"Père Lachaise — the odd graves",a:"20th arrondissement",v:["history","free","stories"],s:"Paris's most famous cemetery isn't gloomy — it's a stone city of miniature houses, famous names, and Oscar Wilde's tomb covered in lipstick kisses. Maps at the entrance. It's a proper treasure hunt.",st:"You collect a map at the gate and start navigating the cobbled avenues between the stone mausoleums. These aren't flat gravestones — they're elaborate miniature buildings, some bigger than garden sheds. Jim Morrison's grave (section 6) always has flowers and photos left by strangers. Chopin's has a weeping stone woman on top. Oscar Wilde's (section 89) has an Egyptian sphinx covered entirely in lipstick kisses from visitors — they put glass panels up to protect it and people kiss those instead. The cemetery covers 44 hectares. You can get properly lost. Cats live here. It's peaceful rather than sad.",im:"An art-deco stone mausoleum with iron doors and a family name carved in letters bigger than your hand, cats sitting on the steps.",t:"Metro 2 or 3 Philippe Auguste or Père Lachaise. Free maps at the main entrance on Boulevard de Ménilmontant. Open daily 8am–6pm (longer in summer). Free entry. Toilets at the main entrance.",c:["history","stories","walking"],r:"g",age_min:6,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:true,duration_min:60,duration_max:120,nn:"Père Lachaise — les tombes insolites",ns:"Le cimetière le plus célèbre de Paris — une ville de pierre avec des noms célèbres, des chats errants, et la tombe d'Oscar Wilde couverte de baisers.",nst:"Tu prends un plan à l'entrée et tu navigues entre les mausolées en pierre. Jim Morrison, Chopin, Oscar Wilde — chacun a sa petite foule. Le sphinx d'Oscar Wilde était tellement embrassé qu'ils ont mis des vitres de protection. Les gens les embrassent quand même. 44 hectares, des chats, et des maisonnettes en pierre plus grandes que des cabanes de jardin.",nt:"Métro 2 ou 3, Philippe Auguste ou Père Lachaise. Plans gratuits à l'entrée. Ouvert tous les jours 8h–18h. Gratuit. Toilettes à l'entrée principale.",quiz:[{q:"What covers Oscar Wilde's tomb at Père Lachaise?",a:"Lipstick kisses",options:["Flowers","Lipstick kisses","Coins","Graffiti tags"],age_min:7,fun_fact:"They put glass panels to protect the stone, but people just kiss the glass instead — so now the glass is covered too."},{q:"How many hectares does the cemetery cover?",a:"44 hectares",options:["5 hectares","20 hectares","44 hectares","100 hectares"],age_min:9,fun_fact:"It has over 70,000 burial plots — more residents than many French villages."}],food:"Café at the main entrance. Rue de la Roquette has multiple options nearby.",greatest_hit:false},
{id:3,n:"Ferme de Paris — Bois de Vincennes",a:"12th arrondissement",v:["farm","free","animals"],s:"A working 5-hectare organic farm inside the Bois de Vincennes. Goats, sheep, pigs, chickens, geese. Free. You can feed them. They are not politely caged.",st:"This is not a petting zoo. It's a real farm that happens to be inside a Paris park. The animals roam proper enclosures. There are goats who will eat your sleeve if you lean on the fence. Sheep that look deeply unimpressed. Pigs wallowing. Geese who consider themselves the managers of the entire operation. The farm runs on organic principles — no pesticides, traditional breeds, crop rotation in action. Weekend afternoons and Wednesdays, the farm opens to visitors from 1:30pm. There are actual farmers here. Your kids can ask real questions. It smells correct.",im:"A Gascon pig, impressively large, watching your children with calm professional indifference from a muddy enclosure.",t:"Metro 1 Château de Vincennes + 35min walk through the Bois, or bus 112 to Ferme de Paris. Route de la Pyramide, Bois de Vincennes, 12th. Open Sat/Sun + Wed + school holidays, 1:30pm onwards. Free entry. ⚠️ Walk warning: the 35-minute path through the Bois is flat but long — not realistic for children under 5 who refuse to walk. Bus 112 (from Vincennes) shortens it significantly. Plan the return trip before you go.",c:["farm","animals","nature"],r:"g",age_min:2,age_max:10,budget:"free",pushchair:false,toilet:true,rainy:false,duration_min:60,duration_max:120,nn:"Ferme de Paris — Bois de Vincennes",ns:"Une vraie ferme bio de 5 hectares dans le Bois de Vincennes. Chèvres, moutons, cochons, poulets, oies. Gratuit. Les animaux ne sont pas dans des cages miniatures.",nst:"Ce n'est pas un zoo pour enfants sages. C'est une vraie ferme avec de vraies bêtes. Des chèvres qui mangent ta manche si tu t'appuies sur la clôture. Des cochons gascons d'une taille impressionnante. Des oies qui se prennent pour les directrices. Agriculture bio, races traditionnelles, rotation des cultures. Agriculteurs disponibles pour répondre aux questions.",nt:"Métro 1 Château de Vincennes + 35 min à pied, ou bus 112. Route de la Pyramide, Bois de Vincennes. Ouvert sam/dim + mer + vacances scolaires, à partir de 13h30. Gratuit.",quiz:[{q:"What does 'organic farming' mean at Ferme de Paris?",a:"No pesticides and traditional farming methods",options:["The farm is inside a park","No pesticides and traditional farming methods","The animals are very small","Everything is made of wood"],age_min:7,fun_fact:"The farm uses crop rotation — that means they grow different plants in each field each year to keep the soil healthy."},{q:"Which animals are known for thinking they run the place at most farms?",a:"Geese",options:["Pigs","Sheep","Geese","Horses"],age_min:5,fun_fact:"Geese are actually used as 'guard animals' on farms — they honk loudly at strangers, making them better than dogs for some farmers."}],food:"Bring a picnic — the Bois de Vincennes is perfect for it. Café at Lac Daumesnil 20min walk.",greatest_hit:true},
{id:4,n:"Jardin des Plantes + Grandes Serres",a:"5th arrondissement",v:["nature","science","free"],s:"France's national botanical garden: 4,500 plant species, a geological gallery with crystals as big as your head, and greenhouses full of tropical plants that fog up your glasses. The garden itself is free.",st:"The Jardin des Plantes has been here since 1626. You enter through iron gates and suddenly you're in a different city — wide gravel paths, formal flower beds, a central tree-lined alley that feels genuinely old. The Grandes Serres are glasshouses from the 19th century: a tropical greenhouse where the humidity hits you at the door, and a winter garden full of palms. The Gallery of Mineralogy and Geology has meteorite fragments, giant crystals, and rocks that look like they're from another planet. Admission to the gallery is separate and worth it for older kids. The garden itself is free.",im:"Condensation fogging up the glass doors of the tropical greenhouse, and the blast of warm wet air as you push through into the palm canopy.",t:"Metro 5/10 Gare d'Austerlitz or Jussieu. Free entry to the garden. Grandes Serres and Galerie de Minéralogie have separate ticket prices (€7–9). Open daily. Toilets inside.",c:["nature","science","botany"],r:"g",age_min:5,age_max:14,budget:"low",pushchair:true,toilet:true,rainy:true,duration_min:60,duration_max:150,nn:"Jardin des Plantes + Grandes Serres",ns:"Le jardin national de botanique — 4 500 espèces végétales, des serres tropicales d'époque, et une galerie de minéraux avec des cristaux plus grands que ta tête.",nst:"Le Jardin des Plantes existe depuis 1626. Large allée centrale, parterres de fleurs formels. Les Grandes Serres du XIXe : une serre tropicale où l'humidité t'assomme à l'entrée, une serre hiver avec des palmiers géants. La Galerie de Minéralogie : météorites, cristaux géants, roches qui semblent d'une autre planète.",nt:"Métro 5/10 Gare d'Austerlitz ou Jussieu. Jardin gratuit. Grandes Serres et Galerie de Minéralogie payants (7–9€). Ouvert tous les jours. Toilettes.",quiz:[{q:"What year was the Jardin des Plantes founded?",a:"1626",options:["1789","1850","1626","1900"],age_min:8,fun_fact:"It started as a royal medicinal herb garden — doctors needed plants to make medicine before pharmacies existed."},{q:"What happens to your glasses when you walk into the tropical greenhouse?",a:"They fog up completely from the humidity",options:["They stay clear","They fog up completely from the humidity","They get wet from dripping plants","Nothing"],age_min:5,fun_fact:"The greenhouse maintains tropical humidity — over 80% moisture in the air, similar to a rainforest."}],food:"Café inside the garden near the greenhouses. Rue Jussieu has boulangeries.",greatest_hit:false},
{id:5,n:"Canal Saint-Martin — the locks",a:"10th arrondissement",v:["engineering","free","walking"],s:"Nine locks, two swing bridges, a 4.6km canal, and a 2km underground vault below the Bastille. Kids get splashed when the lock gates open. Engineers have been doing this since 1825.",st:"The Canal Saint-Martin runs from the Bassin de la Villette south to the Seine — going underground at the Bastille for the last 2km. Walking the canal means watching working lock mechanisms in action: the lock keeper (éclussier) opens massive iron gates, water rushes in or out with real force, and boats rise or sink 2.5 metres. Children can stand close enough to feel the spray. The iron swing bridges rotate on their axis to let boats pass. The whole canal drops 28 metres in total across its 9 locks. This is serious engineering that still works exactly as designed in 1825.",im:"Lock gates swinging open, water rushing through the gap with genuine force, a barge rising slowly like something being lifted by invisible hands.",t:"Metro 5 Gare du Nord or République, then walk south along Quai de Valmy. Best lock for watching: Écluse des Récollets (near Rue Bichat, 10th). Lock action happens when a barge needs to pass — roughly every 30–90 minutes on busy days, less in winter. No fixed schedule. Best strategy: walk the canal, stop when you see a barge queuing, and wait — it takes about 10 minutes per lock cycle. Free. No toilets at the locks themselves — use a canal-side café.",c:["engineering","walking","canals"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:45,duration_max:120,nn:"Canal Saint-Martin — les écluses",ns:"Neuf écluses, deux ponts tournants, 4,6 km de canal et 2 km de voûte souterraine sous la Bastille. On se fait éclabousser quand les portes s'ouvrent.",nst:"Le Canal Saint-Martin descend vers la Seine — passant sous terre à la Bastille. Les écluses en action : l'éclusier ouvre les portes en fer, l'eau s'engouffre, les bateaux montent ou descendent de 2,5 mètres. Les ponts tournants pivotent pour laisser passer les péniches. 28 mètres de dénivelé total. Tout cela fonctionne exactement comme en 1825.",nt:"Métro 5 Gare du Nord ou République. Meilleure écluse : Écluse des Récollets (près de la Rue Bichat). Gratuit. Horaires des écluses variables — café pour les toilettes.",quiz:[{q:"How many metres does a boat rise or sink in one Canal Saint-Martin lock?",a:"2.5 metres",options:["50 cm","1 metre","2.5 metres","10 metres"],age_min:7,fun_fact:"The whole canal drops 28 metres from the Bassin de la Villette to the Seine — the locks are the staircase."},{q:"What happens to the canal at the Bastille?",a:"It goes underground for 2km",options:["It ends","It goes underground for 2km","It gets wider","It splits into two channels"],age_min:8,fun_fact:"You can take a boat tour through the underground section — it's lit with green lights and feels completely different."}],food:"Café des Deux Moulins or any of the many cafés along Quai de Valmy. Very good picnic street.",greatest_hit:true},
{id:6,n:"Dragon Slide — Parc de la Villette",a:"19th arrondissement",v:["playground","free","outdoor_play"],s:"A 25-metre iron dragon. You enter through its mouth. The slide is 11 metres inside its body. The park is free and enormous.",st:"Bernard Tschumi's 1987 park has a 25-metre iron dragon as a children's playground. You climb up into the body, go through the head, and slide out through the tail — or the mouth, depending on which way you come in. The dragon is made of red-painted iron, properly industrial. It's next to the Géode (the mirrored dome) and near the Cité des Sciences. The park also has the Jardin des Dunes et des Vents (wind and dune garden) and the Jardin du Dragon — the dragon playground is the centrepiece. Pack a picnic: there are grassy areas across the whole 35-hectare park.",im:"A 25-metre red iron dragon with open mouth as the slide exit, children's feet visible in the dark of the interior body.",t:"Metro 5 Porte de Pantin or Metro 7 Porte de la Villette. Parc de la Villette, free entry. Dragon playground in the Jardin du Dragon section. Toilets in the park. Open all day.",c:["playground","outdoor_play","running"],r:"g",age_min:4,age_max:12,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:60,duration_max:180,nn:"Toboggan du Dragon — Parc de la Villette",ns:"Un dragon en fer de 25 mètres. Tu entres par la gueule. Le toboggan fait 11 mètres à l'intérieur du corps. Le parc est gratuit et immense.",nst:"Le parc de Bernard Tschumi (1987) a un dragon en fer rouge de 25 mètres comme terrain de jeux. Tu grimpes dans le corps, tu passes par la tête et tu dévales par la queue — ou la gueule selon le sens. À côté de la Géode et de la Cité des Sciences. 35 hectares de pelouses pour pique-niquer.",nt:"Métro 5 Porte de Pantin ou Métro 7 Porte de la Villette. Entrée gratuite. Dragon dans le Jardin du Dragon. Toilettes dans le parc.",quiz:[{q:"How long is the dragon playground at Parc de la Villette?",a:"25 metres",options:["5 metres","10 metres","25 metres","50 metres"],age_min:5,fun_fact:"The park was designed by architect Bernard Tschumi in 1987 — he wanted play structures that looked like industrial machines."},{q:"What material is the dragon made from?",a:"Iron",options:["Plastic","Wood","Iron","Concrete"],age_min:6,fun_fact:"The park is built on the site of old slaughterhouses — the industrial iron dragon design is a nod to the area's past."}],food:"Multiple food stalls and a café in the park. Bring a picnic for the lawns.",greatest_hit:true},
{id:7,n:"Marché d'Aligre",a:"12th arrondissement",v:["market","food","local"],s:"The cheapest and loudest market in Paris, run by vendors who have been here for decades. Saturday morning. Bring cash. Nobody speaks English and nobody cares. Leave the pushchair at home — the stalls are physically impossible to navigate with a buggy.",st:"Marché d'Aligre runs Tuesday to Sunday on Place d'Aligre — an outdoor food market with stalls pressed together so tightly you have to turn sideways between them. No stroller will fit. The covered Marché Beauvau has cheese, charcuterie, spices and one vendor selling only olives. The outdoor part is cheaper than anywhere in the city: vegetables, fruit, spices, North African flatbreads, fish on ice. Saturday is the main event — by 1pm everything good is gone. The surrounding streets are flea market stalls: secondhand books, old kitchen equipment, strange objects. Your children can hunt while you shop — but you need to be able to move freely. Leave the buggy behind.",im:"A stall covered in spice pyramids — turmeric, ras el hanout, dried flowers — in an early morning light with steam from a nearby coffee cart.",t:"Metro 8 Ledru-Rollin. Place d'Aligre, 12th. Open Tue–Sun 7:30am–1:30pm. Free to enter. Cash preferred. Covered Marché Beauvau inside same space. No pushchairs — stall aisles are too narrow. Children in carriers or walking independently only.",c:["market","food","local"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:true,duration_min:45,duration_max:90,nn:"Marché d'Aligre",ns:"Le marché le moins cher et le plus bruyant de Paris — des marchands ici depuis des décennies. Samedi matin. Cash. Personne ne parle anglais et tout le monde s'en fout.",nst:"Le Marché d'Aligre, mardi au dimanche, Place d'Aligre. Étals serrés, il faut se mettre de côté pour passer. Le Marché Beauvau couvert : fromages, charcuterie, épices, un vendeur qui ne fait que des olives. Dehors : légumes, fruits, pains maghrébins, poissons. Le samedi c'est l'événement. Les rues autour : marchés aux puces, livres d'occasion, objets bizarres.",nt:"Métro 8 Ledru-Rollin. Place d'Aligre, 12e. Ouvert mar–dim 7h30–13h30. Entrée gratuite. Espèces recommandées.",quiz:[{q:"What is the Marché d'Aligre known for compared to other Paris markets?",a:"Being the cheapest in the city",options:["The most expensive cheese","Being the cheapest in the city","Only selling flowers","Being the oldest in France"],age_min:7,fun_fact:"The market has been here since 1779 — it was established before the French Revolution."},{q:"What kind of stalls surround the main food market?",a:"Flea market stalls with secondhand goods",options:["Clothing boutiques","Flea market stalls with secondhand goods","Toy shops","Bakeries"],age_min:6,fun_fact:"You can find old French cookbooks, strange kitchen gadgets, and occasionally something genuinely valuable if you look carefully."}],food:"You are literally at the market. Buy bread, cheese, olives. Le Baron Rouge wine bar nearby for parents.",greatest_hit:false},
{id:8,n:"Rue Crémieux",a:"12th arrondissement",v:["streets","free","photos"],s:"60 metres of pastel-painted houses on a cobbled pedestrian street. Yes, it's on Instagram. Yes, it's still genuinely strange that it exists. The residents are not happy about the crowds — come at 7am or don't bother.",st:"Rue Crémieux is a cobbled pedestrian street where residents have painted their houses in candy colours: pink, yellow, turquoise, mint, coral, pale blue. Instagram found it and didn't let go. Residents petitioned the city, got limited tourist hours, and the crowds came anyway. The honest advice: visit at 7am on a weekday, spend 10 minutes, leave quietly. By 8am on a Saturday it's already busy. By 9am there are people with ring lights. It is genuinely beautiful and genuinely peculiar — a candy-coloured village street between Gare de Lyon and the Seine. It's worth doing once, briefly, without disturbing the people who live there.",im:"A cobbled street of houses painted pink and yellow and turquoise and mint, completely quiet at 7am, morning light hitting the colours.",t:"Metro 14 or RER D Gare de Lyon — 5 minute walk. Rue Crémieux is a pedestrian street off Rue de Bercy. Best: 7am weekday. Acceptable: before 8am weekends. After 9am: expect crowds and people with cameras. Free. No toilets. Keep voices down — people live here and have asked visitors to respect that.",c:["streets","walking","photos"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:true,duration_min:15,duration_max:30,nn:"Rue Crémieux",ns:"La rue la plus colorée de Paris — 60 mètres de maisons pastel dans une ruelle piétonne que la plupart des guides ignorent. À deux minutes de la Gare de Lyon.",nst:"Une ruelle pavée où les habitants ont peint leurs maisons en couleurs pastels : rose, jaune, turquoise, menthe, corail, bleu ciel. 60 mètres de long. Devenue célèbre sur Instagram. Les résidents ont demandé des horaires touristiques limités. Tôt le matin pour la vraie photo. Étrangement beau entre la Gare de Lyon et la Seine.",nt:"Métro 14 ou RER D Gare de Lyon — 5 min à pied. Rue Crémieux, rue piétonne près de la Rue de Bercy. Avant 10h ou après 17h. Gratuit. Rue résidentielle — merci de rester discrets.",quiz:[{q:"How long is Rue Crémieux?",a:"About 60 metres",options:["500 metres","About 60 metres","1 kilometre","200 metres"],age_min:7,fun_fact:"It's so short that you can walk its entire length in about one minute — but you'll want to stop for photos every 3 steps."},{q:"Why did residents petition the city about tourists?",a:"To limit visiting hours to protect their privacy",options:["To charge for entry","To limit visiting hours to protect their privacy","To ban photos","To close the street permanently"],age_min:8,fun_fact:"People actually live in these colourful houses — they deal with tourists taking photos outside their windows every single day."}],food:"Café Le Bercy nearby. Boulangeries on Rue de Bercy. Gare de Lyon has a brasserie.",greatest_hit:false},
{id:9,n:"Terrain d'aventures — Jardin Nelson Mandela",a:"1st arrondissement",v:["playground","design","free"],s:"An alien pod adventure playground designed by Henri Marquet for the Les Halles area — space-age, weird, exactly at the level children want. Described as 'Wizard of Oz meets Mario Bros'.",st:"When Les Halles was redesigned in 2016, the city commissioned a children's adventure ground that was genuinely designed — not assembled from catalogue parts. Henri Marquet's structure rises in organic curves: tubular tunnels connect pod-like climbing structures in shades of green and orange, with rope bridges and enclosed slides. Children disappear into it within seconds. There is no obvious correct way through. The design means you can watch your child navigate the structure from multiple angles — it's not a flat frame. It's next to the Canopée shopping centre but feels entirely separate from it.",im:"Organic green tubular structures rising in curves, children's silhouettes visible inside translucent tube sections, like creatures inside a pod.",t:"Metro 4 Les Halles or RER A/B/D Châtelet–Les Halles. Jardin Nelson Mandela, 1st arrondissement. Free. Open daily during park hours. Toilets in the park.",c:["playground","design","outdoor_play"],r:"g",age_min:3,age_max:11,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:45,duration_max:120,nn:"Terrain d'aventures — Jardin Nelson Mandela",ns:"Un terrain de jeux en forme de pod alien conçu par Henri Marquet pour les Halles — futuriste, bizarre, exactement au niveau d'un enfant.",nst:"Lors de la rénovation des Halles en 2016, la ville a commandé un terrain de jeux vraiment designé. La structure d'Henri Marquet monte en courbes organiques : tunnels tubulaires, pods d'escalade verts et orange, ponts de corde, toboggans fermés. Les enfants s'y perdent en quelques secondes. Pas de parcours évident. Décrit comme 'Le Magicien d'Oz rencontre Mario Bros'.",nt:"Métro 4 Les Halles ou RER Châtelet–Les Halles. Jardin Nelson Mandela, 1er arr. Gratuit. Ouvert pendant les heures du parc. Toilettes dans le jardin.",quiz:[{q:"What unusual shapes make up the adventure playground structure?",a:"Organic pods and curved tubes",options:["Straight metal bars","Organic pods and curved tubes","Traditional climbing frames","Giant animal shapes"],age_min:6,fun_fact:"The designer Henri Marquet wanted children to not know the 'correct' way through the structure — so they have to figure it out themselves."},{q:"What year was the Les Halles garden redesigned?",a:"2016",options:["1990","2000","2016","2022"],age_min:8,fun_fact:"Les Halles used to be Paris's main food market — the biggest in Europe — before it was demolished and rebuilt underground."}],food:"Canopée food court nearby (underground). Better: picnic in the Jardin Nelson Mandela itself.",greatest_hit:false},
{id:10,n:"Buttes-Chaumont — hidden waterfall grotto",a:"19th arrondissement",v:["nature","free","adventure"],s:"Paris's strangest park: a fake cliff, a fake Roman temple on an artificial island, a Gustave Eiffel suspension bridge 8 metres above the lake, and a hidden waterfall grotto with 20-metre rock walls. Nobody finds the grotto without looking for it.",st:"Parc des Buttes-Chaumont was built by Baron Haussmann on an abandoned quarry and former refuse dump. He imported Gustave Eiffel to build the suspension bridge. The island in the lake has a 30-metre cliff with a real Roman temple replica on top. The lake is crossed by two bridges — one of them proper Eiffel engineering, swaying faintly if you jump. The grotto is the secret: follow the path east and down along the lake's north side to find a cave with stalactites and a 20-metre waterfall inside. Children who find it feel genuinely like explorers.",im:"Inside the cave grotto: stalactites hanging from a 20-metre ceiling, water falling, the lake visible through the entrance, cool air coming up from the water.",t:"Metro 7bis Buttes-Chaumont. Free. Open daily from 7am. Grotto on the north side of the lake, east of the main island — follow signs for Grotte. Toilets near main entrance. Bring water — the park is hilly.",c:["nature","adventure","walking"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:false,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Buttes-Chaumont — la grotte aux cascades",ns:"Le parc le plus étrange de Paris : une fausse falaise, un temple romain sur île artificielle, un pont suspendu de Gustave Eiffel, et une grotte cachée avec des stalactites et une cascade de 20 mètres.",nst:"Construit par Haussmann sur une ancienne carrière et décharge. Eiffel pour le pont suspendu. L'île a une falaise de 30 mètres avec un vrai temple romain en réplique. Le pont se balance légèrement si tu sautes. La grotte : côté nord du lac, à l'est de l'île principale. Stalactites, cascade de 20 mètres, air frais. Les enfants qui la trouvent se sentent vraiment explorateurs.",nt:"Métro 7bis Buttes-Chaumont. Gratuit. Ouvert dès 7h. Grotte côté nord du lac — suivre panneaux Grotte. Toilettes à l'entrée principale. Parc vallonné : prévoir de l'eau.",quiz:[{q:"Who built the suspension bridge in Parc des Buttes-Chaumont?",a:"Gustave Eiffel",options:["Baron Haussmann","Gustave Eiffel","Napoleon III","An unknown engineer"],age_min:7,fun_fact:"Eiffel built this bridge before the Eiffel Tower — it was one of his early Paris commissions."},{q:"What is unusual about the island in Buttes-Chaumont?",a:"It's artificial — built on a former quarry",options:["It has a real forest","It's artificial — built on a former quarry","It can only be reached by boat","It moves with the tides"],age_min:8,fun_fact:"The cliff you see is fake — it's built from concrete over the quarry walls, designed to look like a natural rocky outcrop."}],food:"Café inside the park near the boating lake. Guinguette sometimes open in summer.",greatest_hit:true},
{id:11,n:"Ferme René-Binet — 18th arrondissement",a:"18th arrondissement",v:["farm","free","urban"],s:"A hidden urban farm inside Square Binet in the northern 18th — one of the least-visited squares in Paris, with chickens, a community vegetable garden, and beehives on the roof of the garden shed.",st:"Square Binet is not in any guidebook. It's in the far north of the 18th arrondissement, a residential neighbourhood where almost nobody speaks anything but French. The square has a children's playground, but also a genuine small farm: chickens free-ranging in an enclosed area, community vegetable beds, and a garden shed with beehives on the roof. The beehive project is run by the city — Paris has had an urban beekeeping programme since 2004 and produces honey sold at the Hôtel de Ville. Come on a weekday morning when local families are here and the neighbourhood feels completely different from central Paris.",im:"Chickens strutting under a vegetable garden trellis, with a city apartment block rising immediately behind them, a beekeeper's white box visible on a shed roof.",t:"Metro 13 Garibaldi or Porte de Saint-Ouen. Square René-Binet, 18th arrondissement. Free. Usually open during park hours. Very local neighbourhood — no tourist infrastructure.",c:["farm","urban","nature"],r:"g",age_min:3,age_max:10,budget:"free",pushchair:true,toilet:false,rainy:false,duration_min:30,duration_max:60,nn:"Ferme René-Binet — 18e arrondissement",ns:"Une ferme urbaine cachée dans le Square Binet, dans le nord du 18e — un des squares les moins touristiques de Paris, avec poulets, jardin communautaire et ruches.",nst:"Le Square Binet n'est dans aucun guide. Loin au nord du 18e, quartier résidentiel où presque personne ne parle anglais. Un vrai mini-élevage : poulets en liberté surveillée, jardins potagers communautaires, ruches sur le toit du hangar. Le projet de ruches est municipal — Paris a un programme d'apiculture urbaine depuis 2004.",nt:"Métro 13 Garibaldi ou Porte de Saint-Ouen. Square René-Binet, 18e arr. Gratuit. Heures du parc. Quartier local sans infrastructure touristique.",quiz:[{q:"What is on the roof of the garden shed at Ferme René-Binet?",a:"Beehives",options:["Solar panels","Beehives","A weather station","Pigeons"],age_min:5,fun_fact:"Paris has had an urban beekeeping programme since 2004 — there are beehives on the roof of the Paris Opera House too."},{q:"What do the Paris city beekeepers do with the honey they collect?",a:"Sell it at the Hôtel de Ville",options:["Give it away for free","Sell it at the Hôtel de Ville","Only keep it for research","Export it to other countries"],age_min:8,fun_fact:"Urban honey can actually be purer than rural honey — city bees have less exposure to agricultural pesticides."}],food:"Bring your own. Marché de la Porte de Saint-Ouen nearby for provisions.",greatest_hit:false},
{id:13,n:"Cité des Sciences et de l'Industrie",a:"19th arrondissement — La Villette",v:["science","indoors","rainy_day"],s:"Europe's largest science museum — and the Paris kids app's most embarrassing omission until now. Permanent exhibitions, a planetarium, a real submarine moored outside, and a dedicated under-12 zone called the Cité des Enfants. Half a day minimum.",st:"The Cité des Sciences sits at the northern end of Parc de la Villette, in a building by Adrien Fainsilber that is itself worth seeing: a glass cube reflected in a moat, with geodes on the roof. Inside: 30,000 square metres of permanent exhibitions covering mathematics, life sciences, light and matter, the universe, and technology. The Géode (a mirrored sphere next door) has an IMAX-format hemispheric cinema. The Argonaute is a real decommissioned French Navy submarine moored in the canal — you tour the actual interior. The Cité des Enfants is split into two sections: one for ages 2–7 and one for ages 5–12. The younger zone has water channels, sound experiments, a construction site, and a media studio. The older zone has biology, engineering, a body science section, and a mathematics playground. It gets busy at weekends — arrive at opening.",im:"A child lying on their back inside a giant soap bubble they've just inflated from a wire ring, watching the colours shift before it pops.",t:"Metro 7 Porte de la Villette. Cité des Sciences, 30 Avenue Corentin Cariou, 19th. Cité des Enfants: €12 per person (children same price). Permanent exhibitions: adults €13, children under 6 free. Argonaute submarine: €3 extra. Géode: separate ticket €15. Open Tue–Sat 10am–6pm, Sun 10am–7pm. Closed Mon. Book Cité des Enfants time slots online — they sell out on weekends. Toilets throughout.",c:["discover","science"],r:"g",age_min:2,age_max:14,budget:"low",pushchair:true,toilet:true,rainy:true,duration_min:120,duration_max:360,nn:"Cité des Sciences et de l'Industrie",ns:"Le plus grand musée des sciences d'Europe — et l'oubli le plus embarrassant de cette appli jusqu'à présent. Expositions permanentes, planétarium, un vrai sous-marin amarré dehors, et une zone dédiée aux moins de 12 ans : la Cité des Enfants.",nst:"La Cité des Sciences est au nord du Parc de la Villette. 30 000 m² d'expositions permanentes. Le Géode : cinéma hémisphérique IMAX. L'Argonaute : vrai sous-marin de la Marine française à visiter de l'intérieur. La Cité des Enfants : deux sections, 2–7 ans et 5–12 ans. La zone jeunes a des canaux d'eau, des expériences sonores, un chantier, un studio média. La zone ados : biologie, ingénierie, corps humain, mathématiques. Réservez les créneaux de la Cité des Enfants en ligne.",nt:"Métro 7 Porte de la Villette. 30 avenue Corentin Cariou, 19e. Cité des Enfants : 12€/pers. Expositions permanentes : adultes 13€, enfants -6 ans gratuits. Argonaute : +3€. Géode : 15€ séparé. Mar–sam 10h–18h, dim 10h–19h. Fermé lun. Réserver les créneaux Cité des Enfants en ligne.",quiz:[{q:"What can you tour at the Cité des Sciences that is moored in the canal outside?",a:"A real decommissioned French Navy submarine (the Argonaute)",options:["A Viking longship","A real decommissioned French Navy submarine (the Argonaute)","A replica of Jacques Cousteau's research vessel","A canal barge turned into a classroom"],age_min:7,fun_fact:"The Argonaute was launched in 1957 and decommissioned in 1982. It could dive to 200 metres and carried 40 crew members in a space smaller than a tennis court."},{q:"What shape is the Géode building next to the Cité des Sciences?",a:"A perfect mirrored sphere",options:["A cube","A pyramid","A perfect mirrored sphere","A dome like the Panthéon"],age_min:6,fun_fact:"The Géode's surface is made of 6,433 triangular stainless steel panels. It reflects the sky, the water, and everyone walking past — so your selfie in the reflection is technically inside a science museum."}],food:"Restaurant and café inside the museum. Parc de la Villette lawns for picnics in good weather. Dragon slide playground 10 minutes' walk.",greatest_hit:true},
{id:12,n:"Paris Plages — the Seine becomes a beach",a:"Hôtel de Ville, 4th arrondissement",v:["summer","free","water"],s:"Every summer since 2002, the city closes the Seine expressway and dumps 3,000 tonnes of sand. There are deckchairs, water play areas, and outdoor pools. It costs nothing. It feels like the city gave itself a gift.",st:"Paris Plages runs from mid-July to mid-August along the right bank of the Seine between Pont de Sully and Pont de l'Alma — about 4km of riverside that normally carries traffic. The sand comes in by the truckload. There are water misters, outdoor paddling pools, games, concerts, and actual deckchairs you can use for free. The Bassin de la Villette (19th) gets a floating pool with swim lanes. Children can run on the sand with the Seine and Notre-Dame as backdrop. The idea that this exists — that a major capital city shuts a motorway and builds a beach for its citizens — still feels slightly impossible.",im:"Sand and deckchairs along the river bank, Notre-Dame visible downstream, children running through water misters in the afternoon heat.",t:"Metro 7 Pont Marie or Hôtel de Ville (4th). Along the right bank between Pont de Sully and Pont de l'Alma. Mid-July to mid-August only. Free. Toilets on site. Lifeguards at designated swimming zones.",c:["summer","water_play","free"],r:"g",age_min:1,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:60,duration_max:180,nn:"Paris Plages — la Seine devient une plage",ns:"Chaque été depuis 2002, la ville ferme les voies sur berge et déverse 3 000 tonnes de sable. Transats gratuits, jeux d'eau, piscines flottantes. Ça ne coûte rien. C'est comme si la ville s'offrait un cadeau.",nst:"Paris Plages de mi-juillet à mi-août — rive droite entre Pont de Sully et Pont de l'Alma. Le sable arrive par camions. Brumisateurs, pataugeoires, jeux, concerts, transats gratuits. La Villette a une piscine flottante avec couloirs. Fermer une autoroute pour créer une plage gratuite : ça semble impossible et pourtant ça arrive chaque année.",nt:"Métro 7 Pont Marie ou Hôtel de Ville. Rive droite entre Pont de Sully et Pont de l'Alma. Mi-juillet à mi-août uniquement. Gratuit. Toilettes sur place. Maîtres-nageurs aux zones de baignade.",quiz:[{q:"How many tonnes of sand does Paris bring in for Paris Plages each year?",a:"3,000 tonnes",options:["500 tonnes","3,000 tonnes","10,000 tonnes","100 tonnes"],age_min:7,fun_fact:"The sand has to be brought back in at the end of August and stored until the following summer."},{q:"What year did Paris Plages start?",a:"2002",options:["1990","2002","2010","2015"],age_min:8,fun_fact:"It was an idea by the Mayor of Paris at the time, Bertrand Delanoë — people thought it was impossible and silly, until they tried it."}],food:"Food stalls along the beach. Bring a picnic. This is Paris — there's always a boulangerie nearby.",greatest_hit:true,stay:"Summer only (mid-July to mid-August)",stay_verify:"Check paris.fr each year for exact dates"},

{id:14,n:"Belleville Murals and Street Art — Belleville",a:"Belleville",v:["street_art", "local_only"],d:1,s:"Entire neighborhood is moving mural — immigrant communities paint identity on brick",st:"Walk and stare upward. Color explodes on walls. Arabic, Chinese, French. Every language. Every culture. The neighborhood paints itself. It\'s alive. It\'s real. It\'s political.",im:"It\'s 2000. Artists come. They claim walls. Communities follow. Color happens. Gentrification arrives anyway. But the murals remain as witness.",t:"Walk and stare upward. Color explodes on walls. Arabic, Chinese, French. Every language. Every culture. The neighborhood paints itself. It\'s alive. It\'s real. It\'s political.\",im:\"It\'s 2000. Artists come. They claim walls. Communities follow. Color happens. Gentrification arrives anyway. But the murals remain as witness.\",t:\"Free walk. Rue Denoyez best for murals. Start early morning. Weekends busier. Small cafés for coffee and croissants. Street food vendors afternoons. Respectful photography appreciated.",c:["street_art", "local_only"],r:"g",nn:"Belleville Murals and Street Art — Belleville",ns:"Un quartier qui crie ses couleurs sur le béton et l\'histoire.",nst:"Levez les yeux. Les couleurs explosent partout — arabe, chinois, français. Chaque langue. Chaque culture. Le quartier se peint lui-même. C\'est vivant. C\'est vrai. C\'est politique. Les artistes revendiquent les murs depuis les années 2000. Les communautés suivent. Malgré la gentrification, les fresques restent comme témoins du passé.",nt:"Prenez le temps de flâner. Observez les détails. Parlez aux habitants s\'ils sont ouverts. Respectez les espaces. Visitez sans téléphone en main. Le matin est souvent meilleur que l\'après-midi. Les fins de semaine changent l\'atmosphère. Venez avec une bouteille d\'eau et une bonne paire de chaussures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — a {id:38,n:"Parc de Bercy Gardens — Bercy",a:"Bercy",v:["beautiful", "nature", "quiet"],d:102,s:"Contemporary park with multiple gardens—Asian garden, rose garden, secret groves—urban oasis",st:"Wander through themed gardens. Asian plants. Roses. Bamboo. Water features. Each section different. Quiet beauty.",im:"It\'s 1990s. Former industrial site becomes a park. Nature reclaims urban space.",t:"Wander through themed gardens. Asian plants. Roses. Bamboo. Water features. Each section different. Quiet beauty.\",im:\"It\'s 1990s. Former industrial site becomes a park. Nature reclaims urban space.\",t:\"Free. Open daily. Bercy. East Paris. Peaceful. Photography beautiful. Benches abundant. Plan 2 hours.",c:["beautiful", "nature", "quiet"],r:"g",nn:"Parc de Bercy Gardens — Bercy",ns:"Un lieu authentique où les Parisiens se retrouvent.",nst:"C\'est un endroit où l\'authenticité persiste. Où les locaux viennent vraiment. Où l\'histoire souffle encore. Où les traditions se mélangent avec la modernité. C\'est Paris qui vit, respire, et continue.",nt:"Prenez le temps de flâner. Observez les détails. Parlez aux habitants s\'ils sont ouverts. Respectez les espaces. Visitez sans téléphone en main. Le matin est souvent meilleur que l\'après-midi. Les fins de semaine changent l\'atmosphère. Venez avec une bouteille d\'eau et une bonne paire de chaussures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:39,n:"Cité Florale Hidden Flower Streets — Chatelet-Les Halles",a:"Chatelet",v:["hidden", "beautiful", "quiet"],d:104,s:"Secret residential streets with lush gardens hidden in Central Paris—neighbors don\'t know about them",st:"Streets few find. Houses with gardens. Flowers everywhere. It\'s residential peace. It\'s hidden Paris.",im:"It\'s 1900. Houses built in quiet streets. Now they\'re forgotten.",t:"Streets few find. Houses with gardens. Flowers everywhere. It\'s residential peace. It\'s hidden Paris.\",im:\"It\'s 1900. Houses built in quiet streets. Now they\'re forgotten.\",t:\"Free. Open but private. Respect quiet. Photography gentle. Central Paris. Off the map.",c:["hidden", "beautiful", "quiet"],r:"g",nn:"Cité Florale Hidden Flower Streets — Chatelet-Les Halles",ns:"Un lieu authentique où les Parisiens se retrouvent.",nst:"C\'est un endroit où l\'authenticité persiste. Où les locaux viennent vraiment. Où l\'histoire souffle encore. Où les traditions se mélangent avec la modernité. C\'est Paris qui vit, respire, et continue.",nt:"Prenez le temps de flâner. Observez les détails. Parlez aux habitants s\'ils sont ouverts. Respectez les espaces. Visitez sans téléphone en main. Le matin est souvent meilleur que l\'après-midi. Les fins de semaine changent l\'atmosphère. Venez avec une bouteille d\'eau et une bonne paire de chaussures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:40,n:"La Recyclerie Urban Farm — Stalingrad",a:"Stalingrad",v:["local", "nature", "weird"],d:105,s:"Former railway station turned urban farm and restaurant—vegetables grow where trains once ran",st:"Abandoned station becomes farm. Vegetables in beds. Restaurant above. It\'s beautiful reuse. Community. Sustainability.",im:"It\'s 1850. Trains arrive. Now plants grow on the tracks.",t:"Abandoned station becomes farm. Vegetables in beds. Restaurant above. It\'s beautiful reuse. Community. Sustainability.\",im:\"It\'s 1850. Trains arrive. Now plants grow on the tracks.\",t:\"Free entry. Café/restaurant pricing. Open daily. North Paris. Food from the farm. Photography beautiful. Community vibe.",c:["local_only", "nature", "weird"],r:"g",nn:"La Recyclerie Urban Farm — Stalingrad",ns:"Un lieu authentique où les Parisiens se retrouvent.",nst:"C\'est un endroit où l\'authenticité persiste. Où les locaux viennent vraiment. Où l\'histoire souffle encore. Où les traditions se mélangent avec la modernité. C\'est Paris qui vit, respire, et continue.",nt:"Prenez le temps de flâner. Observez les détails. Parlez aux habitants s\'ils sont ouverts. Respectez les espaces. Visitez sans téléphone en main. Le matin est souvent meilleur que l\'après-midi. Les fins de semaine changent l\'atmosphère. Venez avec une bouteille d\'eau et une bonne paire de chaussures.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:41,n:"Belleville Street Art District",a:"Northeast",v:["art","free","local"],d:15,s:"Raw neighborhood murals constantly evolving — Paris\' real street art scene",st:"Belleville is the anti-Champs-Élysées. Rue Denoyez and alleys are covered in constantly evolving murals. It\'s raw, political, and authentic. Grab a crêpe and wander.",im:"Time-travel: Belleville was poor Jewish/Italian; street art is gentrifying it.",t:"Free. Métro Line 11 to Belleville.",c:["street_art","local_only"],r:"g",nn:"Belleville Street Art",ns:"Murales dinámicas en constante evolución",nst:"Camina Rue Denoyez viendo arte callejero fresco.",nt:"Gratis. Métro a Belleville.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:42,n:"Giverny — Monet's Garden Where Impressionism Happened Outdoors",a:"Vernon (day trip)",v:["nerd","free_culture"],d:120,s:"Monet's garden and water lily pond 75 minutes by train. The actual place where Impressionism happened outdoors. Go May-June in morning light.",st:"Monet lived in this house for 43 years. He gardened obsessively. The water lilies in the pond became an obsession—he painted them 250 times in different lights. Walking the garden now, you understand his obsession. The water changes color by the hour. The light on the Japanese bridge changes the entire composition. This garden IS the paintings.",im:"Standing on the Japanese bridge looking at water lilies floating, willows hanging over the water, the exact light that's in a Monet painting.",t:"Vernon, 75 min from Paris by train (€20 return). Giverny Museum €11 entry. Open 10am-6pm (April-October only). Go mornings (10-11am) for best light and fewer crowds. May and June are peak blooming. Book morning slot online. Allow 2-3 hours. Bring a sketchbook.",c:["nerd","free_culture"],r:"g",nn:"Giverny — Jardin de Monet Oú L'Impressionnisme S'est Passé",ns:"Le jardin de Monet et l'étang des nénuphars 75 minutes en train",nst:"Monet a vécu dans cette maison pendant 43 ans. Il a jardiné obsessionnellement. Les nénuphars de l'étang sont devenus une obsession.",nt:"Vernon, 75 min de Paris en train. Musée Giverny €11. Matin pour meilleure lumière.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:43,n:"Atelier Brancusi — Sculptor's Studio Outside Centre Pompidou",a:"Beaubourg",v:["nerd","free_culture"],d:45,s:"Reconstructed studio of Constantin Brancusi with his actual tools, sculptures, works-in-progress. Free. Almost nobody goes in.",st:"Brancusi's studio is a small space filled with massive sculptures, rough marble, tools worn smooth by decades of use. He lived and worked here for 30 years. Everything is exactly as he left it—works in progress on tables, chisels and rasps on shelves, the smell of stone dust still in the air. This is not a museum. This is a working space that happens to be preserved.",im:"Looking at a half-finished marble sculpture, tools scattered nearby, morning light through high windows, the physical evidence of artistic process.",t:"Outside Centre Pompidou, Place Igor Stravinsky (easy to miss—ask guards). Free entry. Open weekday afternoons only (2-6pm, closed Sundays). Photography not allowed inside. Allow 30-45 minutes. The space is small but profound. This is where simplicity and material met.",c:["nerd","free_culture"],r:"g",nn:"L'Atelier Brancusi — Studio du Sculpteur Dehors Pompidou",ns:"Studio reconstruit de Constantin Brancusi avec ses vrais outils, sculptures",nst:"Le studio de Brancusi est un petit espace rempli de sculptures massives, de marbre brut, d'outils polis par des décennies d'utilisation.",nt:"Dehors Centre Pompidou, Place Igor Stravinsky. Entrée gratuite. Après-midi la semaine (14-18h).",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:44, n:"Bois de Boulogne — The Deep Interior", a:"Boulogne-Billancourt", v:["nature","quiet","local","beautiful"], d:150,
s:"The 2,000-hectare forest at Paris\'s edge where pre-dawn joggers disappear into paths nobody photographs, past Bagatelle gardens into genuine wilderness.",
st:"Everyone sees the edges — the Parisian cyclists, the tourist boats on the lake. But the Bois has a deep interior that feels like a different world. Start at Bagatelle gardens early (it\'s quiet at 7am), then leave the garden paths and follow the forest trails deeper in toward the Pré Catelan lake. The paths thin out. You\'ll see old moss-covered walls from demolished estates, Victorian follies half-consumed by ivy, joggers in headlamps moving like ghosts.\n\nThe interior paths loop around artificial lakes where swans drift in mist. You\'re still technically in Paris but the city sound vanishes completely. Go after rain when the forest smells like humus and the light is strange through the wet canopy. Bring a map — the paths are unmarked and loop back on themselves deliberately.",
im:"Wet moss under your feet, the smell of earth and decaying leaves, mist hanging in the trees, a jogger passing silently in the half-light, the sound of water but no visible city.",
t:"Best 6-30am or late afternoon. Metro to Michel-Ange-Molitor or Boulogne-Jean Jaurès, then walk to Bagatelle entrance (Pont de Suresnes). Bagatelle gardens 1.50 EUR entrance. Allow 2-3 hours for full walk. Bring good boots for muddy sections. Paths close at dusk.",
c:["day_trips","nature"], r:"g",
nn:"Bois de Boulogne — L\'Intérieur Profond", ns:"La forêt parisienne où disparaissent les joggers de l\'aube, loin des touristes, dans un silence de feuilles.",
nst:"Tout le monde voit les bords — les cyclistes parisiens, les bateaux touristiques. Mais le Bois a un intérieur profond qui ressemble à un monde différent. Commencez par les jardins de Bagatelle de bonne heure (7h, c\'est tranquille), puis quittez les sentiers et pénétrez plus loin vers le lac Pré Catelan. Les sentiers s\'affinent. Vous verrez les vieux murs couverts de mousse, les jardins délabrés, les cygnes qui dérivent dans le brouillard.\n\nAllez après la pluie quand la forêt sent l\'humus. Apportez une carte — les sentiers ne sont pas balisés.",
nt:"Mieux 6h30-9h ou fin d\'après-midi. Métro Michel-Ange-Molitor. Jardins de Bagatelle 1,50 EUR. Permettez 2-3 heures. Bonnes bottes. Sentiers ferment au crépuscule.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:45, n:"Forêt de Meudon — 1,100 Hectares Above the City", a:"Meudon", v:["nature","forest","quiet","views"], d:120,
s:"The forgotten forest 20 minutes south by RER, where an old observatory sits abandoned at the top and you can walk for hours without hearing Paris.",
st:"Meudon is massive — 1,100 hectares of actual forest that nobody international knows about. Take RER line D to Meudon-Val-Fleury, then walk up through beech and oak woods to the Observatory plateau at 150 meters height. The old astronomical observatory is there, gates locked, but you can walk around it. The views from the plateau stretch across Paris and you\'ll see maybe three other people.\n\nThe trails are well-marked but feel abandoned. There\'s a strange melancholy here — a forest that wants to be wild but exists next to a city. In autumn, the ground is thick with beech mast and the light turns amber through the canopy. In spring, wild garlic covers the forest floor. Walk down through the Hauts de Meudon village after and you\'ll feel like you\'ve emerged from another century.",
im:"The smell of rain on oak leaves, the sound of your boots on a forest path with zero other people, the light changing as clouds move over the plateau, Paris visible but distant and unreal.",
t:"RER D to Meudon-Val-Fleury (20 min from central Paris, 2.65 EUR). Walk 30 min uphill through forest to Observatory. Several marked trails (2-3 hours). Best in early morning or late afternoon in spring and autumn. Bring water — no facilities on forest. Accessible year-round but muddy after rain.",
c:["day_trips","nature"], r:"g",
nn:"Forêt de Meudon", ns:"1 100 hectares de forêt où l\'observatoire regarde depuis 150 mètres.",
nst:"Meudon est énorme — 1 100 hectares de vraie forêt que personne ne connaît. Prenez le RER D jusqu\'à Meudon-Val-Fleury, puis montez à pied à travers les bois de hêtres et de chênes jusqu\'au plateau de l\'Observatoire. Les vues s\'étendent sur Paris. Vous verrez peut-être trois autres personnes. En automne, le sol est épais de faines. En printemps, l\'ail sauvage couvre le sol.",
nt:"RER D à Meudon-Val-Fleury (20 min du centre, 2,65 EUR). Marche 30 min en montée. Plusieurs sentiers balisés (2-3 heures). Mieux au printemps et automne. Apportez de l\'eau.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:46, n:"Forêt de Saint-Germain-en-Laye — The Royal Hunt", a:"Saint-Germain-en-Laye", v:["nature","forest","history","views"], d:180,
s:"The 3,500-hectare royal hunting forest accessible by RER A, where the Grand Terrace overlooks the Seine valley and paths disappear into genuine deep forest.",
st:"This is where French kings hunted. The forest is still arranged like it was in the 17th century — grand alleyways cut through dense woodland for hunting parties on horseback. Now it\'s peaceful and immense. Take RER A to Saint-Germain-en-Laye, then walk through the town to the château entrance, which connects to the forest.\n\nThe Grand Terrace is the famous part — a 2.4-kilometer-long raised walkway with views out over the Seine valley toward distant Paris. But keep walking past the terrace into the forest interior where the alleyways become narrower, the canopy thickens, and you\'re genuinely lost in what feels like wilderness. The Carrefour Royal — where hunting paths intersect — is a pilgrimage site for walkers. There\'s an old hunting lodge (now a café, but closed often) at the heart of the forest. Paths loop for 3-5 hours depending on how deep you want to go.",
im:"The smell of damp earth and beech leaves, the width of ancient royal hunting paths, light filtered through an old-growth oak canopy, silence except for songbirds and your footsteps, the Seine valley spread below when you reach open sky.",
t:"RER A to Saint-Germain-en-Laye (40 min from central Paris, 2.55 EUR). Walk 15 min from station to château/forest entrance (signposted). Grand Terrace walk is 2.4km flat and easy. Forest trails 3-5 hours depending on pace and depth. Best in spring (wildflowers) and autumn (color). Bring a map — trails are marked but confusing. Café near château but unreliable hours.",
c:["day_trips","history_big","nature"], r:"g",
nn:"Forêt de Saint-Germain-en-Laye", ns:"3 500 hectares de forêt de chasse royale — les sentiers royaux existent encore.",
nst:"C\'est ici que les rois de France chassaient. La forêt est toujours arrangée comme elle l\'était au 17ème siècle — grandes allées percées à travers les bois denses. Maintenant c\'est paisible et immense. Prenez le RER A jusqu\'à Saint-Germain-en-Laye. La Grande Terrasse est la partie célèbre — 2,4 kilomètres de promenade surélevée avec des vues sur la vallée de la Seine.\n\nMais continuez à marcher dans l\'intérieur de la forêt où le couvert devient plus épais et vous êtes vraiment perdu. Les allées s\'affinent, le silence est vrai. Il y a un carrefour royal où les sentiers de chasse s\'intersectent.",
nt:"RER A à Saint-Germain-en-Laye (40 min, 2,55 EUR). Marche 15 min depuis la gare. Terrasse 2,4 km plat. Sentiers 3-5 heures. Mieux au printemps et automne. Apportez une carte.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:47, n:"Canal de l\'Ourcq — The 26km Escape", a:"La Villette to Oise Countryside", v:["nature","quiet","long_walk","local"], d:300,
s:"The complete towpath from industrial Parc de la Villette all the way to the countryside: 26 kilometers where the city progressively dissolves into actual farms and forests.",
st:"Most people know the Canal de l\'Ourcq around Parc de la Villette — it\'s where Paris cyclists hang out, where street musicians play, where the city is still on. But if you start at the south end of the park and commit to following the canal path north, the city literally disappears kilometer by kilometer.\n\nThe first 8km feels urban — you pass through the 19th arrondissement, alongside apartment blocks, under bridges, past péniche cafés. But by kilometer 10 you\'re past the périphérique. By kilometer 15 the apartment blocks end. By kilometer 20 you\'re walking alongside actual fields, actual cows, actual French countryside that feels 50 years away from Paris. Small villages appear: Emy-sur-Ourcq, then Dammartin-en-Goële. The path is a working towpath, unmaintained but walkable, with real locks and barges still passing.\n\nTake the full walk if you have the energy. Or walk the first 10-12km to La Courneuve forest entrance and return. The point is getting beyond where tourists know exists.",
im:"The sound changing from city traffic to wind in open fields, the smell of the canal itself (not unpleasant) shifting to hay and earth, the Ourcq river widening as it approaches its source, almost no people after kilometer 15, just the sound of your own footsteps and occasional cyclist passing.",
t:"Start at Bassin de la Villette (Métro Stalingrad). Follow canal north. Completely free. Path accessible dawn to dusk year-round but best in spring and autumn. First 5km is urban but manageable. Kilometers 15-26 are remote — bring water and snacks. Phone your location every 10km to someone. No cafés or services after kilometer 12. Return by the same path or, if continuing to the end near Pont-Arcy, arrange pickup or take a taxi from there (expensive from countryside). Best as a solo/two-person meditative walk.",
c:["day_trips","nature"], r:"g",
nn:"Canal de l\'Ourcq — L\'Évasion Complète", ns:"26 kilomètres du centre de Paris jusqu\'à la campagne — la ville disparaît progressivement.",
nst:"La plupart des gens connaissent le Canal de l\'Ourcq autour du Parc de la Villette — c\'est où les cyclistes parisiens traînent. Mais si vous commencez à l\'extrémité sud du parc et suivez le chemin du canal vers le nord, la ville disparaît littéralement kilomètre par kilomètre.\n\nLes 8 premiers kilomètres se sentent urbains — vous passez sous des ponts, à côté de blocs d\'appartements. Mais au kilomètre 10, vous êtes au-delà de la périphérique. Au kilomètre 15, les blocs d\'appartements se terminent. Au kilomètre 20, vous marchez à côté de vrais champs, de vraies vaches, de vraie campagne française. Les petits villages apparaissent: Emy-sur-Ourcq, puis Dammartin-en-Goële.",
nt:"Commencez au Bassin de la Villette (Métro Stalingrad). Suivez le canal vers le nord. Complètement gratuit. Sentier accessible de l\'aube au crépuscule mais mieux au printemps et automne. Apportez de l\'eau et des provisions. Les premiers 12 km ont des services, après c\'est très reculé.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:48, n:"Coulée Verte to Bois de Vincennes — The Full Green Thread", a:"Bastille to Vincennes", v:["nature","quiet","urban_nature","views"], d:90,
s:"The complete Coulée Verte elevated garden from Bastille through the full walk to the Bois de Vincennes entrance: the less-touristy second half where trees replace tourists.",
st:"Everyone walks the Coulée Verte from Bastille but stops at the Reuilly Gardens. This is where tourists photograph it and leave. But the path continues for another 4.5 kilometers, ascending through increasingly dense vegetation until you\'re walking through a genuine raised forest above the 12th arrondissement.\n\nThe first section (Bastille to Reuilly) is packed. Beautiful, designed, planted deliberately, but crowded with people taking selfies under wisteria. Keep walking. After Reuilly, the crowds evaporate. The path becomes wilder — it\'s still a curated walkway but now it\'s green enough that you forget you\'re in the city. The shade deepens. You pass over the Avenue Daumesnil on an elevated bridge and suddenly you\'re in a tunnel of foliage. Local joggers appear — actual neighborhood people, not tourists.\n\nThe path ends at the edge of the Bois de Vincennes near the Lac de Gravelle entrance. At that point you can enter the forest proper (separate entry fee) or loop back. But doing the complete Coulée Verte in one direction gives you the full progression from urban garden to something that genuinely feels like forest.",
im:"The ambient sound dropping from city to birdsong as you walk elevated above the street, the smell changing from pavement to vegetation, wisteria and climbing roses in May creating a green tunnel, light filtering through increasingly thick canopy, occasional glimpse of the city below framed by branches.",
t:"Start Métro Bastille (Sortie Coulée Verte). The elevated pathway is free and open dawn-dusk. First section (Bastille to Reuilly Gardens) is crowded. Second section (Reuilly to Vincennes entrance) is quiet and takes about 1 hour at a normal pace. Allow 1.5-2 hours for full walk with stops. Best in May-June when plantings are dense. Bring water. If entering Bois de Vincennes at end, that requires separate ticket (6 EUR) and you\'ll need transport back (Métro Château de Vincennes is 5 min walk from the end).",
c:["nature"], r:"g",
nn:"Coulée Verte à Bois de Vincennes", ns:"Le chemin vert complet — la deuxième moitié où les arbres remplacent les touristes.",
nst:"Tout le monde marche la Coulée Verte de Bastille mais s\'arrête aux Jardins de Reuilly. C\'est où les touristes la photographient. Mais le chemin continue pendant 4,5 kilomètres supplémentaires, montant à travers une végétation de plus en plus dense.\n\nLa première section (Bastille à Reuilly) est pleine de monde. La deuxième section devient sauvage — c\'est toujours une promenade aménagée mais assez verte pour que vous oubliiez que vous êtes en ville. Le sentier se termine à l\'entrée du Bois de Vincennes près du Lac de Gravelle. Vous pouvez ensuite entrer dans la forêt proprement dite.",
nt:"Départ Métro Bastille. Promenade surélevée gratuite et ouverte aube-crépuscule. Première section: pleine de monde. Deuxième section: tranquille, 1 heure. Total 1,5-2 heures. Mieux mai-juin. Apportez de l\'eau. Apportez de l\'eau. Métro Château de Vincennes à 5 min.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:49, n:"Forêt de Montmorency — Chestnut Forest & Mushroom Silence", a:"Montmorency / Enghien-les-Bains", v:["nature","forest","quiet","mushroom_season"], d:120,
s:"The 2,000-hectare chestnut and oak forest 30 minutes from Gare du Nord where autumn mushroom season brings locals with baskets and the silence is absolute.",
st:"This forest exists in almost complete obscurity internationally but is where Parisian families go in September to hunt mushrooms (cèpes, chanterelles, girolles). The forest is old-growth, dense, quiet, and smells like earth and possibility. The trees are massive — some chestnuts are 300+ years old and their trunks are wider than you are tall.\n\nYou don\'t need to hunt mushrooms to walk here, but the energy of people doing so — the attention to the ground, the baskets, the knowledge of where things grow — changes the feeling. In autumn (September-October), the forest is thick with foragers. In spring it\'s quieter but the light is strange and delicate. Winter is bare and cathedral-like with the massive trunks visible.\n\nThere\'s a small village of Montmorency at one end and Enghien-les-Bains (famous for its lake and belle époque past) at the other. Walk between them through the forest. The trail is marked loosely but you can get lost, which is partly the point. There are old stone markers from centuries of people walking this route.",
im:"Your feet on a carpet of leaves and moss an inch thick, the smell of damp earth and decay (the good kind that means life), sunlight barely reaching the forest floor, the occasional movement of a squirrel, the sound of nothing but wind in the canopy and your own breathing.",
t:"RER C to Montmorency or Enghien-les-Bains (30 min from central Paris, 3 EUR). Walk from either end through the forest (approximately 7km, 2 hours moderate pace). The forest has no clear single trail but is well-known locally and you won\'t be lost long if you maintain general direction. Bring a compass or phone GPS. No facilities in the forest. Best September-October for mushroom season atmosphere and light. Spring also excellent. Winter is walking through a cathedral of bare trees.",
c:["nature"], r:"g",
nn:"Forêt de Montmorency", ns:"2 000 hectares de châtaigniers — la forêt silencieuse des cueilleurs d\'automne.",
nst:"Cette forêt existe dans l\'obscurité presque complète internationalement mais c\'est où les familles parisiennes vont en septembre chasser les champignons (cèpes, chanterelles, girolles). La forêt est vieille, dense, calme, et sent la terre et les possibilités. Les arbres sont massifs — certains châtaigniers ont plus de 300 ans.\n\nVous n\'avez pas besoin de chasser les champignons pour marcher ici, mais l\'énergie des gens qui le font — l\'attention portée au sol, les paniers, la connaissance de l\'endroit où les choses poussent — change le sentiment. En automne (septembre-octobre), la forêt est épaisse de cueilleurs.",
nt:"RER C à Montmorency ou Enghien-les-Bains (30 min, 3 EUR). Marche entre les deux endroits à travers la forêt (environ 7 km, 2 heures). Aucune structure claire mais bien connu localement. Apportez une boussole. Mieux septembre-octobre.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
