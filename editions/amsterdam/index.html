{id:108,n:"Sunday Pillow Café — Dreams and Coffee",a:"De Pijp",v:["weird", "local", "quiet"],d:99,s:"A café where you can rent a pillow and nap for two euros while others watch—it\'s weirdly perfect",st:"Tired? Rent a pillow. Sleep on a communal bed. Wake to coffee. This exists. This is Amsterdam\'s weirdness in one room. It shouldn\'t work. It does.",im:"It\'s Sunday morning. A stranger sleeps two feet from you. You both nap peacefully. Tomorrow you\'ll never meet. Today you shared dreams.",t:"Tired? Rent a pillow. Sleep on a communal bed. Wake to coffee. This exists. This is Amsterdam\'s weirdness in one room. It shouldn\'t work. It does.\",im:\"It\'s Sunday morning. A stranger sleeps two feet from you. You both nap peacefully. Tomorrow you\'ll never meet. Today you shared dreams.\",t:\"De Pijp neighborhood. €2-3 per pillow. Come Monday-Thursday for less crowds. Bring socks. Respect the sleep.",c:["local_only", "weird"],r:"y",nn:"Sunday Pillow Café — Dreams and Coffee",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:109,n:"NEMO Rooftop Terrace",a:"Centrum",v:["beautiful","free","local"],d:10,s:"Free rooftop above the science museum — the best harbor panorama in Amsterdam",st:"Climb the exterior stairs of the NEMO Science Museum for free. The stepped green copper roof becomes a terrace with unbroken views over the IJ harbour and the rooftops of the old city. Closes at dusk.",im:"Time-travel: NEMO opened in 1997 — Renzo Piano designed the hull-shaped building to echo the old shipyards beneath it",t:"Free. Walk from Centraal 10 min east. Stairs on the south side of the building.",c:["high_spots"],r:"g",nn:"NEMO-dak",ns:"Gratis dak boven het wetenschapsmuseum — het beste haverpanorama van Amsterdam",nst:"Klim de buitentrap van het NEMO Science Museum op voor gratis panorama over de IJ-haven.",nt:"Gratis. 10 min lopen vanaf Centraal. Trap aan de zuidkant van het gebouw.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:110,n:"Schuttersgalerij Passage",a:"Centrum",v:["history","art","quiet"],d:8,s:"Covered passage with giant 17th-century group portraits — a secret museum street",st:"Hidden just behind the Amsterdam Museum, this atmospheric passage features massive civic guards portraits from the Golden Age. The light filters through skylights, creating a gallery-like atmosphere that feels frozen in time.",im:"These paintings document Amsterdam\'s militia companies from 1580-1810, capturing the city\'s power structure in oils.",t:"Free. Near Spui, next to Amsterdam Museum. Open 11am-5pm.",c:["history_big","architecture"],r:"g",nn:"Schuttersgalerij",ns:"Overdekte galerij met gigantische schilderijen — een geheime museumstraat",nst:"Verken de passage met monumentale schilderijen van gildemeisteren uit de Gouden Eeuw.",nt:"Gratis. Bij Spui, naast Amsterdam Museum. Open 11-17 uur.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:111,n:"Oudemanhuispoort Book Market",a:"Centrum",v:["hidden","local","art"],d:6,s:"Covered secondhand book passage — the soul of Amsterdam bibliophilia",st:"This glass-roofed covered passage is lined with old-book stalls and vintage magazine dealers. Perfect for rainy days, it\'s a genuine used-book ecosystem where locals hunt for forgotten treasures at bargain prices.",im:"The passage opened in 1897 on the site of a former orphanage (oudemanshuis); it\'s been a bookish hideaway for over a century.",t:"Free to wander. Bookstalls are open Wed-Sun. Between Oudezijds Voorburgwal and Oudezijds Achterburgwal.",c:["architecture","local_only"],r:"g",nn:"Oudemanhuispoort Boekenmarkt",ns:"Overdekte antieke boekenpassage — het hart van Amsterdam boekenliefhebbers",nst:"Ontdek vintage boeken en platen in deze gezellige overdekte passage vol antiquarische nostalgie.",nt:"Gratis. Boekenmarkt wo-zo. Tussen Oudezijds Voorburgwal en Achter.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:112,n:"Rokin Archaeological Display",a:"Centrum",v:["history","free","hidden"],d:5,s:"Free excavation artifacts in a metro station — Amsterdam\'s buried history on display",st:"In the Rokin metro station, a glass-enclosed exhibit shows medieval finds and Roman-era artifacts discovered during construction of the North/South line. It\'s surreal to see 800 years of history in a transitional space.",im:"Time-travel: Archaeological layers from 1200 AD onwards were exposed during the 2018 metro construction.",t:"Free, in Rokin metro station near Dam Square. Any train arriving there.",c:["free_museum","history_big"],r:"g",nn:"Rokin Archeologische Collectie",ns:"Gratis opgravingen in het metrostation — Amsterdams begraven verleden",nst:"Bekijk middeleeuwse vondsten in de glazen vitrine van het Rokin metrostation.",nt:"Gratis. In Rokin metrostation bij Dam. Alle treinen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:113,n:"Rijksmuseum — Night Watch",a:"South",v:["famous","history","beautiful"],d:120,s:"Rembrandt\'s masterpiece: light breaking across faces frozen in motion.",st:"Walk straight to Room 2.12. The painting fills your entire vision—light breaking across faces, the chaos of readiness.\n\nVisit before 10am or after 4pm when tour groups leave.",im:"Golden light sweeping across frozen faces. A dog barking. Muskets raised.",t:"Rijksmuseum, Museumplein 1. €22.50 advance. Arrive 9:30am. Tram 2, 5, or 12.",c:["greatest_hits","famous","history_big"],r:"g",nn:"Rijksmuseum — Nachtwacht",ns:"Rembrandts Meesterwerk verlicht door licht.",nst:"Zaal 2.12 op tweede verdieping. Het schilderij vult je hele gezichtsveld.",nt:"Rijksmuseum, Museumplein 1. €22,50 vooraf. Kom om 09:30.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:114,n:"Westerkerk Tower",a:"Canal Ring",v:["famous","high_spots","history"],d:30,s:"85 meters of stairs to bells that have rung since 1685. The view is secondhand; the climb is everything.",st:"Walk up dark stone stairs spiraling forever. Then emerge into the bell chamber.\n\nFrom the top you see Amsterdam flatten. But the climb is the point.",im:"Standing next to a 600-kilogram bell. It rings so loud you taste metal.",t:"Westerkerk, Prinsengracht 279. €10. Stairs steep. Wed-Sat afternoon, Sun morning.",c:["greatest_hits","famous","high_spots","history_big"],r:"y",nn:"Westerkerk Toren",ns":"85 meter spiraalvormige trappen naar klokken.",nst":"Donker, smalle stenen trappen omhoog.",nt":"Westerkerk, Prinsengracht 279. €10.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */}
