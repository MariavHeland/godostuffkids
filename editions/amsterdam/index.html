<script type="text/javascript">
const{useState,useEffect,useMemo}=React;const P=[
{id:1,n:"Jeugland — Build, Raft, Cable Car",a:"Tuinpark Amstelglorie, Amsterdam Oost",v:["adventure","free","building"],s:"Amsterdam's largest free adventure playground: build shelters with real tools, raft across the water channel, ride a cable car over the pond, pet farm animals. Free for all children under 14. No ticket, no booking.",st:"Jeugland (Youth Land) is the best thing Amsterdam has that most visitors never find. It's tucked inside a garden allotment park in Oost, and you find it by walking through the gate and suddenly being somewhere completely different. There's a water channel where children build and sail rafts — not toy rafts, but real-enough rafts that float with a child on them. A cable car runs above the pond on a wire; children operate it themselves. There's a building site with timber, tools, and adult supervision where you can genuinely build a shelter. Farm animals in an enclosure. Sandpits. Slides built into a hill. The whole thing is free for children under 14. Adults pay a small entry fee to accompany.",im:"Your child is standing on a raft they built — genuinely their own construction — pushing off with a pole into the water channel, completely concentrating, and making it to the other bank.",t:"Tram 3 or Bus 41 to Borgerwetering/Tuinpark Amstelglorie. Walk 5min through the allotment park. Jeugland is inside. Children under 14: FREE. Adults: small entry fee. Open Tuesday–Sunday from midday in spring/summer. Check jeugland.nl for hours.",c:["make"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:false,toilet:true,rainy:false,duration_min:120,duration_max:300,nn:"Jeugland — Bouwen, vlotten en kabelbaan",ns:"Amsterdam's grootste gratis avontuursspeelplaats: shelters bouwen met echte gereedschappen, vlotten over het waterkanaal, kabelbaan over de vijver, en boerderijdieren aaien. Gratis voor kinderen tot 14 jaar.",nst:"Jeugland is het beste dat Amsterdam heeft dat de meeste bezoekers nooit vinden. Er is een waterkanaal waar kinderen vlotten bouwen en berijden — niet speelgoedvlotten, maar echte vlotten die drijven. Een kabelbaan over de vijver, door kinderen zelf bediend. Een bouwplaats met hout, gereedschappen en begeleiding. Boerderijdieren. Alles gratis voor kinderen tot 14 jaar.",nt:"Tram 3 of Bus 41 naar Borgerwetering/Tuinpark Amstelglorie. 5 min lopen door volkstuinpark. Kinderen t/m 14 jaar: GRATIS. Volwassenen: kleine entreeprijs. Open di–zo vanaf 12:00 in lente/zomer. Check jeugland.nl.",quiz:[{q:"What is the maximum number of children who can ride the cable car at once?",a:"One at a time — you operate it yourself and pull back across",options:["5","3","One at a time — you operate it yourself and pull back across","2"],age_min:5,fun_fact:"Adventure playgrounds were invented in Denmark in 1943 — the idea was to give children real tools and real risk, not safe plastic equipment."},{q:"What material do children use to build the rafts at Jeugland?",a:"Whatever they can find on the site — timber, barrels, rope",options:["Foam boards","Pre-made kits","Whatever they can find on the site — timber, barrels, rope","Inflatable platforms"],age_min:7,fun_fact:"Floating is not about weight — it's about displaced water. A heavy timber raft floats because it displaces more water than it weighs."}],food:"Bring a full picnic — you'll be here for hours. Café de Amsteltuin in the allotment park sells coffee and simple snacks.",greatest_hit:true},
{id:2,n:"NDSM Wharf — Free Ferry + Street Art",a:"Amsterdam Noord (free GVB ferry from Centraal)",v:["free","ferry","street_art"],s:"A 15-minute free ferry ride from Centraal Station drops you at a former shipyard with the world's largest indoor street art museum (STRAAT), free access to the wharf, and a kids' programme most Sundays. The ferry itself is an event.",st:"The GVB ferry from Centraal to NDSM is free — and it goes across the IJ waterway, which means your children watch Amsterdam's skyline recede from the water for the first time. NDSM was a decommissioned shipyard that Amsterdam turned over to artists, makers, and cultural organisations in the early 2000s. The scale is still industrial: enormous warehouse buildings, cranes still standing, the wharf itself stretching along the water. STRAAT Museum occupies one of the warehouses — it's a proper gallery of spray-paint art, monumental in scale. Children under 12 enter free. There are murals across the entire wharf exterior that are free to walk around. Sundays often have a free children's programme in the wharf itself.",im:"The ferry is pulling away from Centraal Station dock and your children are at the railing watching the city get smaller on the water, and they suddenly understand that Amsterdam is surrounded by water, not just crossed by it.",t:"Free GVB ferry from Centraal Station (follow 'NDSM' signs to ferry dock, far left). 15-min crossing. STRAAT Museum: children under 12 free, adults approximately €18–20 (verify current price at straatmuseum.nl before visiting). Wharf: always free. Sunday free kids programme: check stichtingndsm.nl. Open daily.",c:["stories"],r:"g",age_min:4,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:true,duration_min:90,duration_max:240,nn:"NDSM-werf — Gratis veer + straatkunst",ns:"Een gratis veerpont van 15 minuten van Centraal Station brengt je naar een voormalige scheepswerf met het grootste indoor straatkunstmuseum ter wereld (STRAAT), gratis toegang tot de werf, en een kinderprogramma op de meeste zondagen.",nst:"De GVB-veerpont van Centraal naar NDSM is gratis — en vaart over het IJ. De NDSM-werf is een oude scheepswerf die Amsterdam heeft overgedragen aan kunstenaars en culturele organisaties. STRAAT Museum zit in een van de loodsen: een volwaardig galerie van spuitverf-kunst op monumentale schaal. Kinderen tot 12 jaar gratis.",nt:"Gratis GVB-veer van Centraal Station (volg 'NDSM'-borden naar de veerboot, uiterst links). 15 min oversteek. STRAAT Museum: kinderen t/m 12 gratis, volwassenen ca. €18–20 (controleer actuele prijs op straatmuseum.nl). Werf: altijd gratis. Zondags kinderprogramma: check stichtingndsm.nl.",quiz:[{q:"How many minutes does the free ferry take to cross the IJ to NDSM?",a:"15 minutes",options:["5 minutes","30 minutes","15 minutes","45 minutes"],age_min:5,fun_fact:"The IJ is not a river — it's a bay that was once open water connected to the North Sea. Amsterdam built dams and locks to control it, which is why the city is called Amster-dam."},{q:"What did NDSM stand for when it was a working shipyard?",a:"Nederlandsche Dok en Scheepsbouw Maatschappij (Dutch Dock and Shipbuilding Company)",options:["Noord-Dutch Ship Museum","Nederlandsche Dok en Scheepsbouw Maatschappij (Dutch Dock and Shipbuilding Company)","National Design and Street Mural","New Dutch Sea Masters"],age_min:9,fun_fact:"NDSM built ships here from 1894 to 1984 — at its peak it employed 10,000 people. When it closed, the buildings were left intact and gradually taken over by artists who couldn't afford city-centre rents."}],food:"Café de Ceuvel (floating café on polluted land remediation project) is 10 minutes' walk. Several food trucks at the wharf on weekends.",greatest_hit:true},
{id:3,n:"Sloterplas — Free Lake Swimming + Zoo",a:"Nieuw-West, Amsterdam",v:["free","swimming","beach"],s:"A free lake beach in Nieuw-West with a petting zoo, nature playground, and proper sand. Lifeguarded in summer. 30 minutes from Centraal by tram. Locals use it, tourists don't.",st:"Sloterplas is Amsterdam's largest lake beach and almost no tourist ever goes there. It's in the Nieuw-West neighbourhood, historically a post-war social housing district, now increasingly mixed. The beach has sand, lifeguards in summer, a paddling pool for toddlers, and a genuine nature playground with logs, rope structures, and climbing frames built into the landscape. The petting zoo nearby has rabbits, chickens, goats, and a donkey. The lake itself is clean — officially designated for swimming. Free beach chairs in designated areas. The whole thing costs nothing. Locals come by bike, spread blankets, and stay all day.",im:"A child feeding a goat at the petting zoo while behind them, visible through the fence, another child surfaces from a lake dive, and both of these things are free and 200 metres apart.",t:"Tram 1 to Osdorpplein, then walk 15min south. Or Bus 19 to Sloterpark. Sloterplas lake beach. Free entry. Lifeguards Jun–Aug. Petting zoo open most days. Paddling pool for toddlers. Toilets at beach.",c:["water"],r:"g",age_min:1,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:120,duration_max:300,nn:"Sloterplas — Gratis meren zwemmen + kinderboerderij",ns:"Een gratis strandmeer in Nieuw-West met een kinderboerderij, natuurspeeltuin en echt zand. Bewaking in de zomer. 30 minuten van Centraal per tram. Lokale bevolking gebruikt het, toeristen niet.",nst:"Sloterplas is Amsterdam's grootste strandmeer en bijna geen toerist gaat er naartoe. Strand met zand, bewaking in de zomer, een peuterbad, en een echte natuurspeeltuin. De kinderboerderij heeft konijnen, kippen, geiten en een ezel. Het meer is officieel aangewezen voor zwemmen. Gratis.",nt:"Tram 1 naar Osdorpplein, dan 15 min lopen. Of Bus 19 naar Sloterpark. Sloterplas strandmeer. Gratis toegang. Bewaking jun–aug. Toiletten bij het strand.",quiz:[{q:"What animal in the Sloterplas petting zoo is the loudest?",a:"The donkey — it brays loudly and without warning",options:["The chickens","The rabbits","The donkey — it brays loudly and without warning","The goats"],age_min:4,fun_fact:"Donkeys were the primary transport animal in Amsterdam before bicycles — they pulled carts through the city for centuries. Now there are more bicycles in Amsterdam than people."},{q:"Why is the Sloterplas water safe for swimming?",a:"It has regular water quality tests — officially designated as a bathing lake",options:["It's filtered by the city","It has regular water quality tests — officially designated as a bathing lake","The water comes from underground springs","Chemicals are added to keep it clean"],age_min:7,fun_fact:"Dutch water quality testing is among the most rigorous in Europe — the government monitors over 600 bathing locations weekly in summer."}],food:"Beach snack bar on site in summer. Otherwise bring a full picnic.",greatest_hit:false},
{id:4,n:"Begijnhof — Secret Medieval Courtyard",a:"Spui, Amsterdam Centrum",v:["history","free","hidden"],s:"A hidden 14th-century courtyard through an unmarked door on Spui square. Inside: 47 houses, the oldest wooden house in Amsterdam (1420), a tiny English church, and almost complete silence. Free. 8am–5pm.",st:"You find the door by knowing to look for it — there's no sign from the street, just an arched wooden door in a wall. Push through and you're inside a medieval enclosed courtyard that has been here continuously since the 1300s. The Begijnhof was home to the Beguines — a lay religious order of women who chose a communal religious life without becoming nuns. They lived here, independently, for five centuries. The houses around the courtyard are still occupied (residential — please be quiet). House number 34 (Het Houten Huis) is the oldest wooden residential building in Amsterdam, dating to around 1420. The English Reformed Church in the centre of the courtyard was built in 1419. It is genuinely, unexpectedly peaceful.",im:"Stepping through an unmarked door in a busy Amsterdam street into a completely silent medieval courtyard, grass in the centre, tiny houses around the edges, no traffic noise.",t:"Metro, tram, or walk to Spui square. The Begijnhof entrance is on Spui, to the right of the Athenaeum Boekhandel bookshop. Look for the arched wooden door in the wall — no signage. Open daily 8am–5pm. Free. Very quiet — please keep children's voices down. No toilets inside.",c:["stories"],r:"g",age_min:5,age_max:14,budget:"free",pushchair:true,toilet:false,rainy:true,duration_min:20,duration_max:45,nn:"Begijnhof — Geheime middeleeuws hofje",ns:"Een verborgen 14e-eeuws hofje achter een ongemarkeerde deur op het Spui. Binnen: 47 huizen, het oudste houten huis van Amsterdam (1420), een kleine Engelse kerk, en bijna volledige stilte. Gratis. 8:00–17:00.",nst:"Je vindt de deur door te weten dat je ernaar moet zoeken — er is geen bord zichtbaar vanaf de straat, alleen een gewelfde houten deur in een muur. Erin en je staat in een middeleeuws hofje dat al bestaat sinds de 14e eeuw. Het Begijnhof was thuis van de begijnen — leken die een gemeenschappelijk religieus leven leidden zonder non te worden. Huis nr. 34 is het oudste houten woonhuis van Amsterdam (ca. 1420).",nt:"Metro, tram of lopen naar het Spui. De ingang van het Begijnhof is op het Spui, rechts van de Athenaeum Boekhandel. Zoek de gewelfde houten deur in de muur — geen borden. Dagelijks 8:00–17:00. Gratis. Stil blijven — het is een woonhofje.",quiz:[{q:"Approximately what year was the oldest wooden house in the Begijnhof built?",a:"Around 1420",options:["1200","Around 1420","1600","1750"],age_min:7,fun_fact:"Most of Amsterdam's medieval wooden buildings burned down in great fires in 1421 and 1452 — this house survived both. The city then banned wooden construction for safety."},{q:"Who were the Beguines who lived in the Begijnhof for five centuries?",a:"A lay religious order of women who chose communal life without becoming nuns",options:["Catholic nuns from a monastery","A lay religious order of women who chose communal life without becoming nuns","Protestant missionaries from England","The wives of Amsterdam's merchant guild"],age_min:9,fun_fact:"The Beguine movement was unusual for medieval Europe because women chose it voluntarily and could leave — it wasn't a permanent vow like becoming a nun."}],food:"Multiple cafés on Spui square outside. Café Hoppe (1670) is the oldest café in Amsterdam — right on Spui.",greatest_hit:true},
{id:5,n:"NEMO Rooftop — Free & Highest Square",a:"Oosterdok 2, Amsterdam Centrum",v:["free","views","science"],s:"The NEMO science museum's sloping green roof is free to climb and is technically the highest square in the Netherlands — with water fountains running down the sides in summer. You don't need a museum ticket.",st:"NEMO's building is designed by Renzo Piano as a giant ship hull rising over the IJ waterway. The roof is the highest public square in Amsterdam — technically in the entire Netherlands — and it's free to access by walking up the exterior staircase on the eastern side. In summer the water features run: thin sheets of water flow down the copper roof panels, children paddle in the overflow, and the view takes in the entire port area, the eye Film Museum across the water, and Amsterdam's roofline. The Energetica installation nearby has water-powered demonstrations children can operate. There are small cafés on the roof.",im:"Your child operating a hand pump that sends a thin sheet of water down the copper roof slope, watching it fan out and disappear into the gutter, deciding immediately to do it again.",t:"Bus 22 or walk 10min east of Centraal Station. NEMO Science Museum, Oosterdok 2. Roof access: FREE from the staircase on the east side of the building — no ticket needed. Museum itself: paid entry. Roof open during museum hours. Toilets inside the museum (pay access).",c:["discover"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,nn:"NEMO-dak — Gratis & hoogste plein",ns:"Het hellende groene dak van het NEMO-museum is gratis te beklimmen en is technisch het hoogste plein van Nederland — met waterfonteinen die in de zomer langs de zijkanten stromen. Je hebt geen museumticket nodig.",nst:"NEMO is ontworpen door Renzo Piano als een gigantische scheepsromp boven het IJ. Het dak is het hoogste openbare plein van Amsterdam — technisch in heel Nederland — en gratis toegankelijk via de buitentrap aan de oostzijde. In de zomer stromen waterfonteinen down de koperen dakpanelen. Uitzicht over de haven, het Eye Filmmuseum en Amsterdam's daklijn.",nt:"Bus 22 of 10 min lopen ten oosten van Centraal. NEMO Science Museum, Oosterdok 2. Dakaccesss: GRATIS via de buitentrap aan de oostzijde — geen ticket nodig. Museum zelf: betaald. Open tijdens museumtijden.",quiz:[{q:"Which famous architect designed the NEMO building?",a:"Renzo Piano",options:["Rem Koolhaas","Renzo Piano","Frank Lloyd Wright","Gerrit Rietveld"],age_min:8,fun_fact:"Renzo Piano also designed the Pompidou Centre in Paris and the Shard in London — he's known for buildings that deliberately show their structure on the outside rather than hiding it."},{q:"What shape was NEMO designed to look like?",a:"A ship hull emerging from the water",options:["A wave","A ship hull emerging from the water","A submarine","A whale"],age_min:6,fun_fact:"The building is built directly over the entrance to a road tunnel — if you look at the waterfront next to NEMO you can see where the tunnel dips underground."}],food:"Café on the roof (summer). Café Brasserie NEMO inside. Otherwise bring food to eat on the roof with the view.",greatest_hit:false},
{id:6,n:"Het Woeste Westen — Westerpark Wild Zone",a:"Westerpark, Amsterdam Centrum",v:["free","adventure","nature"],s:"A wild adventure zone inside Westerpark where children build huts, make rafts, watch insects, and do things with mud. Run by youth workers. Free. The name means 'The Wild West' — it earns it.",st:"Het Woeste Westen is Amsterdam's city-centre nature play area — tucked into Westerpark between the gasworks buildings and the canal. Youth workers are on site during opening hours, but they're there to support, not supervise in the helicopter sense. Children build huts from branches and foraged materials. There's a raft-building area with access to the canal. A bug-watching station with magnifying glasses and reference sheets. A mud kitchen. A fire area for older children (supervised). The age range is deliberately wide — a 4-year-old finds the mud and bug sections compelling; a 12-year-old is doing serious construction. Both are happy.",im:"A child up to their elbows in mud, explaining very seriously what they are making, and a youth worker leaning in to actually listen to the explanation.",t:"Tram 3 or Bus 21 to Westerpark. Enter from Haarlemmerweg side. Het Woeste Westen is inside the park — look for the rough-timber entrance structure. Free. Check woestewesten.nl for hours — varies seasonally. Ages 0–12.",c:["wild"],r:"g",age_min:3,age_max:12,budget:"free",pushchair:false,toilet:true,rainy:false,duration_min:90,duration_max:180,nn:"Het Woeste Westen — Wilde Zone in Westerpark",ns:"Een wilde avontuurzone in Westerpark waar kinderen hutten bouwen, vlotten maken, insecten bekijken en dingen met modder doen. Gratis.",nst:"Het Woeste Westen is Amsterdam's stadse natuur-speelplaats in Westerpark. Jongerenwerkers zijn aanwezig tijdens openingstijden. Kinderen bouwen hutten van takken. Vlotbouwzone met toegang tot het kanaal. Insectenobservatie met vergrootglazen. Modderkeuken. Vuurplaats voor oudere kinderen (begeleid).",nt:"Tram 3 of Bus 21 naar Westerpark. Ingang via Haarlemmerweg-zijde. Gratis. Check woestewesten.nl voor tijden — varieert per seizoen. Leeftijd 0–12.",quiz:[{q:"What natural material do children use most at Het Woeste Westen?",a:"Branches, sticks, and mud from the park itself",options:["Pre-cut timber from a supplier","Branches, sticks, and mud from the park itself","Foam blocks","Recycled plastic crates"],age_min:5,fun_fact:"'Woeste' in Dutch means 'wild' or 'desolate' — The Wild West of Westerpark is a deliberate pun on the English Wild West, and on the idea that wild nature exists even inside the city."},{q:"Which activity at Het Woeste Westen requires access to water?",a:"Raft building — there's a canal access section",options:["The mud kitchen","The bug station","Raft building — there's a canal access section","The fire area"],age_min:6,fun_fact:"Amsterdam has more canals than Venice — 165 canals, about 100km total. Almost any outdoor activity in Amsterdam eventually involves water."}],food:"Brouwerij 't IJ brewery café is a 15-min walk through Westerpark. Otherwise bring picnic.",greatest_hit:false},
{id:7,n:"De Poezenboot — Cat Sanctuary Houseboat",a:"Singel canal, Amsterdam Centrum",v:["animals","canal","unique"],s:"A houseboat on the Singel canal that has been a cat sanctuary since 1966. The cats live on the boat. You visit them on the boat. The boat moves gently on the water while you're inside. It is one of the genuinely odd things Amsterdam has.",st:"Henriette van Weelde started taking in stray cats on her houseboat in 1966. She kept adding more. By the time she died the boat was an institution and had to continue — it became a foundation, received a purpose-built houseboat in 2007, and now operates as a fully registered cat sanctuary with 40–50 cats at any time. You pay a donation to enter. The cats are all rescue animals — some sociable, some reserved. The boat rocks gently. There are cat hammocks, cat towers, cat bridges at ceiling level. Some cats ignore you completely. Some want attention. Children who are quiet and gentle find this compelling; children who charge in find it less satisfying. Either way it's about five minutes' walk from the Flower Market.",im:"A cat in a hammock at eye level, regarding your child with complete indifference from a gently rocking houseboat on the Singel canal.",t:"Walk or tram to Koningsplein. De Poezenboot is moored on the Singel canal between Koningsplein and the Flower Market — look for the boat with cats in the windows. Open daily 1pm–3pm (Sun 1pm–2pm). Entry by donation (around €2–3 suggested). Max 15 visitors at a time — sometimes queue.",c:["wild"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:true,duration_min:20,duration_max:40,nn:"De Poezenboot — Kattenasiel op een woonboot",ns:"Een woonboot op de Singel die al een kattenasiel is sinds 1966. De katten wonen op de boot. Jij bezoekt ze op de boot. De boot beweegt zachtjes op het water terwijl je binnen bent.",nst:"Henriette van Weelde begon in 1966 met het opvangen van zwerfkatten op haar woonboot. Ze bleef er meer toevoegen. Nu is het een stichting met een speciaal gebouwde woonboot (2007) en 40-50 katten. Je betaalt een donatie. Sommige katten zijn sociaal, andere niet. De boot wiegt zachtjes.",nt:"Loop of tram naar Koningsplein. De Poezenboot ligt aangemeerd aan de Singel tussen Koningsplein en de Bloemenmarkt — zoek de boot met katten in de ramen. Open dagelijks 13:00–15:00 (zo 13:00–14:00). Toegang op donatie (ca. €2–3). Max 15 bezoekers.",quiz:[{q:"How many cats live on De Poezenboot at any one time?",a:"Between 40 and 50 — it varies",options:["About 5","About 10","Between 40 and 50 — it varies","Over 100"],age_min:5,fun_fact:"The first cat boat started because a mother cat with kittens arrived on the doorstep of Henriette's houseboat in winter. She let them in. Word spread among Amsterdam's strays."},{q:"What year did De Poezenboot receive its purpose-built houseboat?",a:"2007",options:["1966","1980","1995","2007"],age_min:8,fun_fact:"The boat is registered as a foundation — it receives donations and adoption fees, and all cats are neutered, vaccinated, and microchipped before adoption."}],food:"Bloemenmarkt (Flower Market) is 2 minutes away — there are cafés along the Singel. Café Luxembourg on Spui is excellent.",greatest_hit:false},
{id:8,n:"OBA — Amsterdam's 7-Floor Public Library",a:"Oosterdokseiland 143, Amsterdam Centrum",v:["free","library","rainy_day"],s:"Amsterdam's main public library: 7 floors, free entry, a ground-floor children's library with read-aloud corners and play areas, a rooftop café with views, and nothing required of you except to be quiet and stay as long as you like.",st:"The OBA (Openbare Bibliotheek Amsterdam) was designed by Jo Coenen and opened in 2007 on Oosterdokseiland — a former railway yard right behind Centraal Station. It's huge: 7 floors, 28,000 square metres, half a million books. The ground floor children's section has bean bags, low shelves, picture books in English and Dutch, a soft play corner for toddlers, and a reading-aloud area with scheduled free story sessions. The upper floors have quiet study areas, teen sections, music rooms, and a roof terrace café. Everything is free — you can sit for hours, use the wifi, read anything on the shelves. Children who are readers will want to stay all day. Children who aren't will find the bean bags and play corner sufficient.",im:"Your child horizontal on a giant bean bag, surrounded by picture books, in a warm public library on a cold Amsterdam afternoon, and it is free and warm and quiet and you don't have to leave.",t:"2-min walk from Centraal Station — follow signs for OBA. Oosterdokseiland 143. Free entry. Open Mon–Fri 10am–10pm, Sat–Sun 10am–6pm. Children's section: ground floor. Rooftop café: floor 7. Toilets on every floor. WiFi.",c:["rescue"],r:"g",age_min:0,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:true,duration_min:60,duration_max:240,nn:"OBA — Amsterdam's 7-verdiepingen Openbare Bibliotheek",ns:"Amsterdam's centrale openbare bibliotheek: 7 verdiepingen, gratis toegang, een kinderboekenhoek op de begane grond met voorleeshoeken en speelhoeken, een dakcafé met uitzicht.",nst:"De OBA (Openbare Bibliotheek Amsterdam) is ontworpen door Jo Coenen en opende in 2007. 7 verdiepingen, 28.000 m², een half miljoen boeken. De kindersectie heeft beanbags, prentenboeken in het Engels en Nederlands, een speelhoekje voor peuters, en een voorleeshoek. Alles gratis.",nt:"2 min lopen van Centraal Station. Oosterdokseiland 143. Gratis toegang. Open ma–vr 10:00–22:00, za–zo 10:00–18:00. Kindersectie: begane grond. Dakcafé: 7e verdieping. Toiletten op elke verdieping. WiFi.",quiz:[{q:"How many floors does the OBA Amsterdam library have?",a:"7 floors",options:["3 floors","5 floors","7 floors","10 floors"],age_min:5,fun_fact:"When it opened in 2007, the OBA was one of the largest public libraries in Europe. It now has over 1.4 million visitors per year."},{q:"What is on the top floor (floor 7) of the OBA?",a:"A rooftop café with views over Amsterdam",options:["The children's section","A rooftop café with views over Amsterdam","Silent study rooms","A cinema"],age_min:6,fun_fact:"The OBA was built on Oosterdokseiland — an artificial island that used to be a railway yard. The whole island was redeveloped in the 2000s, and the library was the centrepiece."}],food:"Café on floor 7 with rooftop terrace. Ground floor also has a café. Bring your own food — it's allowed in the library.",greatest_hit:false},
{id:9,n:"Amsterdamse Bos — Three Times Central Park",a:"Amstelveen / Amsterdam Zuid",v:["free","forest","swimming"],s:"Amsterdam's own forest: three times the size of Central Park. Free swimming lake, goat farm, pancake house, cycling tracks, canoe hire, and horse stables. An hour from Centraal by tram, 20 minutes by bike.",st:"Amsterdamse Bos (Amsterdam Forest) was built during the 1930s depression as a job creation scheme — the government employed 20,000 workers to plant trees and dig canals on reclaimed polder land. Now it's a functioning forest: 1,000 hectares, with deer, foxes, over 150 bird species, proper trails, and facilities. The Bosbaan rowing lake has a free swimming area on the east side. The goat farm (Geitenboerderij Ridammerhoeve) is free to visit — you can feed the goats and watch cheese being made. The Pancake House is a genuine institution. Bike hire is available at the forest entrance. In summer, outdoor theatre runs here.",im:"A picnic blanket in a clearing, the sound of wind in the beech trees, your child 20 metres away investigating a log, and the fact that you're inside the city of Amsterdam.",t:"Bus 166/170 from Centraal to Amsterdamse Bos main entrance (35 min). Or tram 25 to Station Tram 25. Goat farm: Ridderspoor 1, check for free opening hours. Bosbaan swimming: east shore of rowing lake. Everything free except pancake house and bike hire. Toilets at main entrance.",c:["wild"],r:"g",age_min:1,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:180,duration_max:480,nn:"Amsterdamse Bos — Drie keer Central Park",ns:"Amsterdam's eigen bos: drie keer zo groot als Central Park. Gratis zwemmen in het meer, geitenboerderij, pannenkoekenrestaurant, fietspaden en kanoën.",nst:"Het Amsterdamse Bos werd aangelegd in de jaren '30 als werkverschaffing — 20.000 arbeiders plantten bomen en groeven kanalen op drooggemaakt polderland. Nu een functioneel bos: 1.000 hectare, met herten, vossen, meer dan 150 vogelsoorten. De geitenboerderij is gratis te bezoeken. Het Pannenkoekenrestaurant is een echte instelling.",nt:"Bus 166/170 van Centraal naar Amsterdamse Bos hoofdingang (35 min). Geitenboerderij: Ridderspoor 1. Bosbaan zwemmen: oostoever roeibaan. Alles gratis behalve pannenkoekenrestaurant en fietsverhuur. Toiletten bij hoofdingang.",quiz:[{q:"How was Amsterdamse Bos created?",a:"Built in the 1930s as a job creation scheme during the Great Depression",options:["It was a natural forest that already existed","Built in the 1930s as a job creation scheme during the Great Depression","Planted by Napoleon during French rule","Created by Dutch East India Company workers in the 17th century"],age_min:8,fun_fact:"The workers didn't just plant trees — they dug the canals, shaped the hills, and created the entire landscape by hand. The 'hills' in the forest are artificial, built from excavated polder soil."},{q:"How many times bigger than Central Park in New York is Amsterdamse Bos?",a:"Three times bigger",options:["The same size","Twice as big","Three times bigger","Five times bigger"],age_min:7,fun_fact:"Central Park in New York is 341 hectares. Amsterdamse Bos is 1,000 hectares. Yet Amsterdam's total population is a fraction of New York's — it's an extraordinary ratio of green space per resident."}],food:"Boerderij Meerzicht pancake house inside the forest. Geitenboerderij has a small shop selling goat cheese. Bring a picnic for the full day.",greatest_hit:true},
{id:10,n:"Miniature Houses — De 9 Straatjes crack",a:"Westerstraat 54 area, Amsterdam Centrum",v:["art","hidden","free"],s:"A series of tiny, intricate miniature scenes installed in the cracks and gaps between old Amsterdam canal buildings — art installations in the walls themselves, in De 9 Straatjes (The Nine Streets). You have to look very carefully at eye level.",st:"Amsterdam's De 9 Straatjes district has a series of tiny art installations built into the gaps between buildings — spaces that are usually noticed by nobody. Artist Thomas Gofton and others have installed miniature domestic scenes, tiny figures, and elaborate tiny environments in these wall cracks at various heights. Some are at adult eye level, some are lower — meaning children sometimes find them first, which is satisfying. The installations change occasionally. Some have been in place for years; others are new. The best ones are around Westerstraat, Hartenstraat, and Berenstraat. This is best done as a slow walk through De 9 Straatjes — which also happens to be Amsterdam's most interesting independent shopping area.",im:"Your child pointing excitedly at a crack between two canal houses where there is a tiny furnished living room with a lamp switched on and a cat sitting on a tiny sofa.",t:"Walk from Dam Square (10 min west) or tram to Westermarkt. De 9 Straatjes starts at Westerstraat and runs south through 9 cross-streets. Walk slowly and look at wall gaps at various heights. Free. Best in daylight.",c:["discover"],r:"g",age_min:4,age_max:12,budget:"free",pushchair:true,toilet:false,rainy:true,duration_min:30,duration_max:90,nn:"Miniatuurhuisjes — De 9 Straatjes spleet",ns:"Een reeks kleine, ingewikkelde miniatuurscènes in de spleten en gaten tussen oude Amsterdamse grachtenhuizen — kunstinstallaties in de muren zelf, in De 9 Straatjes.",nst:"In De 9 Straatjes zijn kleine kunstinstallaties gebouwd in de spleten tussen panden — ruimtes die normaal door niemand worden opgemerkt. Kunstenaar Thomas Gofton en anderen hebben miniatuurhuiskamers, kleine figuren en ingewikkelde omgevingen in deze muurkieren geïnstalleerd. Sommige op ooghoogte volwassenen, sommige lager — kinderen vinden ze soms als eerste.",nt:"Loop vanaf de Dam (10 min naar het westen) of tram naar Westermarkt. De 9 Straatjes begint bij Westerstraat en loopt zuidwaarts door 9 dwarsstraten. Loop langzaam en kijk in muurkieren op verschillende hoogtes. Gratis. Best bij daglicht.",quiz:[{q:"What should you do to find the miniature installations in De 9 Straatjes walls?",a:"Walk slowly and look at the gaps between buildings at different heights",options:["Look up at the rooflines","Walk slowly and look at the gaps between buildings at different heights","Look at the top of the canal bridges","Ask at the nearest shop"],age_min:5,fun_fact:"Amsterdam's canal houses are so narrow because houses were taxed by their street frontage in the 17th century — the narrower the house, the less tax you paid."},{q:"Why are Amsterdam's canal houses so narrow?",a:"Houses were taxed by street frontage width in the 17th century",options:["Because the land was expensive","Because the city was small","Houses were taxed by street frontage width in the 17th century","So more boats could dock alongside them"],age_min:8,fun_fact:"The narrowest house in Amsterdam on the Singel canal is just 1 metre wide at its narrowest point — though that's the back of the house. The narrowest front-facing house is about 2.02 metres."}],food:"De 9 Straatjes has excellent independent cafés. Winkel 43 (Noordermarkt) does the best apple pie in Amsterdam, 5 min walk.",greatest_hit:false},
{id:11,n:"Albert Cuyp Markt — the real Amsterdam market",a:"Albert Cuypstraat, De Pijp, Amsterdam",v:["market","food","local"],s:"Amsterdam's longest and busiest street market: 260 stalls on 1.2km of Albert Cuypstraat in De Pijp. Stroopwafels fresh off the iron. Herring with raw onion. Surinamese roti. Turkish bread. Monday to Saturday. Free to walk through.",st:"The Albert Cuyp market has been running since 1905. It stretches 1.2km through De Pijp — once Amsterdam's working-class neighbourhood, now one of its most interesting mixed-use areas. 260 stalls sell food, clothing, spices, cheese, fish, fabric, and plants. The food section is the event: fresh stroopwafels made on hot irons and handed over warm, herring stands where locals eat raw herring by holding the fish over their mouths by the tail, Surinamese roti and rice, Indonesian satay, Turkish börek, Dutch cheese to taste. It's loud, it smells of things cooking, it's not organised for tourists. Children navigate between adults. The market runs Monday to Saturday, 9am to 6pm.",im:"A stall with stroopwafels on a hot iron, the smell reaching 10 metres before you arrive, your child watching the iron press close and waiting for the signal that it's ready.",t:"Tram 4 to Albert Cuypstraat. The market runs along Albert Cuypstraat, De Pijp. Open Mon–Sat 9am–6pm (shorter hours in winter). Free to enter. Cash or card at most stalls. Crowded Saturdays — go before 11am or after 3pm.",c:["navigate"],r:"g",age_min:3,age_max:14,budget:"free",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,nn:"Albert Cuypmarkt — de echte Amsterdamse markt",ns:"Amsterdam's langste en drukste straatmarkt: 260 kramen op 1,2 km Albert Cuypstraat in De Pijp. Verse stroopwafels van het ijzer. Haring met rauwe ui. Surinaamse roti. Maandag tot zaterdag. Gratis doorlopen.",nst:"De Albert Cuypmarkt bestaat al sinds 1905. 1,2 km door De Pijp met 260 kramen. Het voedselgedeelte is het evenement: verse stroopwafels van hete ijzers, haringkramen, Surinaamse roti, Indonesische satay, Turkse börek, Nederlandse kaas. Het is luidruchtig, het ruikt naar eten, het is niet voor toeristen georganiseerd.",nt:"Tram 4 naar Albert Cuypstraat. Open ma–za 9:00–18:00. Gratis. Zaterdag druk — ga voor 11:00 of na 15:00.",quiz:[{q:"How do Dutch locals traditionally eat raw herring at the market?",a:"Holding the fish by the tail and lowering it into their mouth",options:["On a plate with a fork","Holding the fish by the tail and lowering it into their mouth","In a bread roll with mustard","Deep fried with chips"],age_min:5,fun_fact:"The traditional Dutch raw herring is called 'Hollandse Nieuwe' — it's only available from late May when the new season's herring is caught. It's cured in salt but not cooked."},{q:"How long has the Albert Cuyp market been running?",a:"Since 1905 — over 100 years",options:["Since 1950","Since 1975","Since 1905 — over 100 years","Since 1850"],age_min:7,fun_fact:"The Albert Cuypstraat is named after the Dutch painter Jacob van Ruisdael's contemporary, Albert Cuyp — a 17th-century Dutch Golden Age painter known for his cattle scenes."}],food:"You are at the market. Buy stroopwafels fresh off the iron (€1.50), herring if you're adventurous, cheese to sample, and roti if you want a full meal.",greatest_hit:false},
{id:12,n:"Vondelpark Free Concerts + Petting Zoo",a:"Vondelpark, Amsterdam Oud-Zuid",v:["free","music","park"],s:"Amsterdam's most famous park has a free petting zoo open year-round (rabbits, chickens, goats, sheep), and free bandstand concerts every summer weekend. The park itself is a social institution — locals treat it as an extension of their living room.",st:"Vondelpark was laid out in 1865 and is Amsterdam's equivalent of London's Hyde Park — except Dutch, which means it has a smaller scale, more bicycles, and more practical use. The Vondelpark Openluchttheater (open-air theatre) runs free performances every summer from May to September: Wednesday to Sunday afternoons and evenings, a mix of pop, jazz, classical, children's theatre, and comedy. You sit on the grass or rent a chair. The petting zoo (Kinderspeelplaats) on the west side of the park has goats, sheep, chickens, and rabbits — open year-round, free, no booking. There are multiple playgrounds inside the park. The park's rose garden is unreasonably beautiful in June.",im:"Children lying on grass in front of the open-air bandstand while a jazz band plays, the music carrying across the park, and around them other families doing exactly the same thing.",t:"Tram 1/2/5 to Van Baerlestraat or Hobbemastraat. Vondelpark main entrance. Petting zoo: Vondelpark 7a (west side). Open year-round, free. Bandstand: check openluchttheater.nl for summer programme — free, no tickets required. Toilets in the park.",c:["move"],r:"g",age_min:0,age_max:14,budget:"free",pushchair:true,toilet:true,rainy:false,duration_min:60,duration_max:240,nn:"Vondelpark gratis concerten + kinderboerderij",ns:"Amsterdam's bekendste park heeft een gratis kinderboerderij het hele jaar (konijnen, kippen, geiten, schapen), en gratis bandstand-concerten elke zomerdagse dag. Bewoners gebruiken het als verlengstuk van hun woonkamer.",nst:"Vondelpark is aangelegd in 1865. Het Vondelpark Openluchttheater geeft gratis voorstellingen elke zomer van mei t/m september: wo–zo. Aanbod: pop, jazz, klassiek, kindertheater, comedy. Je zit op het gras of huurt een stoel. De kinderboerderij heeft geiten, schapen, kippen en konijnen — het hele jaar open, gratis.",nt:"Tram 1/2/5 naar Van Baerlestraat of Hobbemastraat. Kinderboerderij: Vondelpark 7a. Open het hele jaar, gratis. Openluchttheater: check openluchttheater.nl. Gratis, geen tickets. Toiletten in het park.",quiz:[{q:"In which year was Vondelpark first laid out?",a:"1865",options:["1750","1865","1910","1930"],age_min:7,fun_fact:"Vondelpark is named after the 17th-century Dutch poet and playwright Joost van den Vondel — considered the greatest Dutch poet. There's a statue of him near the main entrance."},{q:"What is the name of Vondelpark's free outdoor theatre?",a:"Vondelpark Openluchttheater",options:["Vondelpark Stadion","Vondelpark Openluchttheater","Het Grote Theater","Parkscene Amsterdam"],age_min:8,fun_fact:"The open-air theatre was nearly demolished in the 1970s for being too expensive. A campaign by Amsterdam residents saved it — and it's been free ever since."}],food:"Multiple cafés inside the park — Café Vertigo under the old Film Museum is excellent. Bring a picnic for the concerts.",greatest_hit:true,stay:"Summer concerts: May to September",stay_verify:"Check openluchttheater.nl each year for dates and programme"},

{id:13,n:"De Tolhuistuin Garden",a:"NDSM",v:["beautiful", "nature", "local", "free"],d:5,s:"Secret garden-theater-cinema hybrid in an old factory",st:"Artists reclaimed a warehouse and built gardens inside. Now strangers grow vegetables, watch films, and eat dinner together in a former industrial ruin. It\'s a community experiment that actually works.",im:"It\'s 2010. Hands in soil planting tomatoes. Sunset over raised beds. Someone\'s cooking outside.",t:"Artists reclaimed a warehouse and built gardens inside. Now strangers grow vegetables, watch films, and eat dinner together in a former industrial ruin. It\'s a community experiment that actually works.\",im:\"It\'s 2010. Hands in soil planting tomatoes. Sunset over raised beds. Someone\'s cooking outside.\",t:\"Tolhuistuin, NDSM-plein 5. Free entry. Open afternoons and evenings. Check website for events. Ferry from Central.",c:["free_museum", "nature", "local_only"],r:"g",nn:"De Tolhuistuin Garden",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},

{id:16,n:"Windmills of Amsterdam North",a:"Noord",v:["history", "beautiful", "quiet"],d:12,s:"Four ancient windmills still standing, still milling, still creaking like they\'re grinding centuries",st:"Get on the free ferry and cross the Ij. At Zaanse Schans, wooden windmills turn in the wind the way they did 400 years ago. Walk inside one and smell grain dust and oil. Time stops.",im:"It\'s 1750. A miller\'s son learns to read the wind. Sails turn. Grain flows. The river carries boats to the world.",t:"Get on the free ferry and cross the Ij. At Zaanse Schans, wooden windmills turn in the wind the way they did 400 years ago. Walk inside one and smell grain dust and oil. Time stops.\",im:\"It\'s 1750. A miller\'s son learns to read the wind. Sails turn. Grain flows. The river carries boats to the world.\",t:\"Zaanse Schans, Zaandam (north of Amsterdam). Free ferry from Central Station (behind the station). Small fee to enter windmills (€5-7). Walk around free.",c:["history_big", "nature", "architecture"],r:"g",nn:"Windmills of Amsterdam North",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:17,n:"Free Ferry to Noord",a:"Noord",v:["free", "beautiful", "local"],d:13,s:"Best free view of Amsterdam from the water—the 5-minute commute tourists skip",st:"Workers ride this every day. Tourists stay on the south bank. The ferry gives you Amsterdam from the water—canals, spires, light hitting old brick. It\'s free. Most people don\'t know.",im:"It\'s 7am. The city wakes across black water. Bicycles lean against railings. A bell rings.",t:"Workers ride this every day. Tourists stay on the south bank. The ferry gives you Amsterdam from the water—canals, spires, light hitting old brick. It\'s free. Most people don\'t know.\",im:\"It\'s 7am. The city wakes across black water. Bicycles lean against railings. A bell rings.\",t:\"Behind Centraal Station. Three free ferries run all night. Pick any one. Ride both ways for the full effect. Best at sunrise or sunset.",c:["free_museum", "beautiful", "local_only"],r:"g",nn:"Free Ferry to Noord",ns:"Water, bruggen en het hartslag van de stad.",nst:"Bruggen buigen zich over water. Sluizen gaan op en neer. Het is mechanisch en mooi. Bomen wuiven erbovenuit. Locals picknicken op de oevers. Het kanaal ademt. Het leeft.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:18,n:"Bijlmer Murals and Community",a:"Bijlmer",v:["street_art", "local", "weird"],d:14,s:"The neighborhood the city tried to forget—now painting its own story back",st:"High-rise housing meant for cars, not people. It failed and turned into something real—cheap housing for artists and migrants. Now giant murals cover the blocks. It\'s raw and alive.",im:"It\'s 1980. Families look out from cement balconies at a design that doesn\'t work. Artists move in because rent is nothing. They paint the walls.",t:"High-rise housing meant for cars, not people. It failed and turned into something real—cheap housing for artists and migrants. Now giant murals cover the blocks. It\'s raw and alive.\",im:\"It\'s 1980. Families look out from cement balconies at a design that doesn\'t work. Artists move in because rent is nothing. They paint the walls.\",t:\"Bijlmerplein area, Bijlmer neighborhood (south, metro line 50/54). Walk freely. Street art appears constantly. Local cafés welcome curious visitors.",c:["street_art", "local_only"],r:"g",nn:"Bijlmer Murals and Community",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},

{id:50,n:"Wild Swimming Beaches (Sloterstrand)",a:"West",v:["nature","free","sport"],d:25,s:"Legal designated swim spots — escape the canals for open water",st:"Sloterstrand on Sloterplas is an official swim beach where locals take dips in summer. The shallow lake is clean and monitored; bring a towel and a cold beer from a supermarket.",im:"Sloterplas was created in 1886 as an industrial water feature; now it\'s Amsterdam\'s neighborhood swimming hole.",t:"Free. Tram 2 to Slotermeer. Check the Zwemwater app for water safety.",c:["parks","free_museum"],r:"g",nn:"Sloterstrand Zwemplek",ns:"Wettelijke zwemstranden — ontsnap aan de grachten",nst:"Zwem in de schone wateren van Sloterplas met locals in de zomer.",nt:"Gratis. Tram 2 naar Slotermeer. Controleer de Zwemwater-app.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:51,n:"Vondelpark",a:"South",v:["famous","beautiful","parks"],d:120,s:"47 hectares where Amsterdam forgets to be a city and just lives.",st:"Rent bikes, lie in grass, watch street performers, attend free summer theater.\n\nOn warm weekends, hundreds sit drinking wine, being ordinary and perfect.",im:"A woman reading in grass. Bikes stacked against a tree. Children splashing in fountains.",t:"Vondelpark, South. Free entry. Best warm weekends for crowds, weekday mornings quiet.",c:["greatest_hits","famous","beautiful","parks"],r:"g",nn:"Vondelpark",ns":"47 hectare waar Amsterdam vergeet een stad te zijn.",nst":"Dit is geen toeristisch spektakel. Huur fietsen.",nt":"Vondelpark. Gratis toegang.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:52,n:"Central Station",a:"Centrum",v:["famous","architecture","beautiful"],d:30,s:"Built on three artificial islands. A palace for commuters. Victorian ambition meets daily life.",st":"Red brick, ornamental towers, massive clock faces. Light through arched windows.\n\nTrains arrive and depart with choreographed punctuality.",im":"A clock face showing 4:47. A train departing. An old couple holding hands.",t":"Amsterdam Central Station. Free. Best mid-morning. Bring a camera.",c":["greatest_hits","famous","architecture","beautiful"],r":"g",nn":"Amsterdam Centraal",ns":"Gebouwd op drie kunstmatige eilanden.",nst":"Het gebouw is 19e-eeuwse ambitie.",nt":"Amsterdam Centraal. Gratis binnenkomen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:53,n:"Canal Cruise at Dusk",a":"Centrum",v:["famous","beautiful","romantic_water"],d:75,s":"17th-century canal system from water-level. Light turns golden. Bridges multiply.",st":"Evening cruise as light turns amber then deep blue. Bridges light up.\n\nBest cruises are slow—90 minutes, unlocked boat. Skip loud commentary.",im":"Brick glowing orange-red, reflected perfectly. Every bridge creates a frame.",t":"Most depart Prins Hendrikkade or Leidseplein. Evening cruises €17-25. Book online.",c":["greatest_hits","famous","beautiful","romantic_water"],r":"y",nn":"Grachtentocht bij Zonsondergang",ns":"Het hele 17e-eeuwse kanaalenstelsel vanuit waterperspectief.",nst":"Drijf door de stad terwijl het licht ambergeel wordt.",nt":"Vertrek van Prins Hendrikkade. €17-25. Online boeken.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:54,n:"Prinsengracht at Dusk",a":"Canal Ring",v:["famous","history","beautiful"],d:45,s":"The street where she rode her bicycle before hiding.",st":"Before writing her diary, she was a girl on this street. Ordinary life.\n\nYou stand where a normal girl lived normally. Beautiful not because she was here.",im":"Girl on bicycle rides away. Canal windows show ordinary lives. Light golden.",t":"Prinsengracht, between Westermarkt and Leidsegracht. Walk 5-6pm summer.",c":["greatest_hits","famous","history_big","beautiful"],r":"g",nn":"Prinsengracht bij Zonsondergang",ns":"De straat waar zij op haar fiets reed.",nst":"Voordat Anne Frank een dagboek schreef.",nt":"Prinsengracht. Wandel om 17:00-18:00 uur in zomer.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:55,n:"Rembrandt House Museum — Where He Painted The Night Watch",a:"Centrum",v:["nerd","free_culture"],d:90,s:"The actual house where Rembrandt lived and painted masterpieces. Recreated studio with his pigments and copper plates. Etching demonstrations daily.",st:"Rembrandt lived in this house during his successful years, before bankruptcy forced him to move. The studio is recreated exactly—same light, same windows. You see the tools he used, the pigments he mixed. In this room, on this easel, he painted The Night Watch (now in the Rijksmuseum). Walking through, you understand genius was just a man struggling with light and shadow in a room.",im:"Looking at an easel with Rembrandt's actual tools, morning light through the same windows it fell through 350 years ago.",t:"Sint-Anthonisbreestraat 4, Centrum (metro to Centraal, walk 5 min). €15 entry. Open 10am-6pm daily. Morning light (10-11am) is best for understanding his work. Etching demonstrations happen multiple times daily—watch a craftsperson work the copper plate. Allow 60-90 minutes. Photography allowed.",c:["nerd","free_culture"],r:"g",nn:"Rembrandthuis — Waar Hij De Nachtwaak Schilderde",ns:"Het echte huis waar Rembrandt meesterwerken schilderde",nst:"Rembrandt woonde in dit huis tijdens zijn succesvolle jaren. De studio is exact nagebouwd—zelfde licht, zelfde ramen.",nt:"Sint-Anthonisbreestraat 4, Centrum. €15 ingang. Morgen licht (10-11) is beste. Etsingdemonstraties dagelijks.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:56, n:"Amsterdamse Bos — The Forest Bigger Than You\'d Guess", a:"Amstel", v:["nature","beautiful"], d:120, s:"1,000 hectares of woodland with goat farms, pancake houses, and water sports—a proper forest three times the size of Vondelpark.", st:"Think you know Amsterdam parks? The Amsterdamse Bos is a completely different world—a proper forest with 1,000 hectares to explore. Take the bus from Amstel station and suddenly you\'re cycling through trees that have no idea they\'re inside a city.\n\nThe highlights aren\'t subtle. There\'s an actual goat farm where you can watch animals you didn\'t expect to find. There\'s a pancake house literally in the woods. The rowing course is where the water gets serious. Rent a bike, pack a morning, wander like you own the place. By the time you find the café, you\'ll have forgotten it\'s Amsterdam.", im:"Trees surrounding you in every direction, goat farm in the distance, pancake house emerging from the forest, water reflecting sky.", t:"Bus from Amstel station to Amsterdamse Bos. Rent a bike for full exploration. Best any season. Bring water and camera. Half day minimum, full day better. Visit goat farm and pancake house.", c:["nature","parks"], r:"g", nn:"Amsterdamse Bos", ns:"Een bos van 1.000 hectare vol geitenboerderijen, pannekoekenhuizen en watersport.", nst:"Denk je dat je Amsterdamse parken kent? Het Amsterdamse Bos is een compleet ander wereld—een echt bos met 1.000 hectare om te verkennen. Neem de bus vanaf Amstel Station en plotseling fietst je door bomen die niet weten dat ze in een stad zijn.", nt:"Bus van Amstel Station naar Amsterdamse Bos. Fiets huren. Elk seizoen goed. Breng water en camera mee. Minstens halve dag, volledige dag beter.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:57, n:"Kennemerduinen — European Bison and Sand Paths to the Sea", a:"North Holland", v:["nature","wild"], d:180, s:"Coastal dunes 30 minutes by train with sand paths through wild landscape where European bison have been reintroduced.", st:"Thirty minutes by train and you\'re at the dunes of Kennemerduinen. The train drops you into a landscape that looks like it predates humans entirely. Sand paths twist between wild vegetation. The North Sea is close—you can feel it getting closer.\n\nThis is one of Europe\'s rare bison projects. Walk quietly and you might see them. You probably won\'t. But the knowledge that they\'re here, that they\'ve been brought back from extinction to live in these dunes, changes how you move through the landscape. The sand cools your feet. The wind talks to itself. By the time you see the sea, you\'ve forgotten what day it is.", im:"Sand paths winding through dunes, wild vegetation against sky, North Sea approaching, bison moving through landscape.", t:"Train from Amsterdam to Kennemerduinen (30 minutes). Walk sand paths through dunes. Bring water and sun protection. Spring through autumn best. Allow half to full day. Look for bison quietly.", c:["high_spots","nature"], r:"g", nn:"Kennemerduinen", ns:"Duinen aan zee met wilde vegetation en herintroduceerde Europese bizons.", nst:"Dertig minuten met de trein en je bent in de duinen van Kennemerduinen. De trein zet je af in een landschap dat eruitziet als het mensen nog niet bestaat. Zandpaden kronkelen tussen wilde vegetatie.", nt:"Trein vanuit Amsterdam (30 minuten). Wandel zandpaden. Breng water en zonnebescherming mee. Jaar rond goed. Halve tot volledige dag.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:58, n:"Amstelpark — The Neighborhood Secret Behind the RAI", a:"South Amsterdam", v:["nature","hidden"], d:100, s:"Behind the RAI Convention Center—rhododendron gardens, miniature train, windmill—a park locals keep secret from outsiders.", st:"Behind the RAI Convention Center is a park that locals keep for themselves. Amstelpark doesn\'t advertise. It doesn\'t need to.\n\nThe rhododendron garden is spectacular if you time it right—a burst of color that feels like a secret that was meant just for you. There\'s a miniature train that children ride and adults pretend not to want to ride. There\'s a windmill. The whole thing is tucked away from the main city rhythm, which is exactly the point. It\'s a place where tourists have better things to do elsewhere. Walk the water edges, find the quiet benches, sit in the kind of park that makes you wonder why it\'s not crowded.", im:"Rhododendron blooms in bright colors, miniature train curving through gardens, quiet benches by water, windmill in distance.", t:"Public transport to Amstelpark area south of city centre. Rhododendron best in spring. Any season works. Bring a book and time to sit. 2-3 hours for full appreciation. Local atmosphere.", c:["nature","parks"], r:"g", nn:"Amstelpark", ns:"Een tuinpark met rododendrons, miniatuurtreintje en molen—lokaal geheim achter RAI.", nst:"Achter het RAI Convention Center is een park dat locals voor zichzelf houden. Amstelpark adverteert niet. Dat hoeft ook niet.", nt:"Openbaar vervoer naar Amstelpark-gebied. Rododendron het mooist in lente. Elk seizoen goed. Breng een boek mee. 2-3 uur.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:59, n:"Diemerbos — Reclaimed Land Turned Wild", a:"Diemen", v:["nature","beautiful"], d:120, s:"A 25-year-old planted forest on reclaimed land—already feels ancient with thick undergrowth and roe deer moving through the trees.", st:"Diemerbos shouldn\'t exist this way. It was planted 25 years ago on land that used to be water. But forests move fast when you give them space. Now it feels like it\'s been here forever—the kind of place where trees have secrets and paths fork unexpectedly.\n\nThe cycling distance from Diemen is reasonable. The payoff is a forest that doesn\'t feel young, even though it is. Roe deer move through here. Birds you didn\'t know were in the Netherlands sing from branches. The undergrowth is thick. It\'s proof that land can heal if you just leave it alone long enough. Walk slow. The forest rewards patience.", im:"Forest paths winding through thick trees, roe deer visible in distance, undergrowth dense and rich, dappled light on forest floor.", t:"Cycling distance from Diemen station. Flat paths through forest. Any season good. Bring binoculars for wildlife. Move slowly for best experience. 2-3 hours allows full exploration. Quiet atmosphere.", c:["nature","parks"], r:"g", nn:"Diemerbos", ns:"Een jong bos op hergewonnen land dat al voelt als eeuwenoud—met reeën en dichte ondergroei.", nst:"Diemerbos zou op deze manier niet moeten bestaan. Het werd 25 jaar geleden geplant op land dat ooit water was. Maar bossen groeien snel als je ze ruimte geeft. Nu voelt het als sinds altijd hier—een plek waar bomen geheimen hebben.", nt:"Fietsafstand van Diemen station. Vlakke paden. Elk seizoen goed. Verrekijker voor wilde dieren. Langzaam gaan. 2-3 uur.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:60, n:"Naardermeer — The Oldest Nature Reserve in the Netherlands", a:"Naarden", v:["nature","wild"], d:150, s:"Established 1906, this protected wetland of reeds and water is reached by boat from Naarden—cormorants, spoonbills, egrets hunting.", st:"Naardermeer was protected in 1906—before most people had heard of nature conservation. Take the train to Naarden and the boat excursion puts you in a world of water and reeds that feels completely separate from Dutch order.\n\nCormorants hunt. Spoonbills wade with their unlikely bills cutting water. Egrets stand like white punctuation. The marshes stretch out and it becomes clear that humans are passengers here, not managers. The boat moves slowly enough to let you see things. You\'ll need patience and you\'ll need binoculars, but the reward is one of Europe\'s most important wetlands, preserved for more than a century. This is what matters.", im:"Wetland stretching to horizon, cormorants diving, spoonbills wading with distinctive bills, egrets standing still, reeds rustling.", t:"Train from Amsterdam to Naarden (30 minutes). Boat excursion from Naarden into wetlands. Bring binoculars for birdwatching. Patient observation required. Spring and autumn best for migrations. 2-3 hours on boat. Early morning best.", c:["nature","parks","swimming"], r:"g", nn:"Naardermeer", ns:"\'s Lands oudste natuurreservaat uit 1906—reed marshes vol vogels bereikt per boot.", nst:"Naardermeer werd beschermd in 1906—voor de meeste mensen ooit van natuurbescherming hadden gehoord. Neem de trein naar Naarden en de boottocht brengt je in een wereld van water en riet.", nt:"Trein van Amsterdam naar Naarden. Boottocht. Verrekijker voor vogels. Geduld nodig. Lente en herfst best. 2-3 uur op boot. Vroeg ochtend best.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:61,n:"Begijnhof Courtyard",a:"Centrum",v:["hidden", "history", "quiet"],d:1,s:"Medieval almshouse courtyard hiding behind a busy shopping street",st:"Step through the archway and enter 1300. A ring of tiny houses surrounds a chapel where beguines—religious women living communal life—worked and prayed. It\'s still a neighborhood today, just frozen in time.",im:"It\'s 1600. Women in white linen tend gardens between stone cottages. Church bells echo off old brick. No men allowed.",t:"Step through the archway and enter 1300. A ring of tiny houses surrounds a chapel where beguines—religious women living communal life—worked and prayed. It\'s still a neighborhood today, just frozen in time.\",im:\"It\'s 1600. Women in white linen tend gardens between stone cottages. Church bells echo off old brick. No men allowed.\",t:\"Free entry. Begijnhof 34, Centrum. Respect residents—it\'s a real community. Quiet afternoons best. Don\'t photograph people.",c:["history_big", "courtyards", "local_only"],r:"g",nn:"Begijnhof Courtyard",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:62,n:"Amsterdam Museum Hidden Wing",a:"Centrum",v:["hidden", "history"],d:2,s:"The floor nobody sees—street art and counterculture in the museum basement",st:"Slip downstairs past tourists staring at paintings. The basement galleries pulse with punk posters, squat manifestos, and Provo movement ephemera. This is Amsterdam\'s radical heart in cardboard boxes and neon.",im:"It\'s 1965. Student protestors glue posters to canal walls at midnight. The air smells like spray paint and defiance.",t:"Slip downstairs past tourists staring at paintings. The basement galleries pulse with punk posters, squat manifestos, and Provo movement ephemera. This is Amsterdam\'s radical heart in cardboard boxes and neon.\",im:\"It\'s 1965. Student protestors glue posters to canal walls at midnight. The air smells like spray paint and defiance.\",t:\"Amsterdam Museum, Kalverstraat 92. Pay entry fee. Ask staff where the street art collection lives—most visitors never find it.",c:["history_big", "street_art", "local_only"],r:"g",nn:"Amsterdam Museum Hidden Wing",ns:"Kunst die van de muren spreekt en de straat transformeert.",nst:"Kijk omhoog. Kleuren springen eruit. Kunstenaars claim de muren. Gemeenschappen volgen. Het is echt. Het is politiek. Het is levend. Dit is waar de stad zichzelf schildert.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:63,n:"Hofje van Brouwer",a:"Jordaan",v:["hidden", "history", "quiet"],d:3,s:"Courtyards that survived the war intact",st:"Walk through doorways and find chains of hidden courtyards dating to the 1700s. Stone plaques name dead brewers and their families. Gardens grow where workers once lived. The city noise vanishes.",im:"It\'s 1780. A brewer\'s widow tends herb gardens in her personal courtyard. Children play in the center square. No one passes who hasn\'t been invited.",t:"Walk through doorways and find chains of hidden courtyards dating to the 1700s. Stone plaques name dead brewers and their families. Gardens grow where workers once lived. The city noise vanishes.\",im:\"It\'s 1780. A brewer\'s widow tends herb gardens in her personal courtyard. Children play in the center square. No one passes who hasn\'t been invited.\",t:\"Elandsgracht 107-109, Jordaan. Free to enter courtyards. Daytime only. Knock softly if gates are closed.",c:["history_big", "courtyards", "local_only"],r:"g",nn:"Hofje van Brouwer",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:64,n:"NDSM Wharf Squat Evolution",a:"NDSM",v:["history", "weird", "local"],d:4,s:"Shipyard turned artist squatter kingdom turned cultural hub—watch gentrification happen live",st:"Abandoned dry dock. Artists moved in. Squatters built a city inside with galleries, studios, punk bars, and performance spaces. Now it\'s legal and massive. See where counterculture becomes Instagram.",im:"It\'s 1985. Kids in DIY jumpsuits weld metal sculptures. Bands rehearse in rusted hulls. Graffiti covers every surface.",t:"Abandoned dry dock. Artists moved in. Squatters built a city inside with galleries, studios, punk bars, and performance spaces. Now it\'s legal and massive. See where counterculture becomes Instagram.\",im:\"It\'s 1985. Kids in DIY jumpsuits weld metal sculptures. Bands rehearse in rusted hulls. Graffiti covers every surface.\",t:\"NDSM-plein 1, Noord. Free to wander. Live events weekends. Ferry across for free from Amsterdam Central.",c:["street_art", "history_big", "architecture"],r:"g",nn:"NDSM Wharf Squat Evolution",ns:"Kunst die van de muren spreekt en de straat transformeert.",nst:"Kijk omhoog. Kleuren springen eruit. Kunstenaars claim de muren. Gemeenschappen volgen. Het is echt. Het is politiek. Het is levend. Dit is waar de stad zichzelf schildert.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:65,n:"Jordaan Neighborhood Hidden Bars",a:"Jordaan",v:["local", "night", "hidden"],d:6,s:"Brown bars where old men have sat in the same chair for 30 years",st:"No signs. No tourists. Walk in and you\'re in someone\'s living room made public. Sawdust on wooden floors. Drinks poured by the owner who knows everyone. These are the bars that survived.",im:"It\'s 1970. Cigarette smoke curls under bare bulbs. A man plays harmonica in the corner. No one\'s made a phone call here in decades.",t:"No signs. No tourists. Walk in and you\'re in someone\'s living room made public. Sawdust on wooden floors. Drinks poured by the owner who knows everyone. These are the bars that survived.\",im:\"It\'s 1970. Cigarette smoke curls under bare bulbs. A man plays harmonica in the corner. No one\'s made a phone call here in decades.\",t:\"Westerstraat area, Jordaan. You won\'t find names. Just walk quiet streets and look for light through old windows. Order a borrel (shot) and a bier (beer).",c:["local_only", "night"],r:"g",nn:"Jordaan Neighborhood Hidden Bars",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
{id:66,n:"Plantage Resistance Museum",a:"Plantage",v:["history", "hidden"],d:9,s:"Where Amsterdam\'s WWII fighters planned in secret",st:"Underground resistance cells met in hidden rooms. In this neighborhood, ordinary people forged documents, hid refugees, and plotted against occupation. The buildings still stand with their secrets.",im:"It\'s 1943. A woman in an ordinary dress enters through a bakery back door carrying false papers sewn into her coat lining.",t:"Underground resistance cells met in hidden rooms. In this neighborhood, ordinary people forged documents, hid refugees, and plotted against occupation. The buildings still stand with their secrets.\",im:\"It\'s 1943. A woman in an ordinary dress enters through a bakery back door carrying false papers sewn into her coat lining.\",t:\"Visit Verzetsmuseum (Resistance Museum) at Plantage Kerklaan 61. Or walk the quiet residential streets where safe houses were marked by tiny chalk symbols.",c:["history_big"],r:"g",nn:"Plantage Resistance Museum",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},

{id:69,n:"Amstel River Locks and Industrial Past",a:"Oost",v:["history", "hidden", "beautiful"],d:15,s:"Where the city controlled water and commerce for 500 years",st:"Lock keepers operated gates that separated the city from the sea. Watch the locks work. Stand where merchants negotiated tolls. The river still flows the way it always did.",im:"It\'s 1600. A lock keeper winches a gate. A ship loaded with spices waits. The flow of trade depends on this exact moment.",t:"Lock keepers operated gates that separated the city from the sea. Watch the locks work. Stand where merchants negotiated tolls. The river still flows the way it always did.\",im:\"It\'s 1600. A lock keeper winches a gate. A ship loaded with spices waits. The flow of trade depends on this exact moment.\",t:\"Amstel Lock (Amstelsluis), Oost neighborhood near Magere Brug. Free to watch. Locks operate throughout day. Best in early morning when light hits water.",c:["history_big", "architecture"],r:"g",nn:"Amstel River Locks and Industrial Past",ns:"Water, bruggen en het hartslag van de stad.",nst:"Bruggen buigen zich over water. Sluizen gaan op en neer. Het is mechanisch en mooi. Bomen wuiven erbovenuit. Locals picknicken op de oevers. Het kanaal ademt. Het leeft.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},

{id:71,n:"Mozes en Aäron Church Crypt",a:"Centrum",v:["history", "hidden", "quiet"],d:19,s:"A hidden synagogue inside a church—four centuries of religious sleight of hand",st:"Catholics built a church. Jews built a synagogue inside it. For 200 years, the building looked like one thing from the street and meant another thing inside. It\'s a building that lies beautifully.",im:"It\'s 1750. A Jewish family enters through what looks like a warehouse. Inside, a synagogue with a thousand candles. The priest upstairs knows. Everyone knows. No one says anything.",t:"Catholics built a church. Jews built a synagogue inside it. For 200 years, the building looked like one thing from the street and meant another thing inside. It\'s a building that lies beautifully.\",im:\"It\'s 1750. A Jewish family enters through what looks like a warehouse. Inside, a synagogue with a thousand candles. The priest upstairs knows. Everyone knows. No one says anything.\",t:\"Mozes en Aäronkerk, Jodenbreestraat 2-4, Centrum. Open for visits afternoons. Crypt and synagogue visible. Small donation expected.",c:["history_big", "architecture"],r:"g",nn:"Mozes en Aäron Church Crypt",ns:"Een authentieke plek waar locals werkelijk thuiskomen.",nst:"Dit is waar authenticiteit volhoudt. Waar locals werkelijk komen. Waar geschiedenis nog steeds lucht geeft. Waar tradities zich mengen met moderniteit. Dit is waar het leven echt gebeurt.",nt:"Neem de tijd om rond te wandelen. Let op details. Spreek met locals als ze open staan. Respecteer de ruimten. Bezoek zonder je telefoon. De ochtend is beter dan de middag. Weekends veranderen de sfeer. Kom met water en goede schoenen.",age_min:4,age_max:14,budget:"check",pushchair:false,toilet:false,rainy:false,duration_min:30,duration_max:90,quiz:[]  /* ⚠️ QUIZ NEEDED — add before publishing */},
